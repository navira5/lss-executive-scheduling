                                          With(
                                              {monthStart:Date(2027,startMonth+(Value-1)*monthStep,1)},
                                              With(
                                                  {candidate:DateAdd(monthStart,Mod(dayNumber-Weekday(monthStart,StartOfWeek.Sunday)+7,7)+7*(weekNumber-1),TimeUnit.Days)},
                                                  With(
                                                      {outsideSelectedMonth:Month(candidate)<>Month(monthStart),existing:LookUp(colBoardEvents,Find("BOARD|RuleId="&Text(r.ID)&"|",'Source Rule')>0&&Find("Generated date: "&Text(candidate,"yyyy-mm-dd"),'Planning Notes')>0),blocked:Month(candidate)<>Month(monthStart)||CountRows(Filter(colClosures,EventDate=candidate))>0||CountRows(Filter(colBoardEvents,EventDate=candidate&&Find("BOARD|RuleId="&Text(r.ID)&"|",'Source Rule')=0))>0},
                                                      With(
                                                          {saved:Patch('LSS Planned Calendar',If(IsBlank(existing.ID),Defaults('LSS Planned Calendar'),existing),{Title:r.Title,EventDate:candidate,Category:"Board",Status:If(blocked,"Blocked","Ready for Review"),'Source Rule':"BOARD|RuleId="&Text(r.ID)&"|"&r.Title,'Planning Notes':"Board workflow"&Char(10)&"Generated date: "&Text(candidate,"yyyy-mm-dd")&Char(10)&"Current date: "&Text(candidate,"yyyy-mm-dd")&Char(10)&"Manual override: No"&Char(10)&"Override reason: No reason supplied"&Char(10)&"Exception approved: No"&Char(10)&"Conflict: "&If(outsideSelectedMonth,"The selected fifth weekday does not occur in this month. Recommendation only; no date was automatically changed.",If(blocked,"Closure or Board collision. Recommendation only; no date was automatically changed.","None"))})},
                                                          Collect(colBoardDraftReceipt,{EventID:saved.ID,GroupName:r.Title,GeneratedDate:candidate,CurrentDate:candidate,State:saved.Status,Recommendation:If(blocked,"Recommendation only; no date was automatically changed.","")})
                                                      )
                                                  )
                                              )
                                          )
                                      );
                                      Refresh('LSS Planned Calendar');
                                      ClearCollect(colBoardEvents,Filter('LSS Planned Calendar',EventDate>=Date(2027,1,1)&&EventDate<Date(2028,1,1)&&Category="Board"));
                                      Set(varBoardDraftReceiptVisible,true);
                                      Navigate(Screen2)
                                  )
                              )
                          )
                        Size: =14
                        Text: ="Generate Board draft"
                        Tooltip: ="Generate 2027 Board draft dates from this confirmed rule"
