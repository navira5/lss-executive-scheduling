Screens:
  MainScreen1:
    Properties:
      Fill: =RGBA(244,247,251,1)
      LoadingSpinnerColor: =RGBA(15,43,91,1)
      OnVisible: |-
        =Refresh('LSS Meeting Types'); Refresh('LSS Planned Calendar');
        ClearCollect(colBoardRules,Filter('LSS Meeting Types',Category.Value="Board"&&(Title="Full Board"||Title="Board Critical Issue Check-in"||Title="Board Retreat")));
        ClearCollect(colBoardEvents,Filter('LSS Planned Calendar',EventDate>=Date(2027,1,1)&&EventDate<Date(2028,1,1)&&Category="Board"));
        ClearCollect(colClosures,Filter('LSS Planned Calendar',EventDate>=Date(2027,1,1)&&EventDate<Date(2028,1,1)&&Category="Closure"));
        If(IsBlank(varSelectedBoardRuleID)&&!IsEmpty(colBoardRules),Set(varSelectedBoardRuleID,First(colBoardRules).ID));
        Set(varBoardRuleReceiptVisible,false); Set(varBoardDraftReceiptVisible,false)
    Children:
      - conBoardRuleRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244,247,251,1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =14
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conBoardRuleHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Semilight
                  Fill: =RGBA(15,43,91,1)
                  Height: =If(App.Width<640,170,144)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =6
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                Children:
                  - txtBoardRuleTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Board planning"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255,255,255,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =24
                        Text: ="Board planning"
                        Wrap: =false
                  - txtBoardRuleSubtitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Choose a Board meeting group, confirm its rule, then generate a draft."
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(226,232,240,1)
                        Font: =Font.'Segoe UI'
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="Choose a Board meeting group, confirm its rule, then generate a draft."
                        Wrap: =false
                  - conBoardRuleNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                      Children:
                        - btnBoardRuleCurrent:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Current Board rules workspace"
                              AlignInContainer: =AlignInContainer.Stretch
                              BasePaletteColor: =RGBA(37,99,235,1)
                              Color: =RGBA(255,255,255,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinWidth: =140
                              Size: =14
                              Text: ="Board rules"
                              Tooltip: ="Current workspace"
                              Width: =If(App.Width<640,Parent.Width,170)
                        - btnBoardRuleCalendar:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Open Board calendar"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(255,255,255,1)
                              Color: =RGBA(255,255,255,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinWidth: =150
                              OnSelect: =Navigate(Screen2)
                              Size: =14
                              Text: ="Board calendar"
                              Tooltip: ="Open Board calendar"
                              Width: =If(App.Width<640,Parent.Width,180)
            - txtBoardRuleGroupsHeading:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Board meeting groups"
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =RGBA(15,43,91,1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =26
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =18
                  Text: ="Board meeting groups"
                  Wrap: =false
            - galBoardRuleGroups:
                Control: Gallery
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Board meeting groups"
                  Fill: =RGBA(244,247,251,1)
                  Height: =Min(330,Max(100,CountRows(colBoardRules)*98))
                  Items: =colBoardRules
                  OnSelect: =Set(varSelectedBoardRuleID,ThisItem.ID);Set(varBoardRuleReceiptVisible,false);Set(varBoardDraftReceiptVisible,false)
                  TabIndex: =0
                  TemplatePadding: =6
                  TemplateSize: =92
                  Visible: =!IsEmpty(colBoardRules)
                  Width: =Parent.Width
                Children:
                  - conBoardRuleGroupRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(ThisItem.ID=varSelectedBoardRuleID,RGBA(219,234,254,1),RGBA(255,255,255,1))
                        Height: =Parent.TemplateHeight
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =3
                        PaddingBottom: =8
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =8
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =Parent.TemplateWidth
                      Children:
                        - txtBoardRuleGroupName:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Board meeting group " & ThisItem.Title
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(15,23,42,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Text: =ThisItem.Title
                              Wrap: =false
                        - txtBoardRuleGroupState:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Status and generated count for " & ThisItem.Title
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              Height: =20
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: =If(ThisItem.RuleStatus.Value="Confirmed"&&ThisItem.Completed,"Confirmed","Needs validation") & " · " & Text(CountRows(Filter(colBoardEvents,Find("BOARD|RuleId="&Text(ThisItem.ID)&"|",'Source Rule')>0))) & " generated"
                              Wrap: =false
                        - bdgBoardRuleSelected:
                            Control: Badge
                            Properties:
                              AccessibleLabel: ="Selection state for " & ThisItem.Title
                              Appearance: ='BadgeCanvas.Appearance'.Tint
                              BasePaletteColor: =RGBA(15,43,91,1)
                              Content: =If(ThisItem.ID=varSelectedBoardRuleID,"Selected",If(ThisItem.RuleStatus.Value="Confirmed"&&ThisItem.Completed,"Confirmed","Needs validation"))
                              FontColor: =RGBA(15,43,91,1)
                              FontSize: =12
                              Shape: ='BadgeCanvas.Shape'.Rounded
                              ThemeColor: =If(ThisItem.RuleStatus.Value="Confirmed"&&ThisItem.Completed,'BadgeCanvas.ThemeColor'.Success,'BadgeCanvas.ThemeColor'.Warning)
            - txtBoardRuleRetreatMissing:
                Control: ModernText
                Properties:
                  AccessibleLabel: ="Board Retreat is not configured"
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =RGBA(146,64,14,1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =34
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =0
                  Size: =13
                  Text: ="Board Retreat — not configured — no Board Retreat dates will be generated."
                  Visible: =IsBlank(LookUp(colBoardRules,Title="Board Retreat"))
            - conBoardRuleForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255,1)
                  Height: =If(App.Width<640,1460,1260)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Visible: =!IsBlank(varSelectedBoardRuleID)
                Children:
                  - txtBoardRuleSelectedName:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Selected Board meeting group"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(15,43,91,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).Title
                        Wrap: =false
                  - txtBoardRuleLocked:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Board rule lock status"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(185,28,28,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =38
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="This rule is locked because generated Board dates are confirmed."
                        Visible: |-
                          =CountRows(Filter(colBoardEvents,Find("BOARD|RuleId="&Text(varSelectedBoardRuleID)&"|",'Source Rule')>0&&(Status="Approved"||Find("Board confirmed and locked: Yes",'Planning Notes')>0)))>0
                  - txtBoardRuleMeetingHead:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Meeting section"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(15,43,91,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="Meeting"
                        Wrap: =false
                  - inpBoardRuleName:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Meeting name"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).Title
                        Font: =Font.'Segoe UI'
                        Height: =40
                        Placeholder: ="Meeting name"
                        TriggerOutput: =TriggerOutput.FocusOut
                        Width: =Parent.Width
                  - inpBoardRulePurpose:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Purpose"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).Purpose
                        Font: =Font.'Segoe UI'
                        Height: =48
                        Placeholder: ="Purpose"
                        TriggerOutput: =TriggerOutput.FocusOut
                        Type: =TextInputType.Multiline
                        Width: =Parent.Width
                  - txtBoardRuleScheduleHead:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Scheduling pattern section"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(15,43,91,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="Scheduling pattern"
                        Wrap: =false
                  - txtBoardRuleCadenceLabel:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="How often does this meeting happen?"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(51,65,85,1)
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: ="How often does this meeting happen?"
                        Wrap: =false
                  - drpBoardRuleCadence:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: ="How often does this meeting happen?"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).Cadence
                        Font: =Font.'Segoe UI'
                        Height: =40
                        ItemDisplayText: =ThisItem.Value
                        Items: =[{Value:"Monthly"},{Value:"Every other month"},{Value:"Quarterly"},{Value:"Semiannual"},{Value:"Annual"},{Value:"Custom annual count"}]
                        Required: =true
                        Width: =Parent.Width
                  - drpBoardRuleStartMonth:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: ="Starting month"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).'Start Month'
                        Font: =Font.'Segoe UI'
                        Height: =40
                        Items: =[{Value1:"January",Value:"January"},{Value1:"February",Value:"February"},{Value1:"March",Value:"March"},{Value1:"April",Value:"April"},{Value1:"May",Value:"May"},{Value1:"June",Value:"June"},{Value1:"July",Value:"July"},{Value1:"August",Value:"August"},{Value1:"September",Value:"September"},{Value1:"October",Value:"October"},{Value1:"November",Value:"November"},{Value1:"December",Value:"December"}]
                        Required: =true
                        Width: =Parent.Width
                  - drpBoardRuleWeek:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: ="Week of month"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).WeekOfMonth
                        Font: =Font.'Segoe UI'
                        Height: =40
                        ItemDisplayText: =ThisItem.Value
                        Items: =[{Value:"First"},{Value:"Second"},{Value:"Third"},{Value:"Fourth"},{Value:"Fifth"}]
                        Required: =true
                        Width: =Parent.Width
                  - drpBoardRuleDay:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: ="Preferred day"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).DayOfWeek
                        Font: =Font.'Segoe UI'
                        Height: =40
                        ItemDisplayText: =ThisItem.Value
                        Items: =[{Value:"Monday"},{Value:"Tuesday"},{Value:"Wednesday"},{Value:"Thursday"},{Value:"Friday"}]
                        Required: =true
                        Width: =Parent.Width
                  - numBoardRuleCustomCount:
                      Control: ModernNumberInput
                      Properties:
                        AccessibleLabel: ="Custom annual meeting count"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =1
                        Font: =Font.'Segoe UI'
                        Height: =40
                        Max: =12
                        Min: =1
                        Precision: =DecimalPrecision.'0'
                        Visible: =drpBoardRuleCadence.Selected.Value="Custom annual count"
                        Width: =Parent.Width
                  - inpBoardRuleTime:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Time"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).PreferredTime
                        Font: =Font.'Segoe UI'
                        Height: =40
                        Placeholder: ="Time"
                        Required: =true
                        TriggerOutput: =TriggerOutput.FocusOut
                        Width: =Parent.Width
                  - numBoardRuleDuration:
                      Control: ModernNumberInput
                      Properties:
                        AccessibleLabel: ="Duration in minutes"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).DurationMinutes
                        Font: =Font.'Segoe UI'
                        Height: =40
                        Max: =1440
                        Min: =1
                        Precision: =DecimalPrecision.'0'
                        Width: =Parent.Width
                  - txtBoardRuleAttendanceHead:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Attendance section"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(15,43,91,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="Attendance"
                        Wrap: =false
                  - inpBoardRuleLeader:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Leader"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).Leader
                        Font: =Font.'Segoe UI'
                        Height: =40
                        Placeholder: ="Leader"
                        Required: =true
                        TriggerOutput: =TriggerOutput.FocusOut
                        Width: =Parent.Width
                  - inpBoardRuleAttendees:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Attendees"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).Attendees
                        Font: =Font.'Segoe UI'
                        Height: =40
                        Placeholder: ="Attendees"
                        Required: =true
                        TriggerOutput: =TriggerOutput.FocusOut
                        Width: =Parent.Width
                  - inpBoardRuleAttendance:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Attendance requirement"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).AttendanceRule.Value
                        Font: =Font.'Segoe UI'
                        Height: =40
                        Placeholder: ="Attendance requirement"
                        Required: =true
                        TriggerOutput: =TriggerOutput.FocusOut
                        Width: =Parent.Width
                  - txtBoardRuleSetupHead:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Meeting setup section"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(15,43,91,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="Meeting setup"
                        Wrap: =false
                  - drpBoardRuleModality:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: ="Meeting format"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).Modality
                        Font: =Font.'Segoe UI'
                        Height: =40
                        ItemDisplayText: =ThisItem.Value
                        Items: =[{Value:"In person"},{Value:"Virtual"},{Value:"Hybrid"}]
                        Required: =true
                        Width: =Parent.Width
                  - inpBoardRuleLocation:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Location"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).Location
                        Font: =Font.'Segoe UI'
                        Height: =40
                        Placeholder: ="Location"
                        Required: =true
                        TriggerOutput: =TriggerOutput.FocusOut
                        Width: =Parent.Width
                  - txtBoardRuleFlexHead:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Flexibility section"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(15,43,91,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="Flexibility"
                        Wrap: =false
                  - drpBoardRuleFlexibility:
                      Control: ModernDropdown
                      Properties:
                        AccessibleLabel: ="Scheduling flexibility"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).Flexibility
                        Font: =Font.'Segoe UI'
                        Height: =40
                        ItemDisplayText: =ThisItem.Value
                        Items: =[{Value:"Fixed / approval required to move"},{Value:"Movable"},{Value:"Preference only"}]
                        Required: =true
                        Width: =Parent.Width
                  - txtBoardRuleQuestionHead:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Status and open questions section"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(15,43,91,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="Status / open questions"
                        Wrap: =false
                  - inpBoardRuleQuestions:
                      Control: ModernTextInput
                      Properties:
                        AccessibleLabel: ="Open questions or notes"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =Appearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,23,42,1)
                        Default: =LookUp(colBoardRules,ID=varSelectedBoardRuleID).'Questions/Comments'
                        Font: =Font.'Segoe UI'
                        Height: =50
                        Placeholder: ="Open questions or notes"
                        TriggerOutput: =TriggerOutput.FocusOut
                        Type: =TextInputType.Multiline
                        Width: =Parent.Width
                  - txtBoardRuleValidation:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Missing information for selected Board rule"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(146,64,14,1)
                        Font: =Font.'Segoe UI'
                        Height: =40
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =13
                        Text: |-
                          =LookUp(colBoardRules,ID=varSelectedBoardRuleID).Title & " still needs: " & Concat(Filter(Table({Label:"meeting name",Missing:IsBlank(inpBoardRuleName.Text)},{Label:"purpose",Missing:IsBlank(inpBoardRulePurpose.Text)},{Label:"starting month",Missing:IsBlank(drpBoardRuleStartMonth.Selected.Value)},{Label:"week of month",Missing:IsBlank(drpBoardRuleWeek.Selected.Value)},{Label:"preferred day",Missing:IsBlank(drpBoardRuleDay.Selected.Value)},{Label:"time",Missing:IsBlank(inpBoardRuleTime.Text)},{Label:"duration",Missing:IsBlank(numBoardRuleDuration.Value)},{Label:"leader",Missing:IsBlank(inpBoardRuleLeader.Text)},{Label:"attendees",Missing:IsBlank(inpBoardRuleAttendees.Text)},{Label:"attendance requirement",Missing:IsBlank(inpBoardRuleAttendance.Text)},{Label:"meeting format",Missing:IsBlank(drpBoardRuleModality.Selected.Value)},{Label:"location",Missing:IsBlank(inpBoardRuleLocation.Text)},{Label:"flexibility",Missing:IsBlank(drpBoardRuleFlexibility.Selected.Value)},{Label:"open questions",Missing:!IsBlank(inpBoardRuleQuestions.Text)}),Missing),Label,", ")
                        VerticalAlign: =VerticalAlign.Top
            - conBoardRuleReceipt:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
