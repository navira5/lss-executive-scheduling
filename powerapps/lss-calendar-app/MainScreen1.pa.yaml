                  - btnBoardRuleGenerate:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Generate Board draft"
                        AlignInContainer: =AlignInContainer.Stretch
                        BasePaletteColor: =RGBA(37,99,235,1)
                        Color: =RGBA(255,255,255,1)
                        DisplayMode: |-
                          =If(IsBlank(varSelectedBoardRuleID)||!(LookUp(colBoardRules,ID=varSelectedBoardRuleID).RuleStatus.Value="Confirmed"&&LookUp(colBoardRules,ID=varSelectedBoardRuleID).Completed)||CountRows(Filter(colBoardEvents,Find("BOARD|RuleId="&Text(varSelectedBoardRuleID)&"|",'Source Rule')>0&&(Status="Approved"||Find("Board confirmed and locked: Yes",'Planning Notes')>0)))>0,DisplayMode.Disabled,DisplayMode.Edit)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =180
                        OnSelect: |-
                          =With(
                              {r:LookUp(colBoardRules,ID=varSelectedBoardRuleID)},
                              With(
                                  {startMonth:Switch(r.'Start Month'.Value,"January",1,"February",2,"March",3,"April",4,"May",5,"June",6,"July",7,"August",8,"September",9,"October",10,"November",11,"December",12,1),cadence:r.Cadence.Value,weekNumber:Switch(r.WeekOfMonth.Value,"First",1,"Second",2,"Third",3,"Fourth",4,"Fifth",5,1),dayNumber:Switch(r.DayOfWeek.Value,"Sunday",1,"Monday",2,"Tuesday",3,"Wednesday",4,"Thursday",5,"Friday",6,"Saturday",7,1),customCount:If(r.Cadence.Value="Custom annual count",Max(1,Value(Substitute(r.Frequency,"Custom annual count: ",""))),1)},
