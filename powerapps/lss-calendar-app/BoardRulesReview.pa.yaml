                                    Text: ="Rule status"
                                    Wrap: =false
                              - drpBrvStatus:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="Rule status"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    BasePaletteColor: =RGBA(37,99,235,1)
                                    Color: =RGBA(15,23,42,1)
                                    Default: =LookUp([{Value:"Confirmed"},{Value:"Needs validation"}],Value=LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).RuleStatus)
                                    Font: =Font.'Segoe UI'
                                    Height: =44
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =[{Value:"Confirmed"},{Value:"Needs validation"}]
                                    LayoutMinWidth: =0
                                    Required: =true
                                    ValidationState: =If(varBrvSaveAttempted && IsBlank(Self.Selected.Value),ValidationState.Error,ValidationState.None)
                                    Width: =Parent.Width
                        - txtBrvValidation:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Rule validation message"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(185,28,28,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =40
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: |-
                                =With(
                                    {cadence:LookUp(colBrvCadenceOptions,Value=drpBrvCadence.Selected.Value)},
                                    If(
                                        cadence.UsesSpecificMonths && CountRows(Filter(colBrvMonthSelection,IsSelected))=0,
                                        "Select at least one month.",
                                        cadence.UsesSecondDay && (!IsBlank(drpBrvCadSecondDay.Selected.Value) && drpBrvCadSecondDay.Selected.Value=drpBrvDay.Selected.Value),
                                        "Choose two different weekdays.",
                                        cadence.UsesSecondWeek && (!IsBlank(drpBrvCadSecondWeek.Selected.Value) && drpBrvCadSecondWeek.Selected.Value=drpBrvWeek.Selected.Value),
                                        "Choose two different weeks of the month.",
                                        "Complete the visible required fields before saving."
                                    )
                                )
                              Visible: |-
                                =With(
                                    {cadence:LookUp(colBrvCadenceOptions,Value=drpBrvCadence.Selected.Value)},
                                    varBrvSaveAttempted && !(
                                        !IsBlank(LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).RuleId) &&
                                        !IsBlank(Trim(inpBrvMeetingName.Text)) &&
                                        !IsBlank(drpBrvCadence.Selected.Value) &&
                                        !IsBlank(Trim(inpBrvTime.Text)) &&
                                        !IsBlank(drpBrvFormat.Selected.Value) &&
                                        !IsBlank(drpBrvFlexibility.Selected.Value) &&
                                        !IsBlank(drpBrvStatus.Selected.Value) &&
                                        numBrvDuration.Value>=1 && numBrvDuration.Value<=1440 &&
                                        (!cadence.UsesAnchorDate || (!IsBlank(drpBrvCadAnchorMonth.Selected.Value) && !IsBlank(drpBrvCadAnchorDay.Selected.Value))) &&
                                        (!cadence.UsesStartMonth || !IsBlank(drpBrvStartMonth.Selected.Value)) &&
                                        (!cadence.UsesSpecificMonths || CountRows(Filter(colBrvMonthSelection,IsSelected))>0) &&
                                        (!cadence.UsesWeek || !IsBlank(drpBrvWeek.Selected.Value)) &&
                                        (!cadence.UsesDay || !IsBlank(drpBrvDay.Selected.Value)) &&
                                        (!cadence.UsesSecondDay || (!IsBlank(drpBrvCadSecondDay.Selected.Value) && drpBrvCadSecondDay.Selected.Value<>drpBrvDay.Selected.Value)) &&
                                        (!cadence.UsesSecondWeek || (!IsBlank(drpBrvCadSecondWeek.Selected.Value) && drpBrvCadSecondWeek.Selected.Value<>drpBrvWeek.Selected.Value))
                                    )
                                )
                        - conBrvActions:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =If(App.Width<760,100,44)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =If(App.Width<760,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - btnBrvCancel:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Cancel unsaved rule changes"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(15,43,91,1)
                                    Color: =RGBA(15,43,91,1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Reset(inpBrvMeetingName);
                                      Reset(drpBrvCadence);
                                      Reset(drpBrvStartMonth);
                                      Reset(drpBrvCadAnchorMonth);
                                      Reset(drpBrvCadAnchorDay);
                                      Reset(drpBrvWeek);
                                      Reset(drpBrvDay);
                                      Reset(drpBrvCadSecondDay);
                                      Reset(drpBrvCadSecondWeek);
                                      Reset(inpBrvTime);
                                      Reset(numBrvDuration);
                                      Reset(drpBrvFormat);
                                      Reset(drpBrvFlexibility);
                                      Reset(drpBrvStatus);
                                      With(
                                          {monthsText:LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).MonthsText},
                                          ClearCollect(
                                              colBrvMonthSelection,
                                              {MonthNumber:1,MonthName:"January",IsSelected:"January" in monthsText},
                                              {MonthNumber:2,MonthName:"February",IsSelected:"February" in monthsText},
                                              {MonthNumber:3,MonthName:"March",IsSelected:"March" in monthsText},
                                              {MonthNumber:4,MonthName:"April",IsSelected:"April" in monthsText},
                                              {MonthNumber:5,MonthName:"May",IsSelected:"May" in monthsText},
                                              {MonthNumber:6,MonthName:"June",IsSelected:"June" in monthsText},
                                              {MonthNumber:7,MonthName:"July",IsSelected:"July" in monthsText},
                                              {MonthNumber:8,MonthName:"August",IsSelected:"August" in monthsText},
                                              {MonthNumber:9,MonthName:"September",IsSelected:"September" in monthsText},
                                              {MonthNumber:10,MonthName:"October",IsSelected:"October" in monthsText},
                                              {MonthNumber:11,MonthName:"November",IsSelected:"November" in monthsText},
                                              {MonthNumber:12,MonthName:"December",IsSelected:"December" in monthsText}
                                          )
                                      );
                                      Set(varBrvSaveAttempted,false);
                                      Set(varBrvReceiptVisible,false)
                                    PaddingBottom: =0
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =0
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =14
                                    Text: ="Cancel changes"
                                    Width: =If(App.Width<760,Parent.Width,Min(180,(Parent.Width-8)/2))
                              - btnBrvSave:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Save meeting rule edits"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BasePaletteColor: =RGBA(37,99,235,1)
                                    Color: =RGBA(255,255,255,1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =With(
                                          {
                                              cadence:LookUp(colBrvCadenceOptions,Value=drpBrvCadence.Selected.Value),
                                              currentRule:LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId)
                                          },
                                          If(
                                              !IsBlank(currentRule.RuleId) &&
                                              !IsBlank(Trim(inpBrvMeetingName.Text)) &&
                                              !IsBlank(drpBrvCadence.Selected.Value) &&
                                              !IsBlank(Trim(inpBrvTime.Text)) &&
                                              !IsBlank(drpBrvFormat.Selected.Value) &&
                                              !IsBlank(drpBrvFlexibility.Selected.Value) &&
                                              !IsBlank(drpBrvStatus.Selected.Value) &&
                                              numBrvDuration.Value>=1 && numBrvDuration.Value<=1440 &&
                                              (!cadence.UsesAnchorDate || (!IsBlank(drpBrvCadAnchorMonth.Selected.Value) && !IsBlank(drpBrvCadAnchorDay.Selected.Value))) &&
                                              (!cadence.UsesStartMonth || !IsBlank(drpBrvStartMonth.Selected.Value)) &&
                                              (!cadence.UsesSpecificMonths || CountRows(Filter(colBrvMonthSelection,IsSelected))>0) &&
                                              (!cadence.UsesWeek || !IsBlank(drpBrvWeek.Selected.Value)) &&
                                              (!cadence.UsesDay || !IsBlank(drpBrvDay.Selected.Value)) &&
                                              (!cadence.UsesSecondDay || (!IsBlank(drpBrvCadSecondDay.Selected.Value) && drpBrvCadSecondDay.Selected.Value<>drpBrvDay.Selected.Value)) &&
                                              (!cadence.UsesSecondWeek || (!IsBlank(drpBrvCadSecondWeek.Selected.Value) && drpBrvCadSecondWeek.Selected.Value<>drpBrvWeek.Selected.Value)),
                                              With(
                                                  {
                                                      savedLocal:Patch(
                                                          colMeetingRulebook,
                                                          currentRule,
                                                          {
                                                              MeetingName:Trim(inpBrvMeetingName.Text),
                                                              Cadence:drpBrvCadence.Selected.Value,
                                                              MonthsText:If(cadence.UsesSpecificMonths,Concat(SortByColumns(Filter(colBrvMonthSelection,IsSelected),"MonthNumber",SortOrder.Ascending),MonthName,", "),currentRule.MonthsText),
                                                              StartMonth:If(cadence.UsesStartMonth,drpBrvStartMonth.Selected.Value,currentRule.StartMonth),
                                                              WeekOfMonth:If(cadence.UsesWeek,drpBrvWeek.Selected.Value,currentRule.WeekOfMonth),
                                                              PreferredDay:If(cadence.UsesDay,drpBrvDay.Selected.Value,currentRule.PreferredDay),
                                                              AnchorMonth:If(cadence.UsesAnchorDate,drpBrvCadAnchorMonth.Selected.Value,currentRule.AnchorMonth),
                                                              AnchorDay:If(cadence.UsesAnchorDate,drpBrvCadAnchorDay.Selected.Value,currentRule.AnchorDay),
                                                              SecondPreferredDay:If(cadence.UsesSecondDay,drpBrvCadSecondDay.Selected.Value,currentRule.SecondPreferredDay),
                                                              SecondWeekOfMonth:If(cadence.UsesSecondWeek,drpBrvCadSecondWeek.Selected.Value,currentRule.SecondWeekOfMonth),
                                                              StartTimeText:Trim(inpBrvTime.Text),
                                                              DurationMinutes:numBrvDuration.Value,
                                                              Format:drpBrvFormat.Selected.Value,
                                                              Flexibility:drpBrvFlexibility.Selected.Value,
                                                              RuleStatus:drpBrvStatus.Selected.Value
                                                          }
                                                      )
                                                  },
                                                  With(
                                                      {
                                                          sourceRule:LookUp(colMeetingSourceRules,ID=savedLocal.SourceRecordId || Title=currentRule.MeetingName || (savedLocal.PlanningLayer="Board" && ("PowerAppsBoardRule=" & savedLocal.RuleId) in Coalesce(Notes,"")))
                                                      },
                                                      If(
                                                          !IsBlank(sourceRule.ID),
                                                          With(
                                                              {
                                                                  savedSource:Patch(
                                                                      'LSS Meeting Types',
                                                                      sourceRule,
                                                                      {
                                                                          Title:savedLocal.MeetingName,
                                                                          Cadence:{Value:savedLocal.Cadence},
                                                                          'Start Month':{Value:If(savedLocal.Cadence="One time",savedLocal.AnchorMonth,savedLocal.StartMonth)},
                                                                          WeekOfMonth:{Value:savedLocal.WeekOfMonth},
                                                                          DayOfWeek:{Value:savedLocal.PreferredDay},
                                                                          PreferredTime:savedLocal.StartTimeText,
                                                                          DurationMinutes:savedLocal.DurationMinutes,
                                                                          Modality:{Value:savedLocal.Format},
                                                                          Flexibility:{Value:savedLocal.Flexibility},
                                                                          Frequency:If(savedLocal.PlanningLayer="Board","PA_RULE|"&savedLocal.MonthsText&"|"&Text(savedLocal.AnchorDay)&"|"&savedLocal.SecondPreferredDay&"|"&savedLocal.SecondWeekOfMonth,sourceRule.Frequency),
                                                                          RuleStatus:{Value:savedLocal.RuleStatus},
                                                                          Completed:savedLocal.RuleStatus="Confirmed",
                                                                          Notes:If(savedLocal.PlanningLayer<>"Board",sourceRule.Notes,If(("PowerAppsBoardRule=" & savedLocal.RuleId) in Coalesce(sourceRule.Notes,""),sourceRule.Notes,Trim(Coalesce(sourceRule.Notes,"") & Char(10) & "PowerAppsBoardRule=" & savedLocal.RuleId)))
                                                                      }
                                                                  )
                                                              },
                                                              Patch(colMeetingRulebook,savedLocal,{SourceRecordId:savedSource.ID});
                                                              If(savedLocal.PlanningLayer="Board",Patch(colBoardRuleProof,LookUp(colBoardRuleProof,RuleId=savedLocal.RuleId),savedLocal,{SourceRecordId:savedSource.ID}));
                                                              Set(varBrvReceipt,LookUp(colMeetingRulebook,RuleId=savedLocal.RuleId));
                                                              Refresh('LSS Meeting Types');
                                                              ClearCollect(colMeetingSourceRules,'LSS Meeting Types');
                                                              ClearCollect(colBoardSourceRules,Filter(colMeetingSourceRules,Category.Value="Board"))
                                                          ),
                                                          Set(varBrvReceipt,savedLocal)
                                                      )
                                                  )
                                              );
                                              If(
                                                  currentRule.PlanningLayer="Board",
                                                  Set(varCalProofDraftNeedsRegeneration,CountRows(colCalProofGenerationReceipt)>0);
                                                  Set(varCalProofBoardConfirmed,false);
                                                  Clear(colCalProofBoardConfirmationReceipt);
                                                  Set(varCalProofActionMessage,If(CountRows(colCalProofGenerationReceipt)>0,"Board rule saved. Regenerate the draft to apply this change.","Board rule saved.")),
                                                  Set(varCalProofActionMessage,currentRule.PlanningLayer & " rule saved.")
                                              );
                                              Set(varBrvReceiptVisible,true);
                                              Set(varBrvSaveAttempted,false),
                                              Set(varBrvSaveAttempted,true);
                                              Set(varBrvReceiptVisible,false)
                                          )
                                      )
                                    PaddingBottom: =0
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =0
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Size: =14
                                    Text: ="Save rule"
                                    Width: =If(App.Width<760,Parent.Width,Min(180,(Parent.Width-8)/2))
                        - conBrvReceipt:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(167,243,208,1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(236,253,245,1)
                              FillPortions: =0
                              Height: =440
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Visible: =varBrvReceiptVisible
                            Children:
                              - txtBrvReceiptTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Rule saved locally"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(6,78,59,1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =18
                                    Text: ="Rule saved locally"
                                    Wrap: =false
                              - txtBrvReceiptBody:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Saved local rule proof with all edited fields"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(6,78,59,1)
                                    Font: =Font.'Segoe UI'
                                    Height: =380
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: |-
                                      =With(
                                          {savedCadence:LookUp(colBrvCadenceOptions,Value=varBrvReceipt.Cadence)},
                                          "Rule ID: " & varBrvReceipt.RuleId & Char(10) &
                                          "Meeting name: " & varBrvReceipt.MeetingName & Char(10) &
                                          "Cadence: " & varBrvReceipt.Cadence & Char(10) &
                                          "Specific months: " & If(savedCadence.UsesSpecificMonths,varBrvReceipt.MonthsText,"Not used for this cadence") & Char(10) &
                                          "Starting month: " & If(savedCadence.UsesStartMonth,varBrvReceipt.StartMonth,"Not used for this cadence") & Char(10) &
                                          "Week of month: " & If(savedCadence.UsesWeek,varBrvReceipt.WeekOfMonth,"Not used for this cadence") & Char(10) &
                                          "Preferred day: " & If(savedCadence.UsesDay,varBrvReceipt.PreferredDay,"Not used for this cadence") & Char(10) &
                                          "Anchor date in 2027: " & If(savedCadence.UsesAnchorDate,varBrvReceipt.AnchorMonth & " " & Text(varBrvReceipt.AnchorDay),"Not used for this cadence") & Char(10) &
                                          "Second preferred day: " & If(savedCadence.UsesSecondDay,varBrvReceipt.SecondPreferredDay,"Not used for this cadence") & Char(10) &
                                          "Second week of month: " & If(savedCadence.UsesSecondWeek,varBrvReceipt.SecondWeekOfMonth,"Not used for this cadence") & Char(10) &
                                          "Start time: " & varBrvReceipt.StartTimeText & Char(10) &
                                          "Duration minutes: " & Text(varBrvReceipt.DurationMinutes) & Char(10) &
                                          "Format: " & varBrvReceipt.Format & Char(10) &
                                          "Flexibility: " & varBrvReceipt.Flexibility & Char(10) &
                                          "Rule status: " & varBrvReceipt.RuleStatus
                                      )
                                    VerticalAlign: =VerticalAlign.Top
                        - txtBrvSafetyFooter:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Save the rule, then return to the annual calendar to generate or regenerate the Board draft."
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              Height: =36
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Save the rule, then return to the annual calendar to generate or regenerate the Board draft."
