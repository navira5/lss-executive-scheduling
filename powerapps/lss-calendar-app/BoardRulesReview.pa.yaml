Screens:
  BoardRulesReview:
    Properties:
      Fill: =RGBA(244,247,251,1)
      LoadingSpinnerColor: =RGBA(15,43,91,1)
      OnVisible: |-
        =If(
            IsBlank(LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).RuleId),
            Set(varBrvSelectedRuleId,First(SortByColumns(colMeetingRulebook,"SortOrder",SortOrder.Ascending)).RuleId)
        );
        With(
            {monthsText:LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).MonthsText},
            ClearCollect(
                colBrvMonthSelection,
                {MonthNumber:1,MonthName:"January",IsSelected:"January" in monthsText},
                {MonthNumber:2,MonthName:"February",IsSelected:"February" in monthsText},
                {MonthNumber:3,MonthName:"March",IsSelected:"March" in monthsText},
                {MonthNumber:4,MonthName:"April",IsSelected:"April" in monthsText},
                {MonthNumber:5,MonthName:"May",IsSelected:"May" in monthsText},
                {MonthNumber:6,MonthName:"June",IsSelected:"June" in monthsText},
                {MonthNumber:7,MonthName:"July",IsSelected:"July" in monthsText},
                {MonthNumber:8,MonthName:"August",IsSelected:"August" in monthsText},
                {MonthNumber:9,MonthName:"September",IsSelected:"September" in monthsText},
                {MonthNumber:10,MonthName:"October",IsSelected:"October" in monthsText},
                {MonthNumber:11,MonthName:"November",IsSelected:"November" in monthsText},
                {MonthNumber:12,MonthName:"December",IsSelected:"December" in monthsText}
            )
        );
        Set(varBrvReceiptVisible,false);
        Set(varBrvSaveAttempted,false)
    Children:
      - conBrvRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(244,247,251,1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width<760,16,24)
            PaddingLeft: =If(App.Width<760,16,24)
            PaddingRight: =If(App.Width<760,16,24)
            PaddingTop: =If(App.Width<760,16,24)
            Width: =Parent.Width
          Children:
            - conBrvHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<760,176,112)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width<760,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                Children:
                  - conBrvHeaderCopy:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =If(App.Width<760,0,1)
                        Height: =If(App.Width<760,96,80)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtBrvEyebrow:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Connected meeting rulebook"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: ="MEETING RULEBOOK"
                              Wrap: =false
                        - txtBrvTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Review meeting rules"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(15,23,42,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =28
                              Text: ="Review meeting rules"
                              Wrap: =false
                        - txtBrvSubtitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="All connected LSS meeting types. No Outlook changes."
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              Height: =If(App.Width<760,38,20)
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: ="All connected LSS meeting types · no Outlook changes"
                              VerticalAlign: =VerticalAlign.Top
                  - btnBrvBack:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Back to the annual calendar"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(15,43,91,1)
                        Color: =RGBA(15,43,91,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =180
                        OnSelect: =Set(varPlannerView,"Year");Navigate(CalendarPlanner,ScreenTransition.None)
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =0
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =14
                        Text: ="Back to calendar"
                        Width: =If(App.Width<760,Parent.Width,180)
            - conBrvScope:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(191,219,254,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(239,246,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<760,104,76)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - txtBrvScope:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Review every connected meeting type. Board edits mark an existing Board draft for regeneration."
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(30,64,175,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =If(App.Width<760,64,40)
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Review every meeting type by layer. Board rule edits mark an existing Board draft for regeneration and preserve manual moves."
            - conBrvWorkspace:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: |-
                    =With(
                        {cadence:LookUp(colBrvCadenceOptions,Value=drpBrvCadence.Selected.Value)},
                        With(
                            {
                                editorHeight:
                                    32 + 18 + 12 + If(App.Width<760,106,52) + 12 + If(App.Width<760,72,52) + 12 + 76 + 12 +
                                    If(App.Width<760,112+If(cadence.UsesStartMonth,84,0),112) +
                                    If(cadence.UsesAnchorDate,12+If(App.Width<760,188,104),0) +
                                    If(cadence.UsesSpecificMonths,12+312,0) +
                                    If(cadence.UsesWeek || cadence.UsesDay,12+If(App.Width<760 && cadence.UsesWeek && cadence.UsesDay,160,76),0) +
                                    If(cadence.UsesSecondDay || cadence.UsesSecondWeek,12+76,0) +
                                    12 + If(App.Width<760,160,76) + 12 + If(App.Width<760,160,76) + 12 + 76 +
                                    12 + 40 + 12 + If(App.Width<760,100,44) +
                                    If(varBrvReceiptVisible,12+440,0) + 12 + 36
                            },
                            If(App.Width<760,700+16+editorHeight,Max(700,editorHeight))
                        )
                    )
                  LayoutDirection: =If(App.Width<760,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conBrvListPane:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =If(App.Width<760,AlignInContainer.Stretch,AlignInContainer.Start)
                        BorderColor: =RGBA(203,213,225,1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255,255,255,1)
                        FillPortions: =0
                        Height: =700
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMaxWidth: =If(App.Width<760,0,320)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Width: =If(App.Width<760,Parent.Width,320)
                      Children:
                        - txtBrvListTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Meeting types"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(15,23,42,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =20
                              Text: ="Meeting types (" & Text(CountRows(colMeetingRulebook)) & ")"
                              Wrap: =false
                        - galBrvRules:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Meeting rules. Select a rule to edit."
                              BorderColor: =RGBA(203,213,225,1)
                              DelayItemLoading: =false
                              FillPortions: =0
                              Height: =530
                              Items: =SortByColumns(colMeetingRulebook,"PlanningLayer",SortOrder.Ascending,"SortOrder",SortOrder.Ascending)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LoadingSpinner: =LoadingSpinner.None
                              ShowScrollbar: =true
                              TabIndex: =0
                              TemplatePadding: =4
                              TemplateSize: =156
                              Width: =Parent.Width
                            Children:
                              - conBrvRuleRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =If(ThisItem.RuleId=varBrvSelectedRuleId,RGBA(37,99,235,1),RGBA(203,213,225,1))
                                    BorderThickness: =If(ThisItem.RuleId=varBrvSelectedRuleId,2,1)
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.RuleId=varBrvSelectedRuleId,RGBA(239,246,255,1),RGBA(255,255,255,1))
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    PaddingBottom: =8
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - txtBrvRuleName:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Meeting group " & ThisItem.MeetingName
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(15,23,42,1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =22
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =14
                                          Text: =ThisItem.MeetingName
                                          Wrap: =false
                                    - txtBrvRuleSummary:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Schedule summary for " & ThisItem.MeetingName
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(71,85,105,1)
                                          Font: =Font.'Segoe UI'
                                          Height: =58
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: |-
                                            =ThisItem.PlanningLayer & " · " & ThisItem.Cadence & " · " &
                                            If(
                                                !IsBlank(ThisItem.RuleSummary),
                                                ThisItem.RuleSummary,
                                                Switch(
                                                    ThisItem.Cadence,
                                                    "One time",ThisItem.AnchorMonth & " " & Text(ThisItem.AnchorDay) & ", 2027",
                                                    "Twice a week",ThisItem.PreferredDay & " and " & ThisItem.SecondPreferredDay,
                                                    "Weekly",ThisItem.PreferredDay,
                                                    "Every two weeks","first occurrence " & ThisItem.AnchorMonth & " " & Text(ThisItem.AnchorDay) & ", 2027",
                                                    "Twice a month",ThisItem.WeekOfMonth & " and " & ThisItem.SecondWeekOfMonth & " " & ThisItem.PreferredDay,
                                                    "Monthly",ThisItem.WeekOfMonth & " " & ThisItem.PreferredDay,
                                                    "Every two months","starting " & ThisItem.StartMonth & " · " & ThisItem.WeekOfMonth & " " & ThisItem.PreferredDay,
                                                    "Quarterly","starting " & ThisItem.StartMonth & " · " & ThisItem.WeekOfMonth & " " & ThisItem.PreferredDay,
                                                    "Specific months",ThisItem.MonthsText & " · " & ThisItem.WeekOfMonth & " " & ThisItem.PreferredDay,
                                                    "Annually","starting " & ThisItem.StartMonth & " · " & ThisItem.WeekOfMonth & " " & ThisItem.PreferredDay,
                                                    "As needed — no dates generated automatically","no automatic dates",
                                                    "Schedule not set"
                                                ) & " · " & ThisItem.StartTimeText & " · " & Text(ThisItem.DurationMinutes) & " min"
                                            )
                                          VerticalAlign: =VerticalAlign.Top
                                    - conBrvRuleActions:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          FillPortions: =0
                                          Height: =44
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                        Children:
                                          - bdgBrvRuleStatus:
                                              Control: Badge
                                              Properties:
                                                AccessibleLabel: ="Rule status " & ThisItem.RuleStatus
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: ='BadgeCanvas.Appearance'.Tint
                                                Content: =ThisItem.RuleStatus
                                                DisplayMode: =DisplayMode.View
                                                Font: =Font.'Segoe UI'
                                                FontColor: =If(ThisItem.RuleStatus="Confirmed",RGBA(6,78,59,1),RGBA(146,64,14,1))
                                                FontSize: =11
                                                FontWeight: =FontWeight.Semibold
                                                Height: =28
                                                Shape: ='BadgeCanvas.Shape'.Rounded
                                                ThemeColor: =If(ThisItem.RuleStatus="Confirmed",'BadgeCanvas.ThemeColor'.Success,'BadgeCanvas.ThemeColor'.Warning)
                                                Width: =112
                                          - btnBrvSelectRule:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: ="Edit rule for " & ThisItem.MeetingName
                                                Align: =Align.Center
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Appearance: =If(ThisItem.RuleId=varBrvSelectedRuleId,ButtonAppearance.Primary,ButtonAppearance.Outline)
                                                BasePaletteColor: =RGBA(37,99,235,1)
                                                Color: =If(ThisItem.RuleId=varBrvSelectedRuleId,RGBA(255,255,255,1),RGBA(15,43,91,1))
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =44
                                                Layout: =ButtonLayout.TextOnly
                                                LayoutMinWidth: =88
                                                OnSelect: |-
                                                  =Set(varBrvSelectedRuleId,ThisItem.RuleId);
                                                  Reset(inpBrvMeetingName);
                                                  Reset(drpBrvCadence);
                                                  Reset(drpBrvStartMonth);
                                                  Reset(drpBrvCadAnchorMonth);
                                                  Reset(drpBrvCadAnchorDay);
                                                  Reset(drpBrvWeek);
                                                  Reset(drpBrvDay);
                                                  Reset(drpBrvCadSecondDay);
                                                  Reset(drpBrvCadSecondWeek);
                                                  Reset(inpBrvTime);
                                                  Reset(numBrvDuration);
                                                  Reset(drpBrvFormat);
                                                  Reset(drpBrvFlexibility);
                                                  Reset(drpBrvStatus);
                                                  With(
                                                      {monthsText:LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).MonthsText},
                                                      ClearCollect(
                                                          colBrvMonthSelection,
                                                          {MonthNumber:1,MonthName:"January",IsSelected:"January" in monthsText},
                                                          {MonthNumber:2,MonthName:"February",IsSelected:"February" in monthsText},
                                                          {MonthNumber:3,MonthName:"March",IsSelected:"March" in monthsText},
                                                          {MonthNumber:4,MonthName:"April",IsSelected:"April" in monthsText},
                                                          {MonthNumber:5,MonthName:"May",IsSelected:"May" in monthsText},
                                                          {MonthNumber:6,MonthName:"June",IsSelected:"June" in monthsText},
                                                          {MonthNumber:7,MonthName:"July",IsSelected:"July" in monthsText},
                                                          {MonthNumber:8,MonthName:"August",IsSelected:"August" in monthsText},
                                                          {MonthNumber:9,MonthName:"September",IsSelected:"September" in monthsText},
                                                          {MonthNumber:10,MonthName:"October",IsSelected:"October" in monthsText},
                                                          {MonthNumber:11,MonthName:"November",IsSelected:"November" in monthsText},
                                                          {MonthNumber:12,MonthName:"December",IsSelected:"December" in monthsText}
                                                      )
                                                  );
                                                  Set(varBrvSaveAttempted,false);
                                                  Set(varBrvReceiptVisible,false)
                                                PaddingBottom: =0
                                                PaddingLeft: =8
                                                PaddingRight: =8
                                                PaddingTop: =0
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Size: =12
                                                Text: =If(ThisItem.RuleId=varBrvSelectedRuleId,"Editing","Edit rule")
                                                Width: =92
                  - conBrvEditorPane:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(203,213,225,1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.Semilight
                        Fill: =RGBA(255,255,255,1)
                        FillPortions: =If(App.Width<760,0,1)
                        Height: |-
                          =With(
                              {cadence:LookUp(colBrvCadenceOptions,Value=drpBrvCadence.Selected.Value)},
                              32 + 18 + 12 + If(App.Width<760,106,52) + 12 + If(App.Width<760,72,52) + 12 + 76 + 12 +
                              If(App.Width<760,112+If(cadence.UsesStartMonth,84,0),112) +
                              If(cadence.UsesAnchorDate,12+If(App.Width<760,188,104),0) +
                              If(cadence.UsesSpecificMonths,12+312,0) +
                              If(cadence.UsesWeek || cadence.UsesDay,12+If(App.Width<760 && cadence.UsesWeek && cadence.UsesDay,160,76),0) +
                              If(cadence.UsesSecondDay || cadence.UsesSecondWeek,12+76,0) +
                              12 + If(App.Width<760,160,76) + 12 + If(App.Width<760,160,76) + 12 + 76 +
                              If(txtBrvValidation.Visible,12+40,0) + 12 + If(App.Width<760,100,44) +
                              If(varBrvReceiptVisible,12+440,0) + 12 + 36
                          )
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - txtBrvEditorEyebrow:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Selected rule"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =18
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: ="SELECTED RULE"
                              Wrap: =false
                        - conBrvEditorHeading:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =If(App.Width<760,106,52)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =If(App.Width<760,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - txtBrvEditorTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Selected meeting " & LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).MeetingName
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(15,23,42,1)
                                    FillPortions: =If(App.Width<760,0,1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =If(App.Width<760,54,34)
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =24
                                    Text: =LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).MeetingName
                                    Wrap: =App.Width<760
                              - bdgBrvEditorStatus:
                                  Control: Badge
                                  Properties:
                                    AccessibleLabel: ="Selected rule status " & LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).RuleStatus
                                    AlignInContainer: =If(App.Width<760,AlignInContainer.Start,AlignInContainer.Center)
                                    Appearance: ='BadgeCanvas.Appearance'.Tint
                                    Content: =LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).RuleStatus
                                    DisplayMode: =DisplayMode.View
                                    Font: =Font.'Segoe UI'
                                    FontColor: =If(LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).RuleStatus="Confirmed",RGBA(6,78,59,1),RGBA(146,64,14,1))
                                    FontSize: =12
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    Shape: ='BadgeCanvas.Shape'.Rounded
                                    ThemeColor: =If(LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).RuleStatus="Confirmed",'BadgeCanvas.ThemeColor'.Success,'BadgeCanvas.ThemeColor'.Warning)
                                    Width: =140
                        - txtBrvCurrentSummary:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Current schedule summary"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              Height: =If(App.Width<760,72,52)
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: |-
                                =With(
                                    {rule:LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId)},
                                    rule.Cadence & " · " &
                                    Switch(
                                        rule.Cadence,
                                        "One time",rule.AnchorMonth & " " & Text(rule.AnchorDay) & ", 2027",
                                        "Twice a week",rule.PreferredDay & " and " & rule.SecondPreferredDay,
                                        "Weekly",rule.PreferredDay,
                                        "Every two weeks","first occurrence " & rule.AnchorMonth & " " & Text(rule.AnchorDay) & ", 2027",
                                        "Twice a month",rule.WeekOfMonth & " and " & rule.SecondWeekOfMonth & " " & rule.PreferredDay,
                                        "Monthly",rule.WeekOfMonth & " " & rule.PreferredDay,
                                        "Every two months","starting " & rule.StartMonth & " · " & rule.WeekOfMonth & " " & rule.PreferredDay,
                                        "Quarterly","starting " & rule.StartMonth & " · " & rule.WeekOfMonth & " " & rule.PreferredDay,
                                        "Specific months",rule.MonthsText & " · " & rule.WeekOfMonth & " " & rule.PreferredDay,
                                        "Annually","starting " & rule.StartMonth & " · " & rule.WeekOfMonth & " " & rule.PreferredDay,
