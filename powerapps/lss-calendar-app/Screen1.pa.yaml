                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Final checks section"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(15, 23, 42, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: =If(varHubFocus = "checks", "5. Complete final checks •", "5. Complete final checks")
                        VerticalAlign: =VerticalAlign.Top
                        Wrap: =false
                  - txtHubChecklistInstruction:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Final checks instructions"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(71, 85, 105, 1)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Check each item when it is complete. Reopen it if more work is needed."
                        VerticalAlign: =VerticalAlign.Top
                  - galHubSteps:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="Final planning checks"
                        BorderColor: =RGBA(203, 213, 225, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: |-
                          =With(
                            {rowCount: CountRows(SortByColumns(colHubSteps, "StepNumber"))},
                            rowCount * If(App.Width < 640, 128, 86) + ((rowCount + 1) * 4)
                          )
                        Items: =SortByColumns(colHubSteps, "StepNumber")
                        ShowScrollbar: =false
                        TabIndex: =0
                        TemplatePadding: =4
                        TemplateSize: =If(App.Width < 640, 128, 86)
                        Visible: =CountRows(SortByColumns(colHubSteps, "StepNumber")) > 0
                        Width: =Parent.Width
                      Children:
                        - conHubStepRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(203, 213, 225, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(244, 247, 251, 1)
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =If(Parent.TemplateWidth < 640, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =4
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.TemplateWidth
                            Children:
                              - txtHubStepIdentity:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Planning step " & ThisItem.'Step Number' & " " & ThisItem.Title
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(15, 23, 42, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =If(App.Width < 640, 42, Parent.Height)
                                    PaddingBottom: =4
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =4
                                    Size: =14
                                    Text: ="Step " & ThisItem.'Step Number' & " — " & ThisItem.Title & " · ID " & ThisItem.ID
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(App.Width < 640, Parent.Width, (Parent.Width - 192) * 0.55)
                              - txtHubStepStatus:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Completion status for " & ThisItem.Title
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =If(ThisItem.Completed, RGBA(5, 150, 105, 1), RGBA(71, 85, 105, 1))
                                    Font: =Font.'Segoe UI'
                                    Height: =If(App.Width < 640, 34, Parent.Height)
                                    PaddingBottom: =4
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =4
                                    Size: =12
                                    Text: =If(ThisItem.Completed, "Complete · By " & ThisItem.'Completed By' & " · " & Text(ThisItem.'Completed Date', "mmm d, yyyy"), "Open · By — · Date —")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =If(App.Width < 640, Parent.Width, (Parent.Width - 192) * 0.45)
                              - chkHubStepComplete:
                                  Control: ModernCheckbox
                                  Properties:
                                    AccessibleLabel: ="Set completion for " & ThisItem.Title
                                    AlignInContainer: =AlignInContainer.Center
                                    BasePaletteColor: =RGBA(37, 99, 235, 1)
                                    Color: =RGBA(15, 23, 42, 1)
                                    Default: =ThisItem.Completed
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Normal
                                    Height: =44
                                    Label: =If(ThisItem.Completed, "Reopen if needed", "Mark complete")
                                    OnCheck: |-
                                      =With(
                                        {targetId: ThisItem.ID, nextComplete: true},
                                        Set(varStepReceipt, Patch('LSS Calendar Planning Steps', LookUp('LSS Calendar Planning Steps', ID = targetId), {Completed: nextComplete, 'Completed By': User().FullName, 'Completed Date': Today()}));
                                        Refresh('LSS Calendar Planning Steps');
                                        ClearCollect(colHubSteps, Filter('LSS Calendar Planning Steps', StartsWith(Title, "")));
                                        Set(varStepReceiptVisible, true)
                                      )
                                    OnUncheck: |-
                                      =With(
                                        {targetId: ThisItem.ID, nextComplete: false},
                                        Set(varStepReceipt, Patch('LSS Calendar Planning Steps', LookUp('LSS Calendar Planning Steps', ID = targetId), {Completed: nextComplete, 'Completed By': "", 'Completed Date': Blank()}));
                                        Refresh('LSS Calendar Planning Steps');
                                        ClearCollect(colHubSteps, Filter('LSS Calendar Planning Steps', StartsWith(Title, "")));
                                        Set(varStepReceiptVisible, true)
                                      )
                                    Size: =14
                                    Width: =If(App.Width < 640, Parent.Width, 180)
                  - txtHubStepEmpty:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="No planning steps found"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(71, 85, 105, 1)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="No final-check steps are available yet."
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =CountRows(SortByColumns(colHubSteps, "StepNumber")) = 0
            - conHubReadiness:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =If(CountRows(Filter(colHubCalendar, Year(EventDate) = 2027 && Category <> "Closure")) = 0, 158, 634)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: =varHubFocus = "readiness"
                Children:
                  - txtHubReadinessHeading:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Prepare for Outlook section"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(15, 23, 42, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =20
                        Text: =If(varHubFocus = "readiness", "6. Prepare for Outlook •", "6. Prepare for Outlook")
                        VerticalAlign: =VerticalAlign.Top
                        Wrap: =false
                  - txtHubReadinessInstruction:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Readiness review instructions"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(71, 85, 105, 1)
                        Font: =Font.'Segoe UI'
                        Height: =50
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Review every 2027 non-closure meeting. Fix blocked details, then mark eligible SharePoint records for IT review."
                        VerticalAlign: =VerticalAlign.Top
                  - galHubReadiness:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="2027 meeting readiness review"
                        BorderColor: =RGBA(203, 213, 225, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =520
                        Items: |-
                          =AddColumns(
                            AddColumns(
                              SortByColumns(Filter(colHubCalendar, Year(EventDate) = 2027 && Category <> "Closure"), "EventDate"),
                              IsReady,
                              With(
                                {plannedId: ID, plannedTitle: Title, plannedDate: EventDate, plannedSourceRule: 'Source Rule'},
                                With(
                                  {matchedRule: LookUp(colHubRules, Title = plannedSourceRule)},
                                  !IsBlank(plannedTitle) &&
                                  !IsBlank(plannedDate) &&
                                  !IsBlank('Start Time') &&
                                  !IsBlank(Duration) &&
                                  !IsBlank('Planning Stage'.Value) &&
                                  !IsBlank(Calendar.Value) &&
                                  !IsBlank('Outlook Sync Status'.Value) &&
                                  CountRows(Filter(colHubCalendar, Title = plannedTitle && EventDate = plannedDate && ID <> plannedId)) = 0 &&
                                  CountRows(Filter(colHubCalendar, Category = "Closure" && EventDate = plannedDate)) = 0 &&
                                  If(
                                    plannedSourceRule = "Manual entry",
                                    !IsBlank('Planning Notes'),
                                    !IsBlank(matchedRule) &&
                                    matchedRule.Completed &&
                                    matchedRule.RuleStatus.Value = "Confirmed" &&
                                    !IsBlank(matchedRule.Frequency) &&
                                    !IsBlank(matchedRule.StartMonth.Value) &&
                                    !IsBlank(matchedRule.PreferredTime) &&
                                    (!IsBlank(matchedRule.Duration0) || !IsBlank(matchedRule.Duration)) &&
                                    !IsBlank(matchedRule.Calendar) &&
                                    matchedRule.Calendar <> "To confirm" &&
                                    IsBlank(matchedRule.'Questions/Comments')
                                  )
                                )
                              )
                            ),
                            BlockReason,
                            If(
                              IsReady,
                              "Ready — all checks complete",
                              IsBlank(Title), "Blocked — Title is missing",
                              IsBlank(EventDate), "Blocked — Event date is missing",
                              IsBlank('Start Time'), "Blocked — Start time is missing",
                              IsBlank(Duration), "Blocked — Duration is missing",
                              IsBlank('Planning Stage'.Value), "Blocked — Planning stage is missing",
                              IsBlank(Calendar.Value), "Blocked — Calendar is missing",
                              IsBlank('Outlook Sync Status'.Value), "Blocked — Outlook sync review status is missing",
                              'Source Rule' = "Manual entry" && IsBlank('Planning Notes'), "Blocked — Manual entry needs planning notes",
                              "Blocked — linked rule needs confirmation or required details"
                            )
                          )
                        TabIndex: =0
                        TemplatePadding: =4
                        TemplateSize: =If(App.Width < 640, 254, 150)
                        Visible: =CountRows(Filter(colHubCalendar, Year(EventDate) = 2027 && Category <> "Closure")) > 0
                        Width: =Parent.Width
                      Children:
                        - conHubReadinessRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(203, 213, 225, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(244, 247, 251, 1)
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.TemplateWidth
                            Children:
                              - txtHubReadinessTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Meeting " & ThisItem.Title
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(15, 23, 42, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =If(App.Width < 640, 48, 24)
                                    PaddingBottom: =0
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =0
                                    Size: =16
                                    Text: =ThisItem.Title & " · ID " & ThisItem.ID
                                    VerticalAlign: =VerticalAlign.Top
                              - txtHubReadinessDetails:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="Meeting details for " & ThisItem.Title
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(71, 85, 105, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =If(App.Width < 640, 56, 42)
                                    PaddingBottom: =0
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =0
                                    Size: =12
                                    Text: |-
                                      ="Date: " & Text(ThisItem.EventDate, "mmm d, yyyy") & " · Start: " & ThisItem.'Start Time' & " · Duration: " & ThisItem.Duration & " · Stage: " & ThisItem.'Planning Stage'.Value & " · Calendar: " & ThisItem.Calendar.Value & " · Source rule: " & ThisItem.'Source Rule'
                                    VerticalAlign: =VerticalAlign.Top
                              - txtHubReadinessStatus:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =ThisItem.BlockReason & " for " & ThisItem.Title
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =If(ThisItem.IsReady, RGBA(5, 150, 105, 1), RGBA(220, 38, 38, 1))
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =If(App.Width < 640, 38, 26)
                                    PaddingBottom: =0
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =0
                                    Size: =12
                                    Text: |-
                                      =ThisItem.BlockReason & " · Ready: " & If(ThisItem.'Ready for Outlook', "Yes", "No") & " · IT status: " & ThisItem.'Outlook Sync Status'.Value
                                    VerticalAlign: =VerticalAlign.Top
                              - conHubReadyActions:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(244, 247, 251, 1)
                                    FillPortions: =0
                                    Height: =If(App.Width < 640, 92, 44)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =If(Parent.Width < 640, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - btnHubFixMeeting:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Fix details for " & ThisItem.Title
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(15, 43, 91, 1)
                                          Color: =RGBA(15, 43, 91, 1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =44
                                          Layout: =ButtonLayout.TextOnly
                                          LayoutMinWidth: =140
                                          OnSelect: |-
                                            =Set(varSelectedEvent, LookUp('LSS Planned Calendar', ID = ThisItem.ID));
                                            Navigate(MeetingEditorScreen)
                                          Size: =14
                                          Text: ="Fix details"
                                          Width: =If(App.Width < 640, Parent.Width, (Parent.Width - 4) / 2)
                                    - btnHubMarkReady:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Mark " & ThisItem.Title & " ready for IT review"
                                          AlignInContainer: =AlignInContainer.Stretch
                                          BasePaletteColor: =RGBA(37, 99, 235, 1)
                                          Color: =RGBA(255, 255, 255, 1)
                                          DisplayMode: =If(ThisItem.IsReady && !ThisItem.'Ready for Outlook', DisplayMode.Edit, DisplayMode.Disabled)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =44
                                          Layout: =ButtonLayout.TextOnly
                                          LayoutMinWidth: =140
                                          OnSelect: |-
                                            =If(
                                              ThisItem.IsReady,
                                              With(
                                                {targetId: ThisItem.ID},
                                                Set(varMeetingReceipt, Patch('LSS Planned Calendar', LookUp('LSS Planned Calendar', ID = targetId), {'Ready for Outlook': true, 'Outlook Sync Status': {Value: "Ready for IT review"}}));
                                                Refresh('LSS Planned Calendar');
                                                ClearCollect(colHubRules, Filter('LSS Meeting Types', StartsWith(Title, "")));
                                                ClearCollect(colHubCalendar, Filter('LSS Planned Calendar', EventDate >= Date(2027,1,1) && EventDate < Date(2028,1,1)));
                                                ClearCollect(colPlannerEvents, Filter('LSS Planned Calendar', EventDate >= Date(2027,1,1) && EventDate < Date(2028,1,1)));
                                                Set(varMeetingReceiptAction, "Marked ready");
                                                Set(varMeetingReceiptVisible, true)
                                              )
                                            )
                                          Size: =14
                                          Text: =If(ThisItem.'Ready for Outlook', "Ready for IT review", "Mark ready")
                                          Width: =If(App.Width < 640, Parent.Width, (Parent.Width - 4) / 2)
                  - txtHubReadinessEmpty:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="No 2027 meetings need readiness review"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(71, 85, 105, 1)
                        Font: =Font.'Segoe UI'
                        Height: =44
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="No 2027 non-closure meetings are available for readiness review."
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =CountRows(Filter(colHubCalendar, Year(EventDate) = 2027 && Category <> "Closure")) = 0
