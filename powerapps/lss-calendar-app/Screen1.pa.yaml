Screens:
  Screen1:
    Properties:
      Fill: =RGBA(244, 247, 251, 1)
      OnVisible: |-
        =Refresh('LSS Calendar Planning Steps');
        Refresh('LSS Planned Calendar');
        Refresh('LSS Meeting Types');
        ClearCollect(colHubSteps, Filter('LSS Calendar Planning Steps', StartsWith(Title, "")));
        ClearCollect(colHubCalendar, Filter('LSS Planned Calendar', EventDate >= Date(2027,1,1) && EventDate < Date(2028,1,1)));
        ClearCollect(colHubRules, Filter('LSS Meeting Types', StartsWith(Title, "")))
    Children:
      - conHubRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(244, 247, 251, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 640, 16, 24)
            PaddingLeft: =If(App.Width < 640, 16, 24)
            PaddingRight: =If(App.Width < 640, 16, 24)
            PaddingTop: =If(App.Width < 640, 16, 24)
            Width: =Parent.Width
          Children:
            - conHubHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Semilight
                  Fill: =RGBA(15, 43, 91, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, 320, 184)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - txtHubTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="LSS 2027 Calendar Planning"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =42
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =28
                        Text: ="LSS 2027 Calendar Planning"
                        VerticalAlign: =VerticalAlign.Top
                  - txtHubSubtitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Six guided steps for Felise"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =If(App.Width < 640, 24, 22)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Start with Step 1 — the app will guide you"
                        VerticalAlign: =VerticalAlign.Top
                        Wrap: =false
                  - txtHubSafety:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Outlook safety note"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        Height: =If(App.Width < 640, 50, 36)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="This only marks SharePoint records for IT review. It does not send invitations."
                        VerticalAlign: =VerticalAlign.Top
                  - conHubNav:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(15, 43, 91, 1)
                        FillPortions: =0
                        Height: =If(App.Width < 640, 148, 44)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(Parent.Width < 640, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                      Children:
                        - btnHubHome:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Home and final checks, current page"
                              AlignInContainer: =AlignInContainer.Stretch
                              BasePaletteColor: =RGBA(37, 99, 235, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinWidth: =180
                              OnSelect: =Set(varHubFocus, "home")
                              Size: =14
                              Text: ="Home & final checks"
                              Width: =If(App.Width < 640, Parent.Width, 180)
                        - btnHubRules:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to rules and build"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(15, 43, 91, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinWidth: =180
                              OnSelect: =Navigate(MainScreen1)
                              Size: =14
                              Text: ="1–2 Rules & build"
                              Width: =If(App.Width < 640, Parent.Width, 180)
                        - btnHubYear:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Go to full year calendar"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(15, 43, 91, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinWidth: =180
                              OnSelect: =Navigate(Screen2)
                              Size: =14
                              Text: ="3 Full year"
                              Width: =If(App.Width < 640, Parent.Width, 180)
            - conHubReceipts:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 247, 251, 1)
                  FillPortions: =0
                  Height: =If(App.Width < 640, If(varStepReceiptVisible && varMeetingReceiptVisible, 336, 164), 112)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(Parent.Width < 640, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =varStepReceiptVisible || varMeetingReceiptVisible
                Children:
                  - conHubStepReceipt:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(5, 150, 105, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(App.Width < 640, 164, 112)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =varStepReceiptVisible
                        Width: =If(App.Width < 640, Parent.Width, If(varMeetingReceiptVisible, (Parent.Width - 8) / 2, Parent.Width))
                      Children:
                        - txtHubStepReceipt:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Planning step update receipt"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(15, 23, 42, 1)
                              Font: =Font.'Segoe UI'
                              Height: =If(App.Width < 640, 96, 44)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                ="Step saved · ID: " & varStepReceipt.ID & " · Step: " & varStepReceipt.'Step Number' & " · Title: " & varStepReceipt.Title & " · Completed: " & If(varStepReceipt.Completed, "Yes", "No") & " · Completed by: " & If(IsBlank(varStepReceipt.'Completed By'), "Cleared", varStepReceipt.'Completed By') & " · Completed date: " & If(IsBlank(varStepReceipt.'Completed Date'), "Cleared", Text(varStepReceipt.'Completed Date', "mmm d, yyyy"))
                              VerticalAlign: =VerticalAlign.Top
                        - btnHubDismissStepReceipt:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Dismiss planning step receipt"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =RGBA(5, 150, 105, 1)
                              Color: =RGBA(15, 23, 42, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Set(varStepReceiptVisible, false)
                              Size: =14
                              Text: ="Dismiss step receipt"
                              Width: =Parent.Width
                  - conHubReadyReceipt:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(5, 150, 105, 1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(App.Width < 640, 164, 112)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =varMeetingReceiptVisible
                        Width: =If(App.Width < 640, Parent.Width, If(varStepReceiptVisible, (Parent.Width - 8) / 2, Parent.Width))
                      Children:
                        - txtHubReadyReceipt:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Meeting readiness update receipt"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(15, 23, 42, 1)
                              Font: =Font.'Segoe UI'
                              Height: =If(App.Width < 640, 96, 44)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                =varMeetingReceiptAction & " · ID: " & varMeetingReceipt.ID & " · Title: " & varMeetingReceipt.Title & " · Date: " & Text(varMeetingReceipt.EventDate, "mmm d, yyyy") & " · Ready for Outlook: " & If(varMeetingReceipt.'Ready for Outlook', "Yes", "No") & " · Outlook Sync Status: " & varMeetingReceipt.'Outlook Sync Status'.Value
                              VerticalAlign: =VerticalAlign.Top
                        - btnHubDismissReadyReceipt:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Dismiss meeting readiness receipt"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =RGBA(5, 150, 105, 1)
                              Color: =RGBA(15, 23, 42, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              OnSelect: =Set(varMeetingReceiptVisible, false)
                              Size: =14
                              Text: ="Dismiss readiness receipt"
                              Width: =Parent.Width
            - conHubWorkflow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(244, 247, 251, 1)
                  FillPortions: =0
