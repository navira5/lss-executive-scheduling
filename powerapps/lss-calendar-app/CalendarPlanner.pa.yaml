                                  Properties:
                                    AccessibleLabel: ="Reason for blocking the date"
                                    Default: =varPlannerOverrideReason
                                    Height: =70
                                    OnChange: =Set(varPlannerOverrideReason,Self.Text);Set(varPlannerDraftDirty,true)
                                    Placeholder: ="Reason this date is unavailable"
                                    Type: =TextInputType.Multiline
                              - txtPlannerBlockImpact:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(146,64,14,1)
                                    Fill: =RGBA(255,251,235,1)
                                    Font: =Font.'Segoe UI'
                                    Height: =74
                                    LayoutMinWidth: =0
                                    PaddingLeft: =10
                                    Size: =12
                                    Text: =If(varCalProofBoardConfirmed && CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=varPlannerDraftDate && PlanningLayer="Board")>0,"Board is confirmed. Reopen Board planning before blocking a date that contains a locked Board meeting.",Text(CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=varPlannerDraftDate)) & " meeting" & If(CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=varPlannerDraftDate)=1,"","s") & " will be affected. Each will be proposed on the next valid business date and marked Needs approval.")
                              - btnPlannerSaveBlock:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Create blocked date"
                                    BasePaletteColor: =RGBA(180,83,9,1)
                                    DisplayMode: =If(IsBlank(Trim(varPlannerOverrideReason)) || CountIf(colCalProofClosures,ClosureDate=varPlannerDraftDate && IsActive)>0 || (varCalProofBoardConfirmed && CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=varPlannerDraftDate && PlanningLayer="Board")>0),DisplayMode.Disabled,DisplayMode.Edit)
                                    Height: =44
                                    OnSelect: |-
                                      =With(
                                        {newBlockId:"BLOCK-" & Text(varPlannerDraftDate,"yyyymmdd") & "-" & Text(Now(),"hhmmss"),impactCount:CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=varPlannerDraftDate)},
                                        Collect(colCalProofClosures,{ClosureId:newBlockId,ClosureName:varPlannerOverrideReason,ClosureLabel:"Blocked",ClosureDate:varPlannerDraftDate,PlanYear:varPlannerYear,ClosureType:"User block",IsActive:true,Source:"User",OverrideReason:varPlannerOverrideReason,ChangedAt:Now()});
                                        ClearCollect(colPlannerUndo,{Action:"Block",SubjectId:newBlockId,EventName:varPlannerOverrideReason,PreviousDate:varPlannerDraftDate,PreviousStart:Time(0,0,0),PreviousEnd:Time(0,0,0),PreviousStatus:"",PreviousActive:false,SnapshotEvent:First(colCalProofEvents),SnapshotClosure:LookUp(colCalProofClosures,ClosureId=newBlockId)});
                                        With(
                                          {nextBusinessDate:GetNextPlannerBusinessDate(varPlannerDraftDate,varPlannerYear)},
                                          UpdateIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=varPlannerDraftDate,{EventDate:nextBusinessDate,CurrentDate:nextBusinessDate,AutoAdjusted:true,AdjustmentReason:"Moved because " & varPlannerOverrideReason,AdjustmentSourceName:varPlannerOverrideReason,DecisionStatus:"NeedsReview"})
                                        );
                                        Set(varPlannerReceipt,"Blocked " & Text(varPlannerDraftDate,"mmm d, yyyy") & ". " & Text(impactCount) & " affected meeting" & If(impactCount=1," was","s were") & " proposed on the next valid business date for human review.");
                                        Collect(colPlannerHistory,{ChangeId:"CHG-" & Text(Now(),"yyyymmddhhmmss"),Action:"Block",SubjectId:newBlockId,Summary:varPlannerReceipt,ChangedAt:Now()})
                                      );
                                      Set(varPlannerDraftDirty,false);
                                      Set(varPlannerContextMode,"Empty")
                                    Text: ="Block date"
                              - btnPlannerCancelBlock:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Cancel blocked date"
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(71,85,105,1)
                                    Height: =42
                                    OnSelect: =Set(varPlannerDraftDirty,false);Set(varPlannerContextMode,"Empty")
                                    Text: ="Cancel"
                        - conPlannerClosure:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =varPlannerContextMode="Closure"
                            Children:
                              - txtPlannerClosureType:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
