                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(15,23,42,1)
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    LayoutMinWidth: =0
                                    Text: =Text(LookUp(colCalProofClosures,ClosureId=varPlannerSelectedClosureId,ClosureDate),"dddd, mmmm d, yyyy")
