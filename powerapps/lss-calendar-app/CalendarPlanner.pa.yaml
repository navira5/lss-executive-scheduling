                                    LayoutMinWidth: =0
                                    Size: =12
                                    Text: =If(LookUp(colCalProofClosures,ClosureId=varPlannerSelectedClosureId,ClosureType)="User block","This user-created block can be removed. Previously adjusted meetings will not move back automatically.","This is a verified holiday. Marking it open affects only " & Text(varPlannerYear) & ", requires a reason, and remains in local audit history.")
                              - inpPlannerHolidayReason:
                                  Control: ModernTextInput
                                  Properties:
                                    AccessibleLabel: ="Reason LSS is open on this verified holiday"
                                    Default: =varPlannerOverrideReason
                                    Height: =70
                                    OnChange: =Set(varPlannerOverrideReason,Self.Text)
                                    Placeholder: ="Why is LSS open on this date?"
                                    Type: =TextInputType.Multiline
                                    Visible: =LookUp(colCalProofClosures,ClosureId=varPlannerSelectedClosureId,ClosureType)<>"User block"
                              - btnPlannerRemoveClosure:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(LookUp(colCalProofClosures,ClosureId=varPlannerSelectedClosureId,ClosureType)="User block","Remove block","Mark this verified holiday open for " & Text(varPlannerYear))
                                    BasePaletteColor: =RGBA(180,83,9,1)
                                    DisplayMode: =If(LookUp(colCalProofClosures,ClosureId=varPlannerSelectedClosureId,ClosureType)<>"User block" && IsBlank(Trim(varPlannerOverrideReason)),DisplayMode.Disabled,DisplayMode.Edit)
                                    Height: =48
                                    OnSelect: |-
                                      =With(
                                        {selectedClosure:LookUp(colCalProofClosures,ClosureId=varPlannerSelectedClosureId)},
                                        ClearCollect(colPlannerUndo,{Action:"Deactivate closure",SubjectId:selectedClosure.ClosureId,EventName:selectedClosure.ClosureName,PreviousDate:selectedClosure.ClosureDate,PreviousStart:Time(0,0,0),PreviousEnd:Time(0,0,0),PreviousStatus:"",PreviousActive:selectedClosure.IsActive,SnapshotEvent:First(colCalProofEvents),SnapshotClosure:selectedClosure});
                                        Patch(colCalProofClosures,selectedClosure,{IsActive:false,OverrideReason:If(selectedClosure.ClosureType="User block",selectedClosure.OverrideReason,varPlannerOverrideReason),ChangedAt:Now()});
                                        Set(varPlannerReceipt,If(selectedClosure.ClosureType="User block","Block removed. Adjusted meetings were not moved back; review or regenerate as needed.",selectedClosure.ClosureName & " marked open for " & Text(varPlannerYear) & ". Reason recorded. Review or regenerate affected meetings."));
                                        Collect(colPlannerHistory,{ChangeId:"CHG-" & Text(Now(),"yyyymmddhhmmss"),Action:If(selectedClosure.ClosureType="User block","Remove block","Holiday override"),SubjectId:selectedClosure.ClosureId,Summary:varPlannerReceipt,ChangedAt:Now()})
                                      );
                                      Set(varPlannerSelectedClosureId,"");
                                      Set(varPlannerOverrideReason,"");
                                      Reset(inpPlannerHolidayReason);
                                      Set(varPlannerContextMode,"Empty")
                                    Text: =If(LookUp(colCalProofClosures,ClosureId=varPlannerSelectedClosureId,ClosureType)="User block","Remove block","Mark this holiday open for " & Text(varPlannerYear))
                              - btnPlannerCancelClosure:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Close hard stop details"
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(71,85,105,1)
                                    Height: =42
                                    OnSelect: =Set(varPlannerContextMode,"Empty")
                                    Text: ="Close"
                        - conPlannerReceipt:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(134,239,172,1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(240,253,244,1)
                              FillPortions: =0
                              Height: =150
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =10
                              PaddingLeft: =10
