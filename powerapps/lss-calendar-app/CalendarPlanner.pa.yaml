Screens:
  CalendarPlanner:
    Properties:
      Fill: =RGBA(244,247,251,1)
      LoadingSpinnerColor: =RGBA(37,99,235,1)
      OnVisible: =Set(varPlannerShowPlanningStatus,false)
    Children:
      - conPlannerRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(244,247,251,1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - conPlannerHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<900,188,92)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width<900,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =14
                  PaddingLeft: =18
                  PaddingRight: =18
                  PaddingTop: =14
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                Children:
                  - conPlannerTitle:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtPlannerTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Calendar Planner for " & Text(varPlannerYear)
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(15,23,42,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =26
                              Text: ="Calendar Planner " & Text(varPlannerYear)
                              Wrap: =false
                        - txtPlannerSubtitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              Height: =20
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Local planning workspace · no Outlook actions · one shared calendar state"
                              Wrap: =false
                  - conPlannerYearAndViews:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(App.Width<900,Parent.Width,590)
                      Children:
                        - drpPlannerYear:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: ="Plan year"
                              Default: ={Value:varPlannerYear-2025,PlanYear:varPlannerYear}
                              Height: =44
                              ItemDisplayText: =ThisItem.PlanYear
                              Items: =AddColumns(Sequence(11),PlanYear,Value+2025)
                              LayoutMinWidth: =110
                              OnChange: |-
                                =Set(varPlannerYear,Self.Selected.PlanYear);
                                Set(varPlannerFocusedDate,Date(varPlannerYear,1,1));
                                Set(varPlannerSelectedEventId,"");
                                Set(varPlannerSelectedClosureId,"");
                                If(!varPlannerDraftDirty,Set(varPlannerContextMode,"Empty"))
                              Width: =120
                        - btnPlannerYearView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show year view"
                              Appearance: =If(varPlannerView="Year",ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(37,99,235,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =90
                              OnSelect: =Set(varPlannerView,"Year")
                              Text: ="Year"
                        - btnPlannerMonthView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show month view"
                              Appearance: =If(varPlannerView="Month",ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(37,99,235,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =90
                              OnSelect: =Set(varPlannerView,"Month");Navigate(CalendarPlannerMonth,ScreenTransition.None)
                              Text: ="Month"
                        - btnPlannerWeekView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show week view"
                              Appearance: =If(varPlannerView="Week",ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(37,99,235,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =90
                              OnSelect: =Set(varPlannerView,"Week");Navigate(CalendarPlannerWeek,ScreenTransition.None)
                              Text: ="Week"
            - conPlanYrStepper:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<640,112,60)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =If(App.Width<640,true,false)
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - txtPlannerStatusHeading:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        Color: =RGBA(15,43,91,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        LayoutMinWidth: =118
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="Planning status"
                        Wrap: =false
                  - txtPlannerStatusSummary:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        Color: =RGBA(71,85,105,1)
                        FillPortions: =1
                        Height: =44
                        LayoutMinWidth: =180
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: |-
                          =With(
                            {
                              reviewCount:CountIf(colCalProofEvents,PlanYear=varPlannerYear && DecisionStatus="NeedsReview"),
                              unfinishedCount:CountIf(colPlannerLayerState,Status<>"Confirmed")
                            },
                            If(reviewCount>0,Text(reviewCount)&" date"&If(reviewCount=1," needs","s need")&" review",Text(unfinishedCount)&" planning layer"&If(unfinishedCount=1," remains","s remain"))
                          )
                        VerticalAlign: =VerticalAlign.Middle
                  - btnPlannerStatusOpen:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(varPlannerShowPlanningStatus,"Close planning status","Open planning status")
                        Appearance: =If(varPlannerShowPlanningStatus,ButtonAppearance.Outline,ButtonAppearance.Primary)
                        BasePaletteColor: =RGBA(37,99,235,1)
                        Height: =44
                        LayoutMinWidth: =156
                        OnSelect: =Set(varPlannerShowPlanningStatus,!varPlannerShowPlanningStatus)
                        Text: =If(varPlannerShowPlanningStatus,"Close planning","Open planning")
                  - btnPlanYrStepBoard:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open Board planning. " & LookUp(colPlannerLayerState,PlanningLayer="Board",Status)
                        Appearance: =If(varPlannerActiveStep="Board",ButtonAppearance.Primary,If(LookUp(colPlannerLayerState,PlanningLayer="Board",Status)="Confirmed",ButtonAppearance.Primary,ButtonAppearance.Outline))
                        BasePaletteColor: =If(LookUp(colPlannerLayerState,PlanningLayer="Board",Status)="Confirmed",RGBA(21,128,61,1),If(LookUp(colPlannerLayerState,PlanningLayer="Board",Status) in ["Needs review","Needs regeneration","Needs revalidation"],RGBA(217,119,6,1),RGBA(37,99,235,1)))
                        FillPortions: =1
                        Height: =44
                        LayoutMinWidth: =150
                        OnSelect: =Set(varPlannerActiveStep,"Board");Set(varPlannerActiveLayer,"Board");Set(varPlannerSelectedEventId,"");Set(varPlannerSelectedClosureId,"");Set(varPlannerContextMode,"Layer");Set(varPlannerAcceptAllAdjustments,false);Set(varPlannerLayerReceipt,"")
                        Text: ="1  Board"
                        Visible: =false
                  - btnPlanYrStepCommittees:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open Board Committees planning. " & LookUp(colPlannerLayerState,PlanningLayer="Board Committees",Status)
                        Appearance: =If(varPlannerActiveStep="Board Committees",ButtonAppearance.Primary,If(LookUp(colPlannerLayerState,PlanningLayer="Board Committees",Status)="Confirmed",ButtonAppearance.Primary,ButtonAppearance.Outline))
                        BasePaletteColor: =If(LookUp(colPlannerLayerState,PlanningLayer="Board Committees",Status)="Confirmed",RGBA(21,128,61,1),If(LookUp(colPlannerLayerState,PlanningLayer="Board Committees",Status) in ["Needs review","Needs regeneration","Needs revalidation"],RGBA(217,119,6,1),RGBA(37,99,235,1)))
                        FillPortions: =1
                        Height: =44
                        LayoutMinWidth: =150
                        OnSelect: =Set(varPlannerActiveStep,"Board Committees");Set(varPlannerActiveLayer,"Board Committees");Set(varPlannerSelectedEventId,"");Set(varPlannerSelectedClosureId,"");Set(varPlannerContextMode,"Layer");Set(varPlannerAcceptAllAdjustments,false);Set(varPlannerLayerReceipt,"")
                        Text: ="2  Committees"
                        Visible: =false
                  - btnPlanYrStepExecutive:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open Executive Leadership planning. " & LookUp(colPlannerLayerState,PlanningLayer="Executive Leadership",Status)
                        Appearance: =If(varPlannerActiveStep="Executive Leadership",ButtonAppearance.Primary,If(LookUp(colPlannerLayerState,PlanningLayer="Executive Leadership",Status)="Confirmed",ButtonAppearance.Primary,ButtonAppearance.Outline))
                        BasePaletteColor: =If(LookUp(colPlannerLayerState,PlanningLayer="Executive Leadership",Status)="Confirmed",RGBA(21,128,61,1),If(LookUp(colPlannerLayerState,PlanningLayer="Executive Leadership",Status) in ["Needs review","Needs regeneration","Needs revalidation"],RGBA(217,119,6,1),RGBA(37,99,235,1)))
                        FillPortions: =1
                        Height: =44
                        LayoutMinWidth: =150
                        OnSelect: =Set(varPlannerActiveStep,"Executive Leadership");Set(varPlannerActiveLayer,"Executive Leadership");Set(varPlannerSelectedEventId,"");Set(varPlannerSelectedClosureId,"");Set(varPlannerContextMode,"Layer");Set(varPlannerAcceptAllAdjustments,false);Set(varPlannerLayerReceipt,"")
                        Text: ="3  Executive"
                        Visible: =false
                  - btnPlanYrStepOperations:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open Organization and Operations planning. " & LookUp(colPlannerLayerState,PlanningLayer="Organization & Operations",Status)
                        Appearance: =If(varPlannerActiveStep="Organization & Operations",ButtonAppearance.Primary,If(LookUp(colPlannerLayerState,PlanningLayer="Organization & Operations",Status)="Confirmed",ButtonAppearance.Primary,ButtonAppearance.Outline))
                        BasePaletteColor: =If(LookUp(colPlannerLayerState,PlanningLayer="Organization & Operations",Status)="Confirmed",RGBA(21,128,61,1),If(LookUp(colPlannerLayerState,PlanningLayer="Organization & Operations",Status) in ["Needs review","Needs regeneration","Needs revalidation"],RGBA(217,119,6,1),RGBA(37,99,235,1)))
                        FillPortions: =1
                        Height: =44
                        LayoutMinWidth: =150
                        OnSelect: =Set(varPlannerActiveStep,"Organization & Operations");Set(varPlannerActiveLayer,"Organization & Operations");Set(varPlannerSelectedEventId,"");Set(varPlannerSelectedClosureId,"");Set(varPlannerContextMode,"Layer");Set(varPlannerAcceptAllAdjustments,false);Set(varPlannerLayerReceipt,"")
                        Text: ="4  Operations"
                        Visible: =false
                  - btnPlanYrStepFinal:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Open final planning review"
                        Appearance: =If(varPlannerActiveStep="Final Review",ButtonAppearance.Primary,ButtonAppearance.Outline)
                        BasePaletteColor: =RGBA(37,99,235,1)
                        FillPortions: =1
                        Height: =44
                        LayoutMinWidth: =140
                        OnSelect: =Set(varPlannerActiveStep,"Final Review");Set(varPlannerSelectedEventId,"");Set(varPlannerSelectedClosureId,"");Set(varPlannerContextMode,"FinalReview");Set(varPlannerAcceptAllAdjustments,false);Set(varPlannerLayerReceipt,"")
                        Text: ="5  Final Review"
                        Visible: =false
            - conPlanYrCalendarToolbar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Visible: =false
                Children:
                  - conPlanYrVisibility:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255,255,255,0)
                        FillPortions: =0
                        Height: =If(App.Width<900,96,44)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =If(App.Width<900,true,false)
                        Width: =Parent.Width
                      Children:
                        - txtPlanYrShowLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Calendar visibility controls"
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              LayoutMinWidth: =110
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =4
                              PaddingTop: =0
                              Size: =12
                              Text: ="Show on calendar:"
                              Width: =126
                              Wrap: =false
                        - btnPlannerFilterBoard:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Toggle Board meetings"
                              Appearance: =If(varPlannerShowBoard,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(30,64,175,1)
                              Height: =44
                              LayoutMinWidth: =92
                              OnSelect: =Set(varPlannerShowBoard,!varPlannerShowBoard)
                              Text: ="Board"
                        - btnPlannerFilterCommittees:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Toggle committee meetings"
                              Appearance: =If(varPlannerShowCommittees,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(14,116,144,1)
                              Height: =44
                              LayoutMinWidth: =112
                              OnSelect: =Set(varPlannerShowCommittees,!varPlannerShowCommittees)
                              Text: ="Committees"
                        - btnPlannerFilterExecutive:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Toggle executive meetings"
                              Appearance: =If(varPlannerShowExecutive,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(124,58,237,1)
                              Height: =44
                              LayoutMinWidth: =104
                              OnSelect: =Set(varPlannerShowExecutive,!varPlannerShowExecutive)
                              Text: ="Executive"
                        - btnPlannerFilterOperations:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Toggle operations meetings"
                              Appearance: =If(varPlannerShowOperations,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(5,150,105,1)
                              Height: =44
                              LayoutMinWidth: =104
                              OnSelect: =Set(varPlannerShowOperations,!varPlannerShowOperations)
                              Text: ="Operations"
                        - btnPlanYrShowManual:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Toggle manual and special events"
                              Appearance: =If(varPlannerShowManual,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(71,85,105,1)
                              Height: =44
                              LayoutMinWidth: =132
                              OnSelect: =Set(varPlannerShowManual,!varPlannerShowManual)
                              Text: ="Manual / Special"
                        - btnPlanYrShowAll:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show all meeting layers and manual events"
                              Appearance: =If(varPlannerShowBoard && varPlannerShowCommittees && varPlannerShowExecutive && varPlannerShowOperations && varPlannerShowManual,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(37,99,235,1)
                              Height: =44
                              LayoutMinWidth: =70
                              OnSelect: =Set(varPlannerShowBoard,true);Set(varPlannerShowCommittees,true);Set(varPlannerShowExecutive,true);Set(varPlannerShowOperations,true);Set(varPlannerShowManual,true)
                              Text: ="All"
                  - conPlannerActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255,255,255,0)
                        FillPortions: =0
                        Height: =0
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =false
                        Visible: =false
                        Width: =Parent.Width
                      Children:
                        - btnPlannerAddMeeting:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Add a meeting"
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =RGBA(37,99,235,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =120
                              OnSelect: |-
                                =Set(varPlannerContextMode,"Add");
                                Set(varPlannerAddKind,"One-time / special event");
                                Set(varPlannerDraftRuleId,"");
                                Set(varPlannerDraftName,"");
                                Set(varPlannerDraftLayer,varPlannerActiveLayer);
                                Set(varPlannerDraftCategory,"Meeting");
                                Set(varPlannerDraftDate,If(Year(varPlannerFocusedDate)=varPlannerYear,varPlannerFocusedDate,Date(varPlannerYear,1,4)));
                                Set(varPlannerDraftStart,Time(9,0,0));
                                Set(varPlannerDraftDuration,60);
                                Set(varPlannerWarningAcknowledged,false);
                                Set(varPlannerDraftDirty,true);
                                Reset(inpPlannerName);
                                Reset(drpPlannerLayer);
                                Reset(datPlannerDate);
                                Reset(drpPlannerStartTime);
                                Reset(numPlannerDuration)
                              Text: ="Add meeting"
                              Width: =132
                        - btnPlannerBlockDay:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Block a day for all meetings"
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(180,83,9,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =120
                              OnSelect: |-
                                =Set(varPlannerContextMode,"Block");
                                Set(varPlannerDraftDate,If(Year(varPlannerFocusedDate)=varPlannerYear,varPlannerFocusedDate,Date(varPlannerYear,1,4)));
                                Set(varPlannerOverrideReason,"");
                                Set(varPlannerDraftDirty,true);
                                Reset(datPlannerBlockDate);
                                Reset(inpPlannerBlockReason)
                              Text: ="Block day"
                              Width: =120
                        - btnPlannerBoardRules:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Open rules for " & varPlannerActiveLayer
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(30,64,175,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =110
                              OnSelect: =Set(varBrvSelectedRuleId,Coalesce(First(SortByColumns(Filter(colMeetingRulebook,PlanningLayer=varPlannerActiveLayer),"SortOrder",SortOrder.Ascending)).RuleId,varBrvSelectedRuleId));Navigate(BoardRulesReview,ScreenTransition.None)
                              Text: ="Layer rules"
                              Width: =120
                        - btnPlannerStartClean:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Start a clean local plan"
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(185,28,28,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =120
                              OnSelect: =Set(varPlannerContextMode,"StartClean")
                              Text: ="Start clean"
                              Width: =120
                  - conPlanYrAdminMenu:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255,255,255,0)
                        FillPortions: =0
                        Height: =0
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =false
                        Width: =160
                      Children:
                        - btnPlanYrStartCleanLegacy:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Start a clean local plan"
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(185,28,28,1)
                              FillPortions: =1
                              LayoutMinWidth: =120
                              OnSelect: =Set(varPlannerContextMode,"StartClean");Set(varPlannerShowAdmin,false)
                              Text: ="Start clean"
            - conPlannerPlanningStatus:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(191,219,254,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(239,246,255,1)
                  FillPortions: =0
                  Height: =If(varPlannerShowPlanningStatus,If(App.Width<900,290,86),0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width<900,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Visible: =varPlannerShowPlanningStatus
                Children:
                  - txtPlannerPlanningStatusTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: =Self.Text
                        Color: =RGBA(15,43,91,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="Planning status"
                        Visible: =false
                  - conPlannerStatusBoard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(203,213,225,1)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        FillPortions: =1
                        Height: =58
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =If(App.Width<900,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtPlannerStatusBoardSummary:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Color: =RGBA(15,23,42,1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              Height: =46
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: |-
                                =With({ruleCount:CountIf(colMeetingRulebook,PlanningLayer="Board" && RuleStatus<>"Confirmed"),reviewCount:CountIf(colCalProofEvents,PlanYear=varPlannerYear && PlanningLayer="Board" && DecisionStatus="NeedsReview")},"Board" & Char(10) & If(ruleCount>0,Text(ruleCount)&" rules need review",If(reviewCount>0,Text(reviewCount)&" dates need review","Ready to confirm")))
                              VerticalAlign: =VerticalAlign.Top
                        - btnPlannerStatusBoardAction:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Continue Board planning"
