Screens:
  CalendarPlanner:
    Properties:
      Fill: =RGBA(244,247,251,1)
      LoadingSpinnerColor: =RGBA(37,99,235,1)
    Children:
      - conPlannerRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(244,247,251,1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - conPlannerHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<900,188,92)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width<900,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =14
                  PaddingLeft: =18
                  PaddingRight: =18
                  PaddingTop: =14
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                Children:
                  - conPlannerTitle:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtPlannerTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Calendar Planner for " & Text(varPlannerYear)
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(15,23,42,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              LayoutMinWidth: =0
                              Size: =26
                              Text: ="Calendar Planner " & Text(varPlannerYear)
                              Wrap: =false
                        - txtPlannerSubtitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              Height: =20
                              LayoutMinWidth: =0
                              Size: =12
                              Text: ="Local planning workspace · no Outlook actions · one shared calendar state"
                              Wrap: =false
                  - conPlannerYearAndViews:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(App.Width<900,Parent.Width,590)
                      Children:
                        - drpPlannerYear:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: ="Plan year"
                              Default: ={Value:varPlannerYear-2025,PlanYear:varPlannerYear}
                              Height: =44
                              ItemDisplayText: =ThisItem.PlanYear
                              Items: =AddColumns(Sequence(11),PlanYear,Value+2025)
                              LayoutMinWidth: =110
                              OnChange: |-
                                =Set(varPlannerYear,Self.Selected.PlanYear);
                                Set(varPlannerFocusedDate,Date(varPlannerYear,1,1));
                                Set(varPlannerSelectedEventId,"");
                                Set(varPlannerSelectedClosureId,"");
                                If(!varPlannerDraftDirty,Set(varPlannerContextMode,"Empty"))
                              Width: =120
                        - btnPlannerYearView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show year view"
                              Appearance: =If(varPlannerView="Year",ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(37,99,235,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =90
                              OnSelect: =Set(varPlannerView,"Year")
                              Text: ="Year"
                        - btnPlannerMonthView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show month view"
                              Appearance: =If(varPlannerView="Month",ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(37,99,235,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =90
                              OnSelect: =Set(varPlannerView,"Month");Navigate(CalendarPlannerMonth,ScreenTransition.None)
                              Text: ="Month"
                        - btnPlannerWeekView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show week view"
                              Appearance: =If(varPlannerView="Week",ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(37,99,235,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =90
                              OnSelect: =Set(varPlannerView,"Week");Navigate(CalendarPlannerWeek,ScreenTransition.None)
                              Text: ="Week"
            - conPlannerToolbar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<1100,160,72)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width<1100,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - conPlannerFilters:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnPlannerFilterBoard:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =If(varPlannerShowBoard,"Hide Board meetings","Show Board meetings")
                              Appearance: =If(varPlannerShowBoard,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(30,64,175,1)
                              FillPortions: =1
                              LayoutMinWidth: =90
                              OnSelect: =Set(varPlannerShowBoard,!varPlannerShowBoard)
                              Text: ="Board"
                        - btnPlannerFilterCommittees:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =If(varPlannerShowCommittees,"Hide Board Committees","Show Board Committees")
                              Appearance: =If(varPlannerShowCommittees,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(14,116,144,1)
                              FillPortions: =1
                              LayoutMinWidth: =118
                              OnSelect: |-
                                =ForAll(
                                  Filter(colPlannerLayerRuleEvents,PlanYear=varPlannerYear && PlanningLayer="Board Committees") As generatedMeeting,
                                  With(
                                    {generatedId:generatedMeeting.EventId},
                                    If(
                                      IsBlank(LookUp(colCalProofEvents,EventId=generatedId)) && IsBlank(LookUp(colPlannerExclusions,EventId=generatedId)),
                                      Collect(colCalProofEvents,generatedMeeting)
                                    )
                                  )
                                );
                                Set(varPlannerShowCommittees,!varPlannerShowCommittees)
                              Text: ="Committees"
                        - btnPlannerFilterExecutive:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =If(varPlannerShowExecutive,"Hide Executive Leadership","Show Executive Leadership")
                              Appearance: =If(varPlannerShowExecutive,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(124,58,237,1)
                              FillPortions: =1
                              LayoutMinWidth: =110
                              OnSelect: |-
                                =ForAll(
                                  Filter(colPlannerLayerRuleEvents,PlanYear=varPlannerYear && PlanningLayer="Executive Leadership") As generatedMeeting,
                                  With(
                                    {generatedId:generatedMeeting.EventId},
                                    If(
                                      IsBlank(LookUp(colCalProofEvents,EventId=generatedId)) && IsBlank(LookUp(colPlannerExclusions,EventId=generatedId)),
                                      Collect(colCalProofEvents,generatedMeeting)
                                    )
                                  )
                                );
                                Set(varPlannerShowExecutive,!varPlannerShowExecutive)
                              Text: ="Executive"
                        - btnPlannerFilterOperations:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =If(varPlannerShowOperations,"Hide Organization and Operations","Show Organization and Operations")
                              Appearance: =If(varPlannerShowOperations,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(5,150,105,1)
                              FillPortions: =1
                              LayoutMinWidth: =110
                              OnSelect: |-
                                =ForAll(
                                  Filter(colPlannerLayerRuleEvents,PlanYear=varPlannerYear && PlanningLayer="Organization & Operations") As generatedMeeting,
                                  With(
                                    {generatedId:generatedMeeting.EventId},
                                    If(
                                      IsBlank(LookUp(colCalProofEvents,EventId=generatedId)) && IsBlank(LookUp(colPlannerExclusions,EventId=generatedId)),
                                      Collect(colCalProofEvents,generatedMeeting)
                                    )
                                  )
                                );
                                Set(varPlannerShowOperations,!varPlannerShowOperations)
                              Text: ="Operations"
                  - conPlannerActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(App.Width<1100,Parent.Width,390)
                      Children:
                        - btnPlannerAddMeeting:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Add a meeting"
                              BasePaletteColor: =RGBA(37,99,235,1)
                              FillPortions: =1
                              LayoutMinWidth: =120
                              OnSelect: |-
                                =Set(varPlannerContextMode,"Add");
                                Set(varPlannerDraftName,"");
                                Set(varPlannerDraftLayer,"Board");
                                Set(varPlannerDraftCategory,"Meeting");
                                Set(varPlannerDraftDate,If(Year(varPlannerFocusedDate)=varPlannerYear,varPlannerFocusedDate,Date(varPlannerYear,1,4)));
                                Set(varPlannerDraftStart,Time(9,0,0));
                                Set(varPlannerDraftDuration,60);
                                Set(varPlannerWarningAcknowledged,false);
                                Set(varPlannerDraftDirty,true);
                                Reset(inpPlannerName);
                                Reset(drpPlannerLayer);
                                Reset(inpPlannerCategory);
                                Reset(datPlannerDate);
                                Reset(drpPlannerStartTime);
                                Reset(numPlannerDuration)
                              Text: ="Add meeting"
                        - btnPlannerBlockDay:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Block a day for all meetings"
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(180,83,9,1)
                              FillPortions: =1
                              LayoutMinWidth: =120
                              OnSelect: |-
                                =Set(varPlannerContextMode,"Block");
                                Set(varPlannerDraftDate,If(Year(varPlannerFocusedDate)=varPlannerYear,varPlannerFocusedDate,Date(varPlannerYear,1,4)));
                                Set(varPlannerOverrideReason,"");
                                Set(varPlannerDraftDirty,true);
                                Reset(datPlannerBlockDate);
                                Reset(inpPlannerBlockReason)
                              Text: ="Block day"
                        - btnPlannerBoardRules:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Open Board rules"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =RGBA(30,64,175,1)
                              FillPortions: =1
                              LayoutMinWidth: =110
                              OnSelect: =Navigate(BoardRulesReview,ScreenTransition.None)
                              Text: ="Board rules"
            - conPlannerWorkspace:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(App.Width<1180,1600,980)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width<1180,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conPlannerCalendar:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(203,213,225,1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255,255,255,1)
                        Height: =If(App.Width<1180,960,Parent.Height)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                      Children:
                        - conPlannerCalendarHeading:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - btnPlannerPrevious:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(varPlannerView="Month","Previous month",varPlannerView="Week","Previous week","Previous year")
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =RGBA(37,99,235,1)
                                    Height: =40
                                    LayoutMinWidth: =44
                                    OnSelect: |-
                                      =If(
                                        varPlannerView="Month",
                                        Set(varPlannerFocusedDate,DateAdd(varPlannerFocusedDate,-1,TimeUnit.Months));Set(varPlannerYear,Year(varPlannerFocusedDate)),
                                        varPlannerView="Week",
                                        Set(varPlannerFocusedDate,DateAdd(varPlannerFocusedDate,-7,TimeUnit.Days));Set(varPlannerYear,Year(varPlannerFocusedDate)),
                                        Set(varPlannerYear,Max(2026,varPlannerYear-1));Set(varPlannerFocusedDate,Date(varPlannerYear,1,1))
                                      )
                                    Text: ="‹"
                                    Width: =44
                              - txtPlannerRange:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Center
                                    Color: =RGBA(15,23,42,1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =40
                                    LayoutMinWidth: =0
                                    Size: =20
                                    Text: =If(varPlannerView="Year",Text(varPlannerYear),varPlannerView="Month",Text(varPlannerFocusedDate,"mmmm yyyy"),Text(DateAdd(varPlannerFocusedDate,1-Weekday(varPlannerFocusedDate,StartOfWeek.Monday),TimeUnit.Days),"mmm d") & " – " & Text(DateAdd(varPlannerFocusedDate,7-Weekday(varPlannerFocusedDate,StartOfWeek.Monday),TimeUnit.Days),"mmm d, yyyy"))
                                    Wrap: =false
                              - btnPlannerNext:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(varPlannerView="Month","Next month",varPlannerView="Week","Next week","Next year")
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =RGBA(37,99,235,1)
                                    Height: =40
                                    LayoutMinWidth: =44
                                    OnSelect: |-
                                      =If(
                                        varPlannerView="Month",
                                        Set(varPlannerFocusedDate,DateAdd(varPlannerFocusedDate,1,TimeUnit.Months));Set(varPlannerYear,Year(varPlannerFocusedDate)),
                                        varPlannerView="Week",
                                        Set(varPlannerFocusedDate,DateAdd(varPlannerFocusedDate,7,TimeUnit.Days));Set(varPlannerYear,Year(varPlannerFocusedDate)),
                                        Set(varPlannerYear,Min(2036,varPlannerYear+1));Set(varPlannerFocusedDate,Date(varPlannerYear,1,1))
                                      )
                                    Text: ="›"
                                    Width: =44
                        - galPlannerYearMonths:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Twelve month calendar for " & Text(varPlannerYear)
                              DelayItemLoading: =false
                              Fill: =RGBA(248,250,252,1)
                              Items: =AddColumns(Sequence(12),MonthNumber,Value,MonthName,Text(Date(varPlannerYear,Value,1),"mmmm"),MonthStart,Date(varPlannerYear,Value,1))
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LoadingSpinner: =LoadingSpinner.None
                              Selectable: =false
                              TabIndex: =0
                              TemplatePadding: =4
                              TemplateSize: =280
                              Visible: =varPlannerView="Year"
                              WrapCount: =If(App.Width>=1500,3,If(App.Width>=900,2,1))
                            Children:
                              - conPlannerYearMonth:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(203,213,225,1)
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255,255,255,1)
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =3
                                    PaddingBottom: =6
                                    PaddingLeft: =6
                                    PaddingRight: =6
                                    PaddingTop: =6
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - txtPlannerYearMonthName:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =ThisItem.MonthName & " " & Text(varPlannerYear)
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(15,23,42,1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          LayoutMinWidth: =0
                                          Size: =14
                                          Text: =ThisItem.MonthName
                                          Wrap: =false
                                    - txtPlannerYearWeekdays:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: ="Sunday through Saturday"
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(100,116,139,1)
                                          Font: =Font.'Segoe UI'
                                          Height: =18
                                          LayoutMinWidth: =0
                                          Size: =10
                                          Text: ="S          M          T          W          T          F          S"
                                          Wrap: =false
                                    - galPlannerYearDays:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: =ThisItem.MonthName & " date grid"
                                          DelayItemLoading: =false
                                          Items: |-
                                            =With(
                                              {monthStart:ThisItem.MonthStart},
                                              AddColumns(
                                                Sequence(42),
                                                CellDate,DateAdd(monthStart,Value-Weekday(monthStart,StartOfWeek.Sunday),TimeUnit.Days),
                                                IsCurrentMonth,Month(DateAdd(monthStart,Value-Weekday(monthStart,StartOfWeek.Sunday),TimeUnit.Days))=Month(monthStart)
                                              )
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          LoadingSpinner: =LoadingSpinner.None
                                          Selectable: =false
                                          ShowScrollbar: =false
                                          TabIndex: =0
                                          TemplatePadding: =0
                                          TemplateSize: =37
                                          WrapCount: =7
                                        Children:
                                          - conPlannerYearDay:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =RGBA(226,232,240,1)
                                                BorderThickness: =1
                                                DropShadow: =DropShadow.None
                                                Fill: =If(!ThisItem.IsCurrentMonth,RGBA(248,250,252,1),CountIf(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive)>0,RGBA(254,242,242,1),RGBA(255,255,255,1))
                                                Height: =Parent.TemplateHeight
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                PaddingBottom: =1
                                                PaddingLeft: =1
                                                PaddingRight: =1
                                                PaddingTop: =1
                                                Width: =Parent.TemplateWidth
                                              Children:
                                                - txtPlannerYearDayNumber:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Text(ThisItem.CellDate,"dddd, mmmm d, yyyy")
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Color: =If(ThisItem.IsCurrentMonth,RGBA(71,85,105,1),RGBA(148,163,184,1))
                                                      Font: =Font.'Segoe UI'
                                                      Height: =13
                                                      LayoutMinWidth: =0
                                                      Size: =8
                                                      Text: =Text(Day(ThisItem.CellDate))
                                                      Wrap: =false
                                                - btnPlannerYearClosure:
                                                    Control: ModernButton
                                                    Properties:
                                                      AccessibleLabel: =LookUp(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive,ClosureName)
                                                      Appearance: =ButtonAppearance.Subtle
                                                      BasePaletteColor: =RGBA(185,28,28,1)
                                                      Height: =10
                                                      LayoutMinWidth: =0
                                                      OnSelect: |-
                                                        =Set(varPlannerSelectedClosureId,LookUp(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive,ClosureId));
                                                        Set(varPlannerFocusedDate,ThisItem.CellDate);
                                                        Set(varPlannerContextMode,"Closure")
                                                      Text: =Left(LookUp(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive,ClosureLabel),8)
                                                      Visible: =ThisItem.IsCurrentMonth && CountIf(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive)>0
                                                - btnPlannerYearEvent:
                                                    Control: ModernButton
                                                    Properties:
                                                      AccessibleLabel: =LookUp(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && ((PlanningLayer="Board" && varPlannerShowBoard)||(PlanningLayer="Board Committees" && varPlannerShowCommittees)||(PlanningLayer="Executive Leadership" && varPlannerShowExecutive)||(PlanningLayer="Organization & Operations" && varPlannerShowOperations)),EventName)
                                                      BasePaletteColor: =RGBA(30,64,175,1)
                                                      Height: =11
                                                      LayoutMinWidth: =0
                                                      OnSelect: |-
                                                        =Set(varPlannerSelectedEventId,LookUp(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && ((PlanningLayer="Board" && varPlannerShowBoard)||(PlanningLayer="Board Committees" && varPlannerShowCommittees)||(PlanningLayer="Executive Leadership" && varPlannerShowExecutive)||(PlanningLayer="Organization & Operations" && varPlannerShowOperations)),EventId));
                                                        Set(varPlannerFocusedDate,ThisItem.CellDate);
                                                        Set(varPlannerContextMode,"Summary")
                                                      Text: =Left(LookUp(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && ((PlanningLayer="Board" && varPlannerShowBoard)||(PlanningLayer="Board Committees" && varPlannerShowCommittees)||(PlanningLayer="Executive Leadership" && varPlannerShowExecutive)||(PlanningLayer="Organization & Operations" && varPlannerShowOperations)),ChipText),7)
                                                      Visible: =ThisItem.IsCurrentMonth && CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && ((PlanningLayer="Board" && varPlannerShowBoard)||(PlanningLayer="Board Committees" && varPlannerShowCommittees)||(PlanningLayer="Executive Leadership" && varPlannerShowExecutive)||(PlanningLayer="Organization & Operations" && varPlannerShowOperations)))>0
                                                - txtPlannerYearMore:
                                                    Control: ModernText
                                                    Properties:
                                                      AccessibleLabel: =Self.Text
                                                      Align: =Align.Center
                                                      Color: =RGBA(71,85,105,1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =10
                                                      LayoutMinWidth: =0
                                                      Size: =7
                                                      Text: ="+" & Text(CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && ((PlanningLayer="Board" && varPlannerShowBoard)||(PlanningLayer="Board Committees" && varPlannerShowCommittees)||(PlanningLayer="Executive Leadership" && varPlannerShowExecutive)||(PlanningLayer="Organization & Operations" && varPlannerShowOperations)))-1)
                                                      Visible: =ThisItem.IsCurrentMonth && CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && ((PlanningLayer="Board" && varPlannerShowBoard)||(PlanningLayer="Board Committees" && varPlannerShowCommittees)||(PlanningLayer="Executive Leadership" && varPlannerShowExecutive)||(PlanningLayer="Organization & Operations" && varPlannerShowOperations)))>1
                                                      Wrap: =false
                  - conPlannerContext:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(203,213,225,1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.Semilight
                        Fill: =RGBA(255,255,255,1)
                        FillPortions: =0
                        Height: =If(App.Width<1180,620,Parent.Height)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
