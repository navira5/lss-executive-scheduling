                              Width: =If(App.Width<1100,Parent.Width,720)
                            Children:
                              - btnPlannerPreviewBoardDraft:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Preview or regenerate " & varPlannerActiveLayer
                                    BasePaletteColor: =RGBA(37,99,235,1)
                                    DisplayMode: =With({activeState:LookUp(colPlannerLayerState,PlanningLayer=varPlannerActiveLayer)},If(activeState.Status="Confirmed" || CountIf(colMeetingRulebook,PlanningLayer=varPlannerActiveLayer && RuleStatus<>"Confirmed")>0 || (activeState.StepNumber>1 && LookUp(colPlannerLayerState,StepNumber=activeState.StepNumber-1,Status)<>"Confirmed"),DisplayMode.Disabled,DisplayMode.Edit))
                                    FillPortions: =1
                                    Height: =44
                                    LayoutMinWidth: =150
                                    OnSelect: |-
                                      =With(
                                        {activeState:LookUp(colPlannerLayerState,PlanningLayer=varPlannerActiveLayer)},
                                        If(
                                          CountIf(colMeetingRulebook,PlanningLayer=varPlannerActiveLayer && RuleStatus<>"Confirmed")=0 &&
                                          (activeState.StepNumber=1 || LookUp(colPlannerLayerState,StepNumber=activeState.StepNumber-1,Status)="Confirmed"),
                                        Clear(colPlannerLayerPreview);
                                        Clear(colPlannerLayerPreviewBlocked);
                                        If(
                                          varPlannerYear=2027 && varPlannerActiveLayer<>"Board" && activeState.Status="Not started" && CountIf(colPlannerLayerBuildReceipt,PlanningLayer=varPlannerActiveLayer)=0,
                                          ForAll(
                                            Filter(colPlannerLayerRuleEvents,PlanYear=2027 && PlanningLayer=varPlannerActiveLayer) As baselineEvent,
                                            Collect(colPlannerLayerPreview,baselineEvent)
                                          ),
                                        ForAll(
                                          SortByColumns(Filter(colMeetingRulebook,PlanningLayer=varPlannerActiveLayer && RuleStatus="Confirmed"),"SortOrder",SortOrder.Ascending) As layerRule,
                                          With(
                                            {
                                              startMonthNumber:Switch(layerRule.StartMonth,"January",1,"February",2,"March",3,"April",4,"May",5,"June",6,"July",7,"August",8,"September",9,"October",10,"November",11,"December",12,1),
                                              anchorMonthNumber:Switch(layerRule.AnchorMonth,"January",1,"February",2,"March",3,"April",4,"May",5,"June",6,"July",7,"August",8,"September",9,"October",10,"November",11,"December",12,1),
                                              preferredDayNumber:Switch(layerRule.PreferredDay,"Monday",1,"Tuesday",2,"Wednesday",3,"Thursday",4,"Friday",5,"Saturday",6,"Sunday",7,1),
                                              secondDayNumber:Switch(layerRule.SecondPreferredDay,"Monday",1,"Tuesday",2,"Wednesday",3,"Thursday",4,"Friday",5,"Saturday",6,"Sunday",7,1),
                                              daysInYear:DateDiff(Date(varPlannerYear,1,1),Date(varPlannerYear+1,1,1),TimeUnit.Days)
                                            },
                                            With(
                                              {anchorDate:Date(varPlannerYear,anchorMonthNumber,layerRule.AnchorDay)},
                                              ForAll(
                                                Filter(
                                                  AddColumns(Sequence(daysInYear),CandidateDate,DateAdd(Date(varPlannerYear,1,1),Value-1,TimeUnit.Days)),
                                                  Switch(
                                                    layerRule.Cadence,
                                                    "One time",CandidateDate=anchorDate,
                                                    "Twice a week",Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber || Weekday(CandidateDate,StartOfWeek.Monday)=secondDayNumber,
                                                    "Weekly",Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber,
                                                    "Every two weeks",CandidateDate>=anchorDate && Mod(DateDiff(anchorDate,CandidateDate,TimeUnit.Days),14)=0,
                                                    "Twice a month",Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && (Switch(layerRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false) || Switch(layerRule.SecondWeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false)),
                                                    "Monthly",Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(layerRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                    "Every two months",Month(CandidateDate)>=startMonthNumber && Mod(Month(CandidateDate)-startMonthNumber,2)=0 && Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(layerRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                    "Quarterly",Month(CandidateDate)>=startMonthNumber && Mod(Month(CandidateDate)-startMonthNumber,3)=0 && Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(layerRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                    "Specific months",Text(CandidateDate,"mmmm") in layerRule.MonthsText && Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(layerRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                    "Annually",Month(CandidateDate)=startMonthNumber && Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(layerRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                    false
                                                  )
                                                ) As generatedDay,
                                                With(
                                                  {
                                                    originalDate:generatedDay.CandidateDate,
