                                    Size: =12
                                    Text: =Upper(LookUp(colCalProofClosures,ClosureId=varPlannerSelectedClosureId,ClosureType))
                                    Wrap: =false
                              - txtPlannerClosureTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(15,23,42,1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =62
                                    LayoutMinWidth: =0
                                    Size: =24
