Screens:
  CalendarPlanner:
    Properties:
      Fill: =RGBA(244,247,251,1)
      LoadingSpinnerColor: =RGBA(37,99,235,1)
    Children:
      - conPlannerRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(244,247,251,1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - conPlannerHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<900,188,92)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width<900,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =14
                  PaddingLeft: =18
                  PaddingRight: =18
                  PaddingTop: =14
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                Children:
                  - conPlannerTitle:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtPlannerTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Calendar Planner for " & Text(varPlannerYear)
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(15,23,42,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              LayoutMinWidth: =0
                              Size: =26
                              Text: ="Calendar Planner " & Text(varPlannerYear)
                              Wrap: =false
                        - txtPlannerSubtitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              Height: =20
                              LayoutMinWidth: =0
                              Size: =12
                              Text: ="Local planning workspace · no Outlook actions · one shared calendar state"
                              Wrap: =false
                  - conPlannerYearAndViews:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(App.Width<900,Parent.Width,590)
                      Children:
                        - drpPlannerYear:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: ="Plan year"
                              Default: ={Value:varPlannerYear-2025,PlanYear:varPlannerYear}
                              Height: =44
                              ItemDisplayText: =ThisItem.PlanYear
                              Items: =AddColumns(Sequence(11),PlanYear,Value+2025)
                              LayoutMinWidth: =110
                              OnChange: |-
                                =Set(varPlannerYear,Self.Selected.PlanYear);
                                Set(varPlannerFocusedDate,Date(varPlannerYear,1,1));
                                Set(varPlannerSelectedEventId,"");
                                Set(varPlannerSelectedClosureId,"");
                                If(!varPlannerDraftDirty,Set(varPlannerContextMode,"Empty"))
                              Width: =120
                        - btnPlannerYearView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show year view"
                              Appearance: =If(varPlannerView="Year",ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(37,99,235,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =90
                              OnSelect: =Set(varPlannerView,"Year")
                              Text: ="Year"
                        - btnPlannerMonthView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show month view"
                              Appearance: =If(varPlannerView="Month",ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(37,99,235,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =90
                              OnSelect: =Set(varPlannerView,"Month");Navigate(CalendarPlannerMonth,ScreenTransition.None)
                              Text: ="Month"
                        - btnPlannerWeekView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show week view"
                              Appearance: =If(varPlannerView="Week",ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(37,99,235,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =90
                              OnSelect: =Set(varPlannerView,"Week");Navigate(CalendarPlannerWeek,ScreenTransition.None)
                              Text: ="Week"
            - conPlannerToolbar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<1100,160,72)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width<1100,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =10
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - conPlannerFilters:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnPlannerFilterBoard:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =If(varPlannerShowBoard,"Hide Board meetings","Show Board meetings")
                              Appearance: =If(varPlannerShowBoard,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(30,64,175,1)
                              FillPortions: =1
                              LayoutMinWidth: =90
                              OnSelect: |-
                                =ForAll(
                                  Filter(colPlannerLayerRuleEvents,PlanYear=varPlannerYear && PlanningLayer="Board") As generatedMeeting,
                                  With(
                                    {generatedId:generatedMeeting.EventId},
                                    If(
                                      IsBlank(LookUp(colCalProofEvents,EventId=generatedId)) && IsBlank(LookUp(colPlannerExclusions,EventId=generatedId)),
                                      Collect(colCalProofEvents,generatedMeeting)
                                    )
                                  )
                                );
                                Set(varPlannerShowBoard,!varPlannerShowBoard)
                              Text: ="Board"
                        - btnPlannerFilterCommittees:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =If(varPlannerShowCommittees,"Hide Board Committees","Show Board Committees")
                              Appearance: =If(varPlannerShowCommittees,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(14,116,144,1)
                              FillPortions: =1
                              LayoutMinWidth: =118
                              OnSelect: |-
                                =ForAll(
                                  Filter(colPlannerLayerRuleEvents,PlanYear=varPlannerYear && PlanningLayer="Board Committees") As generatedMeeting,
                                  With(
                                    {generatedId:generatedMeeting.EventId},
                                    If(
                                      IsBlank(LookUp(colCalProofEvents,EventId=generatedId)) && IsBlank(LookUp(colPlannerExclusions,EventId=generatedId)),
                                      Collect(colCalProofEvents,generatedMeeting)
                                    )
                                  )
                                );
                                Set(varPlannerShowCommittees,!varPlannerShowCommittees)
                              Text: ="Committees"
                        - btnPlannerFilterExecutive:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =If(varPlannerShowExecutive,"Hide Executive Leadership","Show Executive Leadership")
                              Appearance: =If(varPlannerShowExecutive,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(124,58,237,1)
                              FillPortions: =1
                              LayoutMinWidth: =110
                              OnSelect: |-
                                =ForAll(
                                  Filter(colPlannerLayerRuleEvents,PlanYear=varPlannerYear && PlanningLayer="Executive Leadership") As generatedMeeting,
                                  With(
                                    {generatedId:generatedMeeting.EventId},
                                    If(
                                      IsBlank(LookUp(colCalProofEvents,EventId=generatedId)) && IsBlank(LookUp(colPlannerExclusions,EventId=generatedId)),
                                      Collect(colCalProofEvents,generatedMeeting)
                                    )
                                  )
                                );
                                Set(varPlannerShowExecutive,!varPlannerShowExecutive)
                              Text: ="Executive"
                        - btnPlannerFilterOperations:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =If(varPlannerShowOperations,"Hide Organization and Operations","Show Organization and Operations")
                              Appearance: =If(varPlannerShowOperations,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(5,150,105,1)
                              FillPortions: =1
                              LayoutMinWidth: =110
                              OnSelect: |-
                                =ForAll(
                                  Filter(colPlannerLayerRuleEvents,PlanYear=varPlannerYear && PlanningLayer="Organization & Operations") As generatedMeeting,
                                  With(
                                    {generatedId:generatedMeeting.EventId},
                                    If(
                                      IsBlank(LookUp(colCalProofEvents,EventId=generatedId)) && IsBlank(LookUp(colPlannerExclusions,EventId=generatedId)),
                                      Collect(colCalProofEvents,generatedMeeting)
                                    )
                                  )
                                );
                                Set(varPlannerShowOperations,!varPlannerShowOperations)
                              Text: ="Operations"
                  - conPlannerActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(App.Width<1100,Parent.Width,390)
                      Children:
                        - btnPlannerAddMeeting:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Add a meeting"
                              BasePaletteColor: =RGBA(37,99,235,1)
                              FillPortions: =1
                              LayoutMinWidth: =120
                              OnSelect: |-
                                =Set(varPlannerContextMode,"Add");
                                Set(varPlannerDraftName,"");
                                Set(varPlannerDraftLayer,"Board");
                                Set(varPlannerDraftCategory,"Meeting");
                                Set(varPlannerDraftDate,If(Year(varPlannerFocusedDate)=varPlannerYear,varPlannerFocusedDate,Date(varPlannerYear,1,4)));
                                Set(varPlannerDraftStart,Time(9,0,0));
                                Set(varPlannerDraftDuration,60);
                                Set(varPlannerWarningAcknowledged,false);
                                Set(varPlannerDraftDirty,true);
                                Reset(inpPlannerName);
                                Reset(drpPlannerLayer);
                                Reset(inpPlannerCategory);
                                Reset(datPlannerDate);
                                Reset(drpPlannerStartTime);
                                Reset(numPlannerDuration)
                              Text: ="Add meeting"
                        - btnPlannerBlockDay:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Block a day for all meetings"
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(180,83,9,1)
                              FillPortions: =1
                              LayoutMinWidth: =120
                              OnSelect: |-
                                =Set(varPlannerContextMode,"Block");
                                Set(varPlannerDraftDate,If(Year(varPlannerFocusedDate)=varPlannerYear,varPlannerFocusedDate,Date(varPlannerYear,1,4)));
                                Set(varPlannerOverrideReason,"");
                                Set(varPlannerDraftDirty,true);
                                Reset(datPlannerBlockDate);
                                Reset(inpPlannerBlockReason)
                              Text: ="Block day"
                        - btnPlannerBoardRules:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Open Board rules"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =RGBA(30,64,175,1)
                              FillPortions: =1
                              LayoutMinWidth: =110
                              OnSelect: =Navigate(BoardRulesReview,ScreenTransition.None)
                              Text: ="Board rules"
            - conPlannerBoardWorkflow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =If(varCalProofBoardConfirmed,RGBA(134,239,172,1),If(varCalProofDraftNeedsRegeneration,RGBA(245,158,11,1),RGBA(191,219,254,1)))
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =If(varCalProofBoardConfirmed,RGBA(240,253,244,1),If(varCalProofDraftNeedsRegeneration,RGBA(255,251,235,1),RGBA(239,246,255,1)))
                  FillPortions: =0
                  Height: =If(varPlannerShowBoardRegenPreview,If(App.Width<1100,420,252),If(App.Width<1100,230,126))
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =14
                  PaddingRight: =14
                  PaddingTop: =12
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - conPlannerBoardWorkflowSummary:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(App.Width<1100,190,88)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(App.Width<1100,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - conPlannerBoardWorkflowCopy:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - txtPlannerBoardWorkflowTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(15,43,91,1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    LayoutMinWidth: =0
                                    Size: =17
                                    Text: =If(varCalProofBoardConfirmed,"✓ Board confirmed",If(varCalProofDraftNeedsRegeneration,"Board rules changed — regeneration required","Board planning"))
                                    Wrap: =false
                              - txtPlannerBoardWorkflowStatus:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(51,65,85,1)
                                    Font: =Font.'Segoe UI'
                                    Height: =54
                                    LayoutMinWidth: =0
                                    Size: =12
                                    Text: |-
                                      =With(
                                        {
                                          unresolvedRules:CountIf(colMeetingRulebook,PlanningLayer="Board" && RuleStatus<>"Confirmed"),
                                          boardDates:CountIf(colCalProofEvents,PlanYear=varPlannerYear && PlanningLayer="Board" && SourceType="Generated"),
                                          reviewDates:CountIf(colCalProofEvents,PlanYear=varPlannerYear && PlanningLayer="Board" && DecisionStatus="NeedsReview")
                                        },
                                        If(
                                          varCalProofBoardConfirmed,
                                          Text(boardDates) & " Board dates are locked locally. No Outlook changes were made.",
                                          unresolvedRules>0,
                                          Text(unresolvedRules) & " Board rule" & If(unresolvedRules=1," needs","s need") & " confirmation before the draft can be built.",
                                          varCalProofDraftNeedsRegeneration,
                                          "Preview and apply the changed rules. Manual meetings, approved moves, and exclusions will be preserved.",
                                          CountRows(colCalProofGenerationReceipt)=0,
                                          "All Board rules are ready. Preview the generated dates before applying the draft.",
                                          reviewDates>0,
                                          Text(reviewDates) & " proposed date change" & If(reviewDates=1," needs","s need") & " approval before Board can be confirmed.",
                                          Text(boardDates) & " Board dates are ready for confirmation."
                                        )
                                      )
                                    VerticalAlign: =VerticalAlign.Top
                        - conPlannerBoardWorkflowActions:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =If(App.Width<1100,Parent.Width,430)
                            Children:
                              - btnPlannerPreviewBoardDraft:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =If(CountRows(colCalProofGenerationReceipt)=0,"Preview Board draft","Preview Board regeneration")
                                    BasePaletteColor: =RGBA(37,99,235,1)
                                    DisplayMode: =If(varCalProofBoardConfirmed || CountIf(colMeetingRulebook,PlanningLayer="Board" && RuleStatus<>"Confirmed")>0,DisplayMode.Disabled,DisplayMode.Edit)
                                    FillPortions: =1
                                    Height: =44
                                    LayoutMinWidth: =150
                                    OnSelect: |-
                                      =If(
                                        CountIf(colMeetingRulebook,PlanningLayer="Board" && RuleStatus<>"Confirmed")=0,
                                        Clear(colPlannerBoardPreview);
                                        Clear(colPlannerBoardPreviewBlocked);
                                        ForAll(
                                          SortByColumns(Filter(colBoardRuleProof,RuleStatus="Confirmed"),"SortOrder",SortOrder.Ascending) As boardRule,
                                          With(
                                            {
                                              startMonthNumber:Switch(boardRule.StartMonth,"January",1,"February",2,"March",3,"April",4,"May",5,"June",6,"July",7,"August",8,"September",9,"October",10,"November",11,"December",12,1),
                                              anchorMonthNumber:Switch(boardRule.AnchorMonth,"January",1,"February",2,"March",3,"April",4,"May",5,"June",6,"July",7,"August",8,"September",9,"October",10,"November",11,"December",12,1),
                                              preferredDayNumber:Switch(boardRule.PreferredDay,"Monday",1,"Tuesday",2,"Wednesday",3,"Thursday",4,"Friday",5,"Saturday",6,"Sunday",7,1),
                                              secondDayNumber:Switch(boardRule.SecondPreferredDay,"Monday",1,"Tuesday",2,"Wednesday",3,"Thursday",4,"Friday",5,"Saturday",6,"Sunday",7,1),
                                              daysInYear:DateDiff(Date(varPlannerYear,1,1),Date(varPlannerYear+1,1,1),TimeUnit.Days)
                                            },
                                            With(
                                              {anchorDate:Date(varPlannerYear,anchorMonthNumber,boardRule.AnchorDay)},
                                              ForAll(
                                                Filter(
                                                  AddColumns(Sequence(daysInYear),CandidateDate,DateAdd(Date(varPlannerYear,1,1),Value-1,TimeUnit.Days)),
                                                  Switch(
                                                    boardRule.Cadence,
                                                    "One time",CandidateDate=anchorDate,
                                                    "Twice a week",Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber || Weekday(CandidateDate,StartOfWeek.Monday)=secondDayNumber,
                                                    "Weekly",Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber,
                                                    "Every two weeks",CandidateDate>=anchorDate && Mod(DateDiff(anchorDate,CandidateDate,TimeUnit.Days),14)=0,
                                                    "Twice a month",Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && (Switch(boardRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false) || Switch(boardRule.SecondWeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false)),
                                                    "Monthly",Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(boardRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                    "Every two months",Month(CandidateDate)>=startMonthNumber && Mod(Month(CandidateDate)-startMonthNumber,2)=0 && Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(boardRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                    "Quarterly",Month(CandidateDate)>=startMonthNumber && Mod(Month(CandidateDate)-startMonthNumber,3)=0 && Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(boardRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                    "Specific months",Text(CandidateDate,"mmmm") in boardRule.MonthsText && Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(boardRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                    "Annually",Month(CandidateDate)=startMonthNumber && Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(boardRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                    false
                                                  )
                                                ) As generatedDay,
                                                With(
                                                  {
                                                    originalDate:generatedDay.CandidateDate,
                                                    proposedDate:If(IsPlannerHardStop(generatedDay.CandidateDate),GetNextPlannerBusinessDate(generatedDay.CandidateDate,varPlannerYear),generatedDay.CandidateDate),
                                                    closureName:LookUp(colCalProofClosures,ClosureDate=generatedDay.CandidateDate && IsActive,ClosureName)
                                                  },
                                                  If(
                                                    IsBlank(proposedDate),
                                                    Collect(colPlannerBoardPreviewBlocked,{EventId:boardRule.RuleId&"-"&Text(originalDate,"yyyymmdd"),EventName:boardRule.MeetingName,EventType:boardRule.MeetingName,EventDate:originalDate,GeneratedDate:originalDate,OriginalGeneratedDate:originalDate,CurrentDate:Blank(),AutoAdjusted:true,AdjustmentReason:"No valid business date found",AdjustmentSourceName:Coalesce(closureName,"Protected date"),DecisionStatus:"Blocked",StartTime:TimeValue(boardRule.StartTimeText),EndTime:DateAdd(TimeValue(boardRule.StartTimeText),boardRule.DurationMinutes,TimeUnit.Minutes),ChipText:Switch(boardRule.RuleId,"BOARD-FULL","BOARD","BOARD-CHECKIN","CHECK","BOARD-RETREAT","RETREAT","BOARD"),SchedulingSource:"Generated from "&boardRule.MeetingName&" rule",SourceRuleId:boardRule.RuleId,IsManualOverride:false,PlanYear:varPlannerYear,PlanningLayer:"Board",SourceType:"Generated",Category:"Board",DurationMinutes:boardRule.DurationMinutes,IsDeleted:false,WarningAcknowledged:false}),
                                                    Collect(colPlannerBoardPreview,{EventId:boardRule.RuleId&"-"&Text(originalDate,"yyyymmdd"),EventName:boardRule.MeetingName,EventType:boardRule.MeetingName,EventDate:proposedDate,GeneratedDate:originalDate,OriginalGeneratedDate:originalDate,CurrentDate:proposedDate,AutoAdjusted:proposedDate<>originalDate,AdjustmentReason:If(proposedDate<>originalDate,"Holiday/Closure",""),AdjustmentSourceName:If(proposedDate<>originalDate,Coalesce(closureName,If(Weekday(originalDate,StartOfWeek.Monday)>5,"Weekend","Protected date")),""),DecisionStatus:If(proposedDate<>originalDate,"NeedsReview","Ready"),StartTime:TimeValue(boardRule.StartTimeText),EndTime:DateAdd(TimeValue(boardRule.StartTimeText),boardRule.DurationMinutes,TimeUnit.Minutes),ChipText:Switch(boardRule.RuleId,"BOARD-FULL","BOARD","BOARD-CHECKIN","CHECK","BOARD-RETREAT","RETREAT","BOARD"),SchedulingSource:"Generated from "&boardRule.MeetingName&" rule · "&boardRule.Cadence,SourceRuleId:boardRule.RuleId,IsManualOverride:false,PlanYear:varPlannerYear,PlanningLayer:"Board",SourceType:"Generated",Category:"Board",DurationMinutes:boardRule.DurationMinutes,IsDeleted:false,WarningAcknowledged:false})
                                                  )
                                                )
                                              )
                                            )
                                          )
                                        );
                                        ForAll(
                                          Filter(colCalProofEvents,PlanYear=varPlannerYear && PlanningLayer="Board" && SourceType="Generated" && IsManualOverride) As savedOverride,
                                          With(
