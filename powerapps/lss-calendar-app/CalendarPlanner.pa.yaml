                              - txtPlannerClosureTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(15,23,42,1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =62
                                    LayoutMinWidth: =0
                                    Size: =24
                                    Text: =LookUp(colCalProofClosures,ClosureId=varPlannerSelectedClosureId,ClosureName)
                              - txtPlannerClosureDate:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(15,23,42,1)
                                    Font: =Font.'Segoe UI'
                                    Height: =28
                                    LayoutMinWidth: =0
                                    Text: =Text(LookUp(colCalProofClosures,ClosureId=varPlannerSelectedClosureId,ClosureDate),"dddd, mmmm d, yyyy")
