                              RadiusTopRight: =8
                              Visible: =!IsBlank(varPlannerReceipt)
                            Children:
                              - txtPlannerReceipt:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(21,128,61,1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    Height: =80
                                    LayoutMinWidth: =0
                                    Size: =12
                                    Text: ="✓ " & varPlannerReceipt
                                    VerticalAlign: =VerticalAlign.Top
                              - btnPlannerUndo:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Undo last change"
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(30,64,175,1)
                                    DisplayMode: =If(CountRows(colPlannerUndo)=0,DisplayMode.Disabled,DisplayMode.Edit)
                                    Height: =40
                                    OnSelect: |-
                                      =With(
                                        {undoRow:First(colPlannerUndo)},
                                        If(
                                          undoRow.Action="Add",
                                          RemoveIf(colCalProofEvents,EventId=undoRow.SubjectId);Set(varPlannerReceipt,"Added meeting removed."),
                                          undoRow.Action="Move",
                                          If(IsPlannerHardStop(undoRow.PreviousDate),Set(varPlannerReceipt,"Undo needs confirmation because the previous date is now a hard stop."),Patch(colCalProofEvents,LookUp(colCalProofEvents,EventId=undoRow.SubjectId),{EventDate:undoRow.PreviousDate,CurrentDate:undoRow.PreviousDate,StartTime:undoRow.PreviousStart,EndTime:undoRow.PreviousEnd,DecisionStatus:undoRow.PreviousStatus});Set(varPlannerReceipt,"Move undone; previous placement restored.")),
                                          undoRow.Action="Delete",
                                          If(IsPlannerHardStop(undoRow.PreviousDate),Set(varPlannerReceipt,"Undo needs confirmation because the deleted meeting's previous date is now a hard stop."),Collect(colCalProofEvents,undoRow.SnapshotEvent);RemoveIf(colPlannerExclusions,EventId=undoRow.SubjectId);Set(varPlannerReceipt,"Deleted meeting restored.")),
                                          undoRow.Action="Block",
                                          Patch(colCalProofClosures,LookUp(colCalProofClosures,ClosureId=undoRow.SubjectId),{IsActive:false,ChangedAt:Now()});Set(varPlannerReceipt,"Block removed. Adjusted meetings remain in their proposed positions for review."),
                                          undoRow.Action="Deactivate closure",
                                          Patch(colCalProofClosures,LookUp(colCalProofClosures,ClosureId=undoRow.SubjectId),{IsActive:true,OverrideReason:undoRow.SnapshotClosure.OverrideReason,ChangedAt:Now()});Set(varPlannerReceipt,"Hard-stop date restored. Adjusted meetings remain unchanged.")
                                        )
                                      );
                                      Clear(colPlannerUndo)
                                    Text: ="Undo"
