                                    Font: =Font.'Segoe UI'
                                    Height: =82
                                    LayoutMinWidth: =0
                                    PaddingLeft: =10
                                    Size: =12
                                    Text: |-
                                      =If(CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventId<>varPlannerSelectedEventId && EventDate=varPlannerDraftDate && StartTime<Time(0,0,0)+Time(0,varPlannerDraftDuration,0)+varPlannerDraftStart && EndTime>varPlannerDraftStart)>0,"Warning: this overlaps another planned meeting.","Warning: this move differs from the generated cadence.")
                                    Visible: =!IsPlannerHardStop(varPlannerDraftDate) && (CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventId<>varPlannerSelectedEventId && EventDate=varPlannerDraftDate && StartTime<Time(0,0,0)+Time(0,varPlannerDraftDuration,0)+varPlannerDraftStart && EndTime>varPlannerDraftStart)>0 || (varPlannerContextMode="Move" && LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,SourceType)="Generated" && varPlannerDraftDate<>LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventDate)))
