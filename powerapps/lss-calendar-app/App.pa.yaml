App:
  Properties:
    Formulas: |-
      =IsCalProofHardStop(dateToCheck: Date): Boolean =
        Weekday(dateToCheck,StartOfWeek.Monday)>5 ||
        CountIf(colCalProofClosures,ClosureDate=dateToCheck)>0 ||
        CountIf(colCalProofHardStops,HardStopDate=dateToCheck)>0;

      GetNextCalProofBusinessDate(candidateDate: Date): Date =
        If(
          candidateDate>Date(2027,12,31),
          Blank(),
          With(
            {
              validDates:Filter(
                AddColumns(
                  Sequence(DateDiff(candidateDate,Date(2027,12,31),TimeUnit.Days)+1),
                  CandidateBusinessDate,
                  DateAdd(candidateDate,Value-1,TimeUnit.Days)
                ),
                !IsCalProofHardStop(CandidateBusinessDate)
              )
            },
            If(CountRows(validDates)=0,Blank(),First(validDates).CandidateBusinessDate)
          )
        );

      IsPlannerHardStop(dateToCheck: Date): Boolean =
        Weekday(dateToCheck,StartOfWeek.Monday)>5 ||
        CountIf(colCalProofClosures,ClosureDate=dateToCheck && IsActive)>0;

      GetNextPlannerBusinessDate(candidateDate: Date,planYear: Number): Date =
        With(
          {
            validDates:Filter(
              AddColumns(
                Sequence(31),
                CandidateBusinessDate,
                DateAdd(candidateDate,Value,TimeUnit.Days)
              ),
              Year(CandidateBusinessDate)=planYear && !IsPlannerHardStop(CandidateBusinessDate)
            )
          },
          If(CountRows(validDates)=0,Blank(),First(validDates).CandidateBusinessDate)
        );
