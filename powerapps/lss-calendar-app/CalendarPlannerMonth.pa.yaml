                                                Height: =20
                                                OnSelect: =Set(varPlannerSelectedEventId,ThisItem.EventId);Set(varPlannerFocusedDate,ThisItem.EventDate);Set(varPlannerReceipt,"");Set(varPlannerContextMode,"Summary")
                                                Text: =If(ThisItem.AutoAdjusted && ThisItem.DecisionStatus="NeedsReview","! ","") & Text(ThisItem.StartTime,"h:mm") & " " & ThisItem.ChipText & If(ThisItem.AutoAdjusted && ThisItem.DecisionStatus<>"NeedsReview"," ·","")
