                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Text(ThisItem.CellDate,"dddd, mmmm d, yyyy")
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =If(ThisItem.IsCurrentMonth,RGBA(15,23,42,1),RGBA(148,163,184,1))
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          FillPortions: =0
                                          Height: =18
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =10
                                          Text: =Text(Day(ThisItem.CellDate))
                                          Visible: =false
                                          Wrap: =false
                                    - btnPlanMoSelectDate:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Select " & Text(ThisItem.CellDate,"dddd, mmmm d, yyyy")
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =ButtonAppearance.Subtle
                                          BasePaletteColor: =If(ThisItem.IsCurrentMonth,RGBA(37,99,235,1),RGBA(148,163,184,1))
                                          FillPortions: =0
                                          Height: =24
                                          LayoutMinWidth: =0
                                          OnSelect: =Set(varPlannerFocusedDate,ThisItem.CellDate);Set(varPlannerSelectedEventId,Blank());Set(varPlannerSelectedClosureId,Blank());Set(varPlannerReceipt,"");Set(varPlannerContextMode,"Date")
                                          Text: =Text(Day(ThisItem.CellDate))
                                    - btnPlannerMonthCellClosure:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =LookUp(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive,ClosureName)
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =ButtonAppearance.Subtle
                                          BasePaletteColor: =RGBA(185,28,28,1)
                                          FillPortions: =0
                                          Height: =22
                                          LayoutMinWidth: =0
