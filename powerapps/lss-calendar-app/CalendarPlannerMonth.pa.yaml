                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Month calendar for " & Text(varPlannerFocusedDate,"mmmm yyyy")
                              AlignInContainer: =AlignInContainer.Stretch
                              DelayItemLoading: =false
                              FillPortions: =1
                              Items: |-
                                =With(
                                  {monthStart:Date(Year(varPlannerFocusedDate),Month(varPlannerFocusedDate),1)},
                                  AddColumns(Sequence(42),CellDate,DateAdd(monthStart,Value-Weekday(monthStart,StartOfWeek.Sunday),TimeUnit.Days),IsCurrentMonth,Month(DateAdd(monthStart,Value-Weekday(monthStart,StartOfWeek.Sunday),TimeUnit.Days))=Month(monthStart))
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LoadingSpinner: =LoadingSpinner.None
                              Selectable: =false
                              ShowScrollbar: =false
                              TabIndex: =0
                              TemplatePadding: =2
                              TemplateSize: =118
                              WrapCount: =7
