                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: =ThisItem.EventName & ", " & Text(ThisItem.EventDate,"dddd, mmmm d, yyyy") & " at " & Text(ThisItem.StartTime,"h:mm AM/PM") & ", " & If(ThisItem.SourceType="Manual","one-time or special event",ThisItem.PlanningLayer) & If(ThisItem.AutoAdjusted,", moved from " & Text(ThisItem.OriginalGeneratedDate,"mmmm d") & " because " & ThisItem.AdjustmentReason & ", " & If(ThisItem.DecisionStatus="NeedsReview","approval required","adjustment approved"),"")
