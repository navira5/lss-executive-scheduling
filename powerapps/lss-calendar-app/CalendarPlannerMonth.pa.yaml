                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Meetings on " & Text(ThisItem.CellDate,"mmmm d")
                                          AlignInContainer: =AlignInContainer.Stretch
                                          DelayItemLoading: =false
                                          FillPortions: =1
                                          Items: =SortByColumns(Filter(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && !IsDeleted && ((SourceType="Manual" && varPlannerShowManual)||(SourceType<>"Manual" && ((PlanningLayer="Board" && varPlannerShowBoard)||(PlanningLayer="Board Committees" && varPlannerShowCommittees)||(PlanningLayer="Executive Leadership" && varPlannerShowExecutive)||(PlanningLayer="Organization & Operations" && varPlannerShowOperations))))),"StartTime",SortOrder.Ascending)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          LoadingSpinner: =LoadingSpinner.None
                                          ShowScrollbar: =false
                                          TabIndex: =0
                                          TemplatePadding: =1
                                          TemplateSize: =22
                                        Children:
