                        BasePaletteColor: =RGBA(71,85,105,1)
                        FillPortions: =0
                        Height: =44
                        LayoutMinWidth: =116
                        OnSelect: =Set(varPlannerShowManual,!varPlannerShowManual)
                        Text: ="Special"
                        Width: =122
                  - btnPlanMoShowAll:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Show every planning layer and special event"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =If(varPlannerShowBoard && varPlannerShowCommittees && varPlannerShowExecutive && varPlannerShowOperations && varPlannerShowManual,ButtonAppearance.Primary,ButtonAppearance.Outline)
