Screens:
  Screen2:
    Properties:
      Fill: =RGBA(244,247,251,1)
      LoadingSpinnerColor: =RGBA(37,99,235,1)
      OnVisible: |-
        =ClearCollect(colBoardRules,Filter('LSS Meeting Types',Category.Value="Board"));
        ClearCollect(colBoardEvents,SortByColumns(Filter('LSS Planned Calendar',EventDate>=Date(2027,1,1) && EventDate<Date(2028,1,1) && Category="Board"),"EventDate",SortOrder.Ascending));
        ClearCollect(colClosures,Filter('LSS Planned Calendar',EventDate>=Date(2027,1,1) && EventDate<Date(2028,1,1) && Category="Closure"));
        ClearCollect(colBoardCalendarContext,SortByColumns(Filter('LSS Planned Calendar',EventDate>=Date(2027,1,1) && EventDate<Date(2028,1,1)),"EventDate",SortOrder.Ascending));
        Clear(colBoardIssues);
        Clear(colBoardConfirmReceipt);
        ForAll(Filter(colBoardEvents,Status="Blocked" || Status="Needs Decision"),Collect(colBoardIssues,{IssueType:"Date conflict",EventId:ID,GroupTitle:Title,CurrentDate:EventDate,State:Status,Reason:Coalesce('Planning Notes',"Conflict needs review"),Recommendation:"Keep this candidate date. Review the next open weekday within 14 days; do not move it automatically."}));
        ForAll(Filter(colBoardRules,Coalesce(RuleStatus.Value,"Needs validation")<>"Confirmed" || !Coalesce(Completed,false) || !IsBlank(Coalesce('Questions/Comments',""))),Collect(colBoardIssues,{IssueType:"Unresolved Board rule",EventId:Blank(),GroupTitle:Title,CurrentDate:Blank(),State:Coalesce(RuleStatus.Value,"Needs validation"),Reason:If(!Coalesce(Completed,false),"This Board rule is incomplete.",If(!IsBlank(Coalesce('Questions/Comments',"")),"This Board rule has an open question.","This Board rule has not been confirmed.")),Recommendation:"Return to Board rules and complete or confirm this group before confirming the Board."}));
        Set(varBoardLocked,CountRows(colBoardEvents)>0 && CountRows(Filter(colBoardEvents,Status="Approved" && "Board confirmed and locked: Yes" in Coalesce('Planning Notes',"")))=CountRows(colBoardEvents));
        Set(varSelectedEvent,Blank());
        Set(varBoardYearSelectedIssue,Blank())
    Children:
      - conBoardYearRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(244,247,251,1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowX: =LayoutOverflow.Scroll
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =If(App.Width<640,12,24)
            PaddingRight: =If(App.Width<640,12,24)
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - conBoardYearHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(15,43,91,1)
                  Height: =If(Parent.Width<640,164,88)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(Parent.Width<640,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =14
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =14
                  Width: =Parent.Width
                Children:
                  - conBoardYearHeaderCopy:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtBoardYearTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Board calendar title"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(255,255,255,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =26
                              Text: ="2027 Board calendar"
                              Wrap: =false
                        - txtBoardYearState:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Board calendar state"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(219,234,254,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: =If(varBoardLocked,"Board confirmed and locked — dates remain visible and cannot be changed.","Board draft — review conflicts, then confirm the Board.")
                              Wrap: =false
                  - btnBoardYearRules:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Return to Board rules"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(255,255,255,1)
                        Color: =RGBA(255,255,255,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =150
                        OnSelect: =Navigate(MainScreen1,ScreenTransition.Fade)
                        Size: =14
                        Text: ="Board rules"
                        Tooltip: ="Return to Board rules"
