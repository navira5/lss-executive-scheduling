                                      =If(
                                        CountIf(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive)>0,RGBA(185,28,28,1),
                                        CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && !IsDeleted && AutoAdjusted && DecisionStatus="NeedsReview" && ((SourceType="Manual" && varPlannerShowManual)||(SourceType<>"Manual" && ((PlanningLayer="Board" && varPlannerShowBoard)||(PlanningLayer="Board Committees" && varPlannerShowCommittees)||(PlanningLayer="Executive Leadership" && varPlannerShowExecutive)||(PlanningLayer="Organization & Operations" && varPlannerShowOperations)))))>0,RGBA(217,119,6,1),
                                        DateValue(ThisItem.CellDate)=DateValue(varPlannerFocusedDate),RGBA(37,99,235,1),
                                        RGBA(203,213,225,1)
