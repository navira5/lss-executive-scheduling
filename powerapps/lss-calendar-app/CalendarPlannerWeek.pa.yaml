Screens:
  CalendarPlannerWeek:
    Properties:
      Fill: =RGBA(244,247,251,1)
      LoadingSpinnerColor: =RGBA(37,99,235,1)
      OnVisible: =Set(varPlannerView,"Week")
    Children:
      - conPlannerWeekRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(244,247,251,1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - conPlannerWeekHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =92
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =14
                  PaddingLeft: =18
                  PaddingRight: =18
                  PaddingTop: =14
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                Children:
                  - txtPlannerWeekTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Calendar Planner week view for " & Text(varPlannerYear)
                        Color: =RGBA(15,23,42,1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        LayoutMinWidth: =0
                        Size: =25
                        Text: ="Calendar Planner " & Text(varPlannerYear)
                        Wrap: =false
                  - btnPlannerWeekToYear:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Show year view"
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(37,99,235,1)
                        Height: =44
                        OnSelect: =Set(varPlannerView,"Year");Navigate(CalendarPlanner,ScreenTransition.None)
                        Text: ="Year"
                        Width: =100
                  - btnPlannerWeekToMonth:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Show month view"
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(37,99,235,1)
                        Height: =44
                        OnSelect: =Set(varPlannerView,"Month");Navigate(CalendarPlannerMonth,ScreenTransition.None)
                        Text: ="Month"
                        Width: =100
                  - btnPlannerWeekCurrent:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Week view selected"
                        BasePaletteColor: =RGBA(37,99,235,1)
                        Height: =44
                        Text: ="Week"
                        Width: =100
            - conPlannerWeekToolbar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =66
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =6
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =9
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =9
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - btnPlannerWeekBoard:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(varPlannerShowBoard,"Hide Board","Show Board")
                        Appearance: =If(varPlannerShowBoard,ButtonAppearance.Primary,ButtonAppearance.Outline)
                        BasePaletteColor: =RGBA(30,64,175,1)
                        FillPortions: =1
                        Height: =44
                        OnSelect: |-
                          =ForAll(
                            Filter(colPlannerLayerRuleEvents,PlanYear=varPlannerYear && PlanningLayer="Board") As generatedMeeting,
                            With(
                              {generatedId:generatedMeeting.EventId},
                              If(
                                IsBlank(LookUp(colCalProofEvents,EventId=generatedId)) && IsBlank(LookUp(colPlannerExclusions,EventId=generatedId)),
                                Collect(colCalProofEvents,generatedMeeting)
                              )
                            )
                          );
                          Set(varPlannerShowBoard,!varPlannerShowBoard)
                        Text: ="Board"
                  - btnPlannerWeekCommittees:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(varPlannerShowCommittees,"Hide Committees","Show Committees")
                        Appearance: =If(varPlannerShowCommittees,ButtonAppearance.Primary,ButtonAppearance.Outline)
                        BasePaletteColor: =RGBA(14,116,144,1)
                        FillPortions: =1
                        Height: =44
                        OnSelect: |-
                          =ForAll(
                            Filter(colPlannerLayerRuleEvents,PlanYear=varPlannerYear && PlanningLayer="Board Committees") As generatedMeeting,
                            With(
                              {generatedId:generatedMeeting.EventId},
                              If(
                                IsBlank(LookUp(colCalProofEvents,EventId=generatedId)) && IsBlank(LookUp(colPlannerExclusions,EventId=generatedId)),
                                Collect(colCalProofEvents,generatedMeeting)
                              )
                            )
                          );
                          Set(varPlannerShowCommittees,!varPlannerShowCommittees)
                        Text: ="Committees"
                  - btnPlannerWeekExecutive:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(varPlannerShowExecutive,"Hide Executive","Show Executive")
                        Appearance: =If(varPlannerShowExecutive,ButtonAppearance.Primary,ButtonAppearance.Outline)
                        BasePaletteColor: =RGBA(124,58,237,1)
                        FillPortions: =1
                        Height: =44
                        OnSelect: |-
                          =ForAll(
                            Filter(colPlannerLayerRuleEvents,PlanYear=varPlannerYear && PlanningLayer="Executive Leadership") As generatedMeeting,
                            With(
                              {generatedId:generatedMeeting.EventId},
                              If(
                                IsBlank(LookUp(colCalProofEvents,EventId=generatedId)) && IsBlank(LookUp(colPlannerExclusions,EventId=generatedId)),
                                Collect(colCalProofEvents,generatedMeeting)
                              )
                            )
                          );
                          Set(varPlannerShowExecutive,!varPlannerShowExecutive)
                        Text: ="Executive"
                  - btnPlannerWeekOperations:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(varPlannerShowOperations,"Hide Operations","Show Operations")
                        Appearance: =If(varPlannerShowOperations,ButtonAppearance.Primary,ButtonAppearance.Outline)
                        BasePaletteColor: =RGBA(5,150,105,1)
                        FillPortions: =1
                        Height: =44
                        OnSelect: |-
                          =ForAll(
                            Filter(colPlannerLayerRuleEvents,PlanYear=varPlannerYear && PlanningLayer="Organization & Operations") As generatedMeeting,
                            With(
                              {generatedId:generatedMeeting.EventId},
                              If(
                                IsBlank(LookUp(colCalProofEvents,EventId=generatedId)) && IsBlank(LookUp(colPlannerExclusions,EventId=generatedId)),
                                Collect(colCalProofEvents,generatedMeeting)
                              )
                            )
                          );
                          Set(varPlannerShowOperations,!varPlannerShowOperations)
                        Text: ="Operations"
                  - btnPlannerWeekAdd:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Add a meeting"
                        BasePaletteColor: =RGBA(37,99,235,1)
                        Height: =44
                        OnSelect: |-
                          =Set(varPlannerContextMode,"Add");
                          Set(varPlannerDraftName,"");
                          Set(varPlannerDraftLayer,"Board");
                          Set(varPlannerDraftCategory,"Meeting");
                          Set(varPlannerDraftDate,varPlannerFocusedDate);
                          Set(varPlannerDraftStart,Time(9,0,0));
                          Set(varPlannerDraftDuration,60);
                          Set(varPlannerWarningAcknowledged,false);
                          Set(varPlannerDraftDirty,true);
                          Set(varPlannerView,"Year");
                          Navigate(CalendarPlanner,ScreenTransition.None)
                        Text: ="Add meeting"
                        Width: =125
                  - btnPlannerWeekBlock:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Block a day"
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(180,83,9,1)
                        Height: =44
                        OnSelect: =Set(varPlannerContextMode,"Block");Set(varPlannerDraftDate,varPlannerFocusedDate);Set(varPlannerOverrideReason,"");Set(varPlannerDraftDirty,true);Set(varPlannerView,"Year");Navigate(CalendarPlanner,ScreenTransition.None)
                        Text: ="Block day"
                        Width: =112
            - conPlannerWeekWorkspace:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conPlannerWeekCalendar:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(203,213,225,1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255,255,255,1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                      Children:
                        - conPlannerWeekNav:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - btnPlannerWeekPrevious:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Previous week"
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =RGBA(37,99,235,1)
                                    Height: =40
                                    OnSelect: =Set(varPlannerFocusedDate,DateAdd(varPlannerFocusedDate,-7,TimeUnit.Days));Set(varPlannerYear,Year(varPlannerFocusedDate))
                                    Text: ="‹"
                                    Width: =44
                              - txtPlannerWeekRange:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Center
                                    Color: =RGBA(15,23,42,1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =40
                                    LayoutMinWidth: =0
                                    Size: =20
                                    Text: =Text(DateAdd(varPlannerFocusedDate,1-Weekday(varPlannerFocusedDate,StartOfWeek.Monday),TimeUnit.Days),"mmm d") & " – " & Text(DateAdd(varPlannerFocusedDate,7-Weekday(varPlannerFocusedDate,StartOfWeek.Monday),TimeUnit.Days),"mmm d, yyyy")
                                    Wrap: =false
                              - btnPlannerWeekNext:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Next week"
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =RGBA(37,99,235,1)
                                    Height: =40
                                    OnSelect: =Set(varPlannerFocusedDate,DateAdd(varPlannerFocusedDate,7,TimeUnit.Days));Set(varPlannerYear,Year(varPlannerFocusedDate))
                                    Text: ="›"
                                    Width: =44
                        - galPlannerWeekGrid:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Seven day week calendar"
                              DelayItemLoading: =false
                              Items: =AddColumns(Sequence(7),CellDate,DateAdd(varPlannerFocusedDate,Value-Weekday(varPlannerFocusedDate,StartOfWeek.Monday),TimeUnit.Days))
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LoadingSpinner: =LoadingSpinner.None
                              Selectable: =false
                              ShowScrollbar: =false
                              TabIndex: =0
                              TemplatePadding: =3
                              TemplateSize: =Parent.Height-6
                              WrapCount: =7
                            Children:
                              - conPlannerWeekCell:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =If(DateValue(ThisItem.CellDate)=DateValue(varPlannerFocusedDate),RGBA(37,99,235,1),RGBA(203,213,225,1))
                                    BorderThickness: =If(DateValue(ThisItem.CellDate)=DateValue(varPlannerFocusedDate),2,1)
                                    DropShadow: =DropShadow.None
                                    Fill: =If(CountIf(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive)>0,RGBA(254,242,242,1),RGBA(255,255,255,1))
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - txtPlannerWeekCellDate:
                                        Control: ModernText
                                        Properties:
                                          AccessibleLabel: =Text(ThisItem.CellDate,"dddd, mmmm d, yyyy")
                                          Align: =Align.Center
                                          Color: =RGBA(15,23,42,1)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =48
                                          LayoutMinWidth: =0
                                          Size: =14
                                          Text: =Text(ThisItem.CellDate,"ddd") & Char(10) & Text(ThisItem.CellDate,"mmm d")
                                    - btnPlannerWeekCellClosure:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =LookUp(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive,ClosureName)
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(185,28,28,1)
                                          Height: =34
                                          LayoutMinWidth: =0
                                          OnSelect: =Set(varPlannerSelectedClosureId,LookUp(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive,ClosureId));Set(varPlannerFocusedDate,ThisItem.CellDate);Set(varPlannerContextMode,"Closure");Set(varPlannerView,"Year");Navigate(CalendarPlanner,ScreenTransition.None)
                                          Text: =LookUp(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive,ClosureLabel)
                                          Visible: =CountIf(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive)>0
                                    - galPlannerWeekCellEvents:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Meetings on " & Text(ThisItem.CellDate,"mmmm d")
                                          DelayItemLoading: =false
                                          Items: =SortByColumns(Filter(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && ((PlanningLayer="Board" && varPlannerShowBoard)||(PlanningLayer="Board Committees" && varPlannerShowCommittees)||(PlanningLayer="Executive Leadership" && varPlannerShowExecutive)||(PlanningLayer="Organization & Operations" && varPlannerShowOperations))),"StartTime",SortOrder.Ascending)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          LoadingSpinner: =LoadingSpinner.None
                                          TabIndex: =0
                                          TemplatePadding: =2
                                          TemplateSize: =62
                                        Children:
                                          - btnPlannerWeekCellEvent:
                                              Control: ModernButton
                                              Properties:
                                                AccessibleLabel: =ThisItem.EventName & " at " & Text(ThisItem.StartTime,"h:mm AM/PM")
                                                Appearance: =If(ThisItem.DecisionStatus="NeedsReview",ButtonAppearance.Outline,ButtonAppearance.Primary)
                                                BasePaletteColor: =If(ThisItem.DecisionStatus="NeedsReview",RGBA(217,119,6,1),ThisItem.PlanningLayer="Board",RGBA(30,64,175,1),ThisItem.PlanningLayer="Board Committees",RGBA(14,116,144,1),ThisItem.PlanningLayer="Executive Leadership",RGBA(124,58,237,1),RGBA(5,150,105,1))
                                                Height: =58
                                                OnSelect: =Set(varPlannerSelectedEventId,ThisItem.EventId);Set(varPlannerFocusedDate,ThisItem.EventDate);Set(varPlannerContextMode,"Summary")
                                                Text: =Text(ThisItem.StartTime,"h:mm AM/PM") & Char(10) & ThisItem.EventName
                  - conPlannerWeekContext:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(203,213,225,1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.Semilight
                        Fill: =RGBA(255,255,255,1)
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =390
                      Children:
                        - txtPlannerWeekContextLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Context panel"
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              LayoutMinWidth: =0
                              Size: =11
                              Text: ="CONTEXT PANEL"
                              Wrap: =false
                        - txtPlannerWeekMeetingName:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Color: =RGBA(15,23,42,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =66
                              LayoutMinWidth: =0
                              Size: =24
                              Text: =If(IsBlank(varPlannerSelectedEventId),"Select a meeting",LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventName))
                        - txtPlannerWeekMeetingInfo:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              Height: =82
                              LayoutMinWidth: =0
                              Size: =13
                              Text: =If(IsBlank(varPlannerSelectedEventId),"Choose any meeting in the week to see details and actions.",Text(LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventDate),"dddd, mmmm d, yyyy") & Char(10) & Text(LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,StartTime),"h:mm AM/PM") & "–" & Text(LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EndTime),"h:mm AM/PM") & Char(10) & LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,SchedulingSource))
                              VerticalAlign: =VerticalAlign.Top
                        - txtPlannerWeekApprovalStatus:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Start
                              BorderColor: =RGBA(245,158,11,1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(146,64,14,1)
                              Fill: =RGBA(255,251,235,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              LayoutMinWidth: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              Size: =12
                              Text: ="Needs approval"
                              Visible: =LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,DecisionStatus)="NeedsReview"
                              Width: =156
                              Wrap: =false
                        - conPlannerWeekSummaryActions:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =varPlannerContextMode<>"Move" && !IsBlank(varPlannerSelectedEventId)
                            Children:
                              - btnPlannerWeekApprove:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Approve the proposed date for the selected meeting"
                                    BasePaletteColor: =RGBA(22,163,74,1)
                                    Height: =44
                                    OnSelect: |-
                                      =With(
                                        {selectedEvent:LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId)},
                                        Patch(colCalProofEvents,selectedEvent,{DecisionStatus:"Approved",WarningAcknowledged:true});
                                        Set(varPlannerReceipt,selectedEvent.EventName & " approved for " & Text(selectedEvent.EventDate,"mmm d") & " at " & Text(selectedEvent.StartTime,"h:mm AM/PM") & ".");
                                        Collect(colPlannerHistory,{ChangeId:"CHG-" & Text(Now(),"yyyymmddhhmmss"),Action:"Approve proposed date",SubjectId:selectedEvent.EventId,Summary:varPlannerReceipt,ChangedAt:Now()})
                                      )
                                    Text: ="Approve " & Text(LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventDate),"mmm d")
                                    Visible: =LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,DecisionStatus)="NeedsReview"
                              - btnPlannerWeekMove:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Move selected meeting"
                                    BasePaletteColor: =RGBA(37,99,235,1)
                                    Height: =44
                                    OnSelect: |-
                                      =Set(varPlannerContextMode,"Move");
                                      Set(varPlannerDraftName,LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventName));
                                      Set(varPlannerDraftDate,LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventDate));
                                      Set(varPlannerDraftStart,LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,StartTime));
                                      Set(varPlannerDraftDuration,LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,DurationMinutes));
                                      Set(varPlannerWarningAcknowledged,false);
                                      Set(varPlannerDraftDirty,true);
                                      Reset(datPlannerWeekMoveDate);
                                      Reset(drpPlannerWeekMoveTime);
                                      Reset(numPlannerWeekMoveDuration)
                                    Text: ="Move meeting"
                              - btnPlannerWeekDelete:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Delete selected meeting"
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(185,28,28,1)
                                    Height: =44
                                    OnSelect: =Set(varPlannerContextMode,"Delete");Set(varPlannerView,"Year");Navigate(CalendarPlanner,ScreenTransition.None)
                                    Text: ="Delete meeting"
                        - conPlannerWeekMoveEditor:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =varPlannerContextMode="Move"
                            Children:
                              - txtPlannerWeekMoveTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(15,23,42,1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =38
                                    LayoutMinWidth: =0
                                    Size: =20
                                    Text: ="Move " & varPlannerDraftName
                                    Wrap: =false
                              - datPlannerWeekMoveDate:
                                  Control: ModernDatePicker
                                  Properties:
                                    AccessibleLabel: ="New meeting date"
                                    DefaultDate: =varPlannerDraftDate
                                    EndDate: =Date(varPlannerYear,12,31)
                                    Height: =44
                                    OnChange: =Set(varPlannerDraftDate,Self.SelectedDate);Set(varPlannerWarningAcknowledged,false);Set(varPlannerDraftDirty,true)
                                    StartDate: =Date(varPlannerYear,1,1)
                              - drpPlannerWeekMoveTime:
                                  Control: ModernDropdown
                                  Properties:
                                    AccessibleLabel: ="New start time"
                                    Default: ={Value:Text(varPlannerDraftStart,"h:mm AM/PM")}
                                    Height: =44
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =ForAll(Sequence(29),{Value:Text(DateAdd(Time(7,0,0),(Value-1)*30,TimeUnit.Minutes),"h:mm AM/PM")})
                                    OnChange: =Set(varPlannerDraftStart,TimeValue(Self.Selected.Value));Set(varPlannerWarningAcknowledged,false);Set(varPlannerDraftDirty,true)
                              - numPlannerWeekMoveDuration:
                                  Control: ModernNumberInput
                                  Properties:
                                    AccessibleLabel: ="Duration in minutes"
                                    Default: =varPlannerDraftDuration
                                    Height: =44
                                    Max: =720
                                    Min: =15
                                    OnChange: =Set(varPlannerDraftDuration,Self.Value);Set(varPlannerWarningAcknowledged,false);Set(varPlannerDraftDirty,true)
                                    Step: =15
                              - txtPlannerWeekValidation:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =If(IsPlannerHardStop(varPlannerDraftDate),RGBA(185,28,28,1),RGBA(146,64,14,1))
                                    Fill: =If(IsPlannerHardStop(varPlannerDraftDate),RGBA(254,242,242,1),RGBA(255,251,235,1))
                                    Font: =Font.'Segoe UI'
                                    Height: =70
                                    LayoutMinWidth: =0
                                    PaddingLeft: =10
                                    Size: =12
                                    Text: |-
                                      =If(IsPlannerHardStop(varPlannerDraftDate),"Hard stop: choose a weekday that is not closed or blocked.","Warning: overlaps and cadence changes require acknowledgment before confirmation.")
                              - btnPlannerWeekAcknowledge:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Acknowledge move warning"
                                    Appearance: =If(varPlannerWarningAcknowledged,ButtonAppearance.Primary,ButtonAppearance.Outline)
                                    BasePaletteColor: =RGBA(217,119,6,1)
                                    Height: =40
                                    OnSelect: =Set(varPlannerWarningAcknowledged,!varPlannerWarningAcknowledged)
                                    Text: =If(varPlannerWarningAcknowledged,"✓ Warning acknowledged","Acknowledge warning")
                                    Visible: =!IsPlannerHardStop(varPlannerDraftDate) && (CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventId<>varPlannerSelectedEventId && EventDate=varPlannerDraftDate)>0 || varPlannerDraftDate<>LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventDate))
                              - btnPlannerWeekSaveMove:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Confirm move"
                                    BasePaletteColor: =RGBA(37,99,235,1)
                                    DisplayMode: =If(IsPlannerHardStop(varPlannerDraftDate) || (varPlannerDraftDate=LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventDate) && varPlannerDraftStart=LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,StartTime) && varPlannerDraftDuration=LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,DurationMinutes)) || ((CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventId<>varPlannerSelectedEventId && EventDate=varPlannerDraftDate)>0 || varPlannerDraftDate<>LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventDate)) && !varPlannerWarningAcknowledged),DisplayMode.Disabled,DisplayMode.Edit)
                                    Height: =44
                                    OnSelect: |-
                                      =With(
                                        {selectedEvent:LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId)},
                                        With(
                                          {previousDate:selectedEvent.EventDate,previousStart:selectedEvent.StartTime,previousEnd:selectedEvent.EndTime,previousStatus:selectedEvent.DecisionStatus,eventName:selectedEvent.EventName,eventId:selectedEvent.EventId},
                                          ClearCollect(colPlannerUndo,{Action:"Move",SubjectId:eventId,EventName:eventName,PreviousDate:previousDate,PreviousStart:previousStart,PreviousEnd:previousEnd,PreviousStatus:previousStatus,PreviousActive:false,SnapshotEvent:selectedEvent,SnapshotClosure:First(colCalProofClosures)});
                                          Patch(colCalProofEvents,selectedEvent,{EventDate:varPlannerDraftDate,CurrentDate:varPlannerDraftDate,StartTime:varPlannerDraftStart,EndTime:DateAdd(varPlannerDraftStart,varPlannerDraftDuration,TimeUnit.Minutes),DurationMinutes:varPlannerDraftDuration,IsManualOverride:true,DecisionStatus:If(varPlannerWarningAcknowledged,"Warning acknowledged","Ready"),WarningAcknowledged:varPlannerWarningAcknowledged});
                                          Set(varPlannerReceipt,eventName & " moved from " & Text(previousDate,"mmm d") & " at " & Text(previousStart,"h:mm AM/PM") & " to " & Text(varPlannerDraftDate,"mmm d") & " at " & Text(varPlannerDraftStart,"h:mm AM/PM") & ".");
                                          Collect(colPlannerHistory,{ChangeId:"CHG-" & Text(Now(),"yyyymmddhhmmss"),Action:"Move",SubjectId:eventId,Summary:varPlannerReceipt,ChangedAt:Now()})
                                        )
                                      );
                                      Set(varPlannerFocusedDate,varPlannerDraftDate);
                                      Set(varPlannerDraftDirty,false);
                                      Set(varPlannerContextMode,"Summary")
                                    Text: ="Confirm move"
                              - btnPlannerWeekCancelMove:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Cancel move"
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(71,85,105,1)
                                    Height: =42
                                    OnSelect: =Set(varPlannerDraftDirty,false);Set(varPlannerContextMode,"Summary")
                                    Text: ="Cancel"
                        - txtPlannerWeekReceipt:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Color: =RGBA(21,128,61,1)
                              Fill: =RGBA(240,253,244,1)
                              Font: =Font.'Segoe UI'
                              Height: =90
                              LayoutMinWidth: =0
                              PaddingBottom: =8
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =8
                              Size: =12
                              Text: ="✓ " & varPlannerReceipt
                              Visible: =!IsBlank(varPlannerReceipt)
