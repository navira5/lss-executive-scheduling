                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Meetings on " & Text(ThisItem.CellDate,"mmmm d")
                                          AlignInContainer: =AlignInContainer.Stretch
                                          DelayItemLoading: =false
                                          FillPortions: =1
