                                  CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")>0,
                                  "Confirm every Board rule first.",
                                  CountRows(colCalProofGenerationReceipt)=0 || CountRows(colCalProofEvents)=0,
                                  "Generate the Board draft first.",
                                  CountRows(colCalProofBlockedEvents)>0,
                                  "Resolve every blocked date first.",
                                  CountIf(colCalProofEvents,DecisionStatus="NeedsReview")>0,
                                  "Approve or move every proposed date first.",
                                  "Confirm Board and lock all dates locally."
                                )
                              Visible: =varCalProofBoardConfirmed || (!varCalProofDraftNeedsRegeneration && CountRows(colCalProofGenerationReceipt)>0 && CountRows(colCalProofEvents)>0)
