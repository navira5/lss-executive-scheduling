Screens:
  AnnualCalendarProof:
    Properties:
      Fill: =RGBA(244,247,251,1)
      LoadingSpinnerColor: =RGBA(15,43,91,1)
    Children:
      - conCalProofRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(244,247,251,1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width<760,16,24)
            PaddingLeft: =If(App.Width<760,16,24)
            PaddingRight: =If(App.Width<760,16,24)
            PaddingTop: =If(App.Width<760,16,24)
            Width: =Parent.Width
          Children:
            - conCalProofHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<760,148,96)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width<760,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =If(App.Width<760,8,12)
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                Children:
                  - conCalProofHeaderCopy:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtCalProofTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Plan Year 2027"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(15,23,42,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =28
                              Text: ="Plan Year 2027"
                              Wrap: =false
                        - txtCalProofSubtitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Annual calendar proof using local sample data"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              Height: =20
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: ="Annual calendar proof · local sample data"
                              Wrap: =false
                  - txtCalProofSafety:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Local proof. No Outlook or SharePoint connection."
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(203,213,225,1)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =RGBA(15,43,91,1)
                        Fill: =RGBA(248,250,252,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =0
                        RadiusBottomLeft: =18
                        RadiusBottomRight: =18
                        RadiusTopLeft: =18
                        RadiusTopRight: =18
                        Size: =12
                        Text: ="Local proof · no Outlook or SharePoint"
                        Width: =If(App.Width<760,Parent.Width,230)
                        Wrap: =false
            - conCalProofRulesNavBanner:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<760,300,If(App.Width<1100,180,124))
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width<760,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =If(App.Width<760,12,16)
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =If(App.Width<760,12,16)
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - conCalProofRulesNavCopy:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =If(App.Width<760,0,1)
                        Height: =If(App.Width<760,112,If(App.Width<1100,140,84))
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtCalProofRulesNavTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Board rules and draft"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(15,43,91,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =18
                              Text: ="Board rules and draft"
                              Wrap: =false
                        - txtCalProofRulesNavHelp:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(71,85,105,1)
                              Font: =Font.'Segoe UI'
                              Height: =If(App.Width<760,84,If(App.Width<1100,114,54))
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =13
                              Text: |-
                                =With(
                                  {
                                    reviewCount:CountIf(colCalProofEvents,DecisionStatus="NeedsReview"),
                                    blockedCount:CountRows(colCalProofBlockedEvents)
                                  },
                                  If(
                                    varCalProofBoardConfirmed && CountRows(colCalProofBoardConfirmationReceipt)>0,
                                    "Board confirmed and " & Text(First(colCalProofBoardConfirmationReceipt).EventCount) & " dates locked locally on " & Text(First(colCalProofBoardConfirmationReceipt).ConfirmedAt,"mmm d, yyyy 'at' h:mm AM/PM") & ". No Outlook changes were made.",
                                    CountRows(colBoardRuleProof)=0,
                                    "No Board rules are available.",
                                    CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")>0,
                                    Text(CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")) & " Board rule" & If(CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")=1,"","s") & " still need confirmation. Open Board rules, complete them, and return here.",
                                    varCalProofDraftNeedsRegeneration,
                                    "A Board rule changed. Regenerate the draft before reviewing or confirming Board. Existing manual moves will be preserved.",
                                    CountRows(colCalProofGenerationReceipt)=0,
                                    "All " & Text(CountRows(colBoardRuleProof)) & " Board rules are confirmed. Generate the 2027 Board draft when ready.",
                                    blockedCount>0,
                                    "Board confirmation blocked — no valid replacement found for " & Text(blockedCount) & " date" & If(blockedCount=1,"","s") & ". Review the unplaced item" & If(blockedCount=1,"","s") & " before confirming Board.",
                                    reviewCount>0,
                                    "Board confirmation blocked — " & Text(reviewCount) & " date" & If(reviewCount=1,"","s") & " need" & If(reviewCount=1,"s","") & " review. The system proposed the next valid business day; a person must approve or change each exception.",
                                    First(colCalProofGenerationReceipt).GeneratedCount>0,
                                    "Draft " & First(colCalProofGenerationReceipt).BatchId & " · " & Text(First(colCalProofGenerationReceipt).GeneratedCount) & " dates from " & Text(First(colCalProofGenerationReceipt).RuleCount) & " confirmed rules (" & First(colCalProofGenerationReceipt).RuleIds & ")" & If(First(colCalProofGenerationReceipt).ManualOverrideCount>0," · " & Text(First(colCalProofGenerationReceipt).ManualOverrideCount) & " manual move" & If(First(colCalProofGenerationReceipt).ManualOverrideCount=1,"","s") & " preserved","") & " · Ready for Board confirmation review.",
                                    "Draft " & First(colCalProofGenerationReceipt).BatchId & " · 0 dates from " & Text(First(colCalProofGenerationReceipt).RuleCount) & " confirmed rules (" & First(colCalProofGenerationReceipt).RuleIds & ") · no dates generated for as-needed rules."
                                  )
                                )
                              VerticalAlign: =VerticalAlign.Top
                  - conCalProofDraftActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(App.Width<760,148,44)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(App.Width<760,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(App.Width<760,Parent.Width,548)
                      Children:
                        - btnCalProofRulesNavOpen:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Open Board rules review"
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: =If(CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")>0,ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(37,99,235,1)
                              Color: =If(CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")>0,RGBA(255,255,255,1),RGBA(15,43,91,1))
                              DisplayMode: =If(varCalProofBoardConfirmed,DisplayMode.Disabled,DisplayMode.Edit)
                              FillPortions: =If(App.Width<760,0,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                  CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")>0,
                                  Set(varBrvSelectedRuleId,First(SortByColumns(Filter(colBoardRuleProof,RuleStatus<>"Confirmed"),"SortOrder",SortOrder.Ascending)).RuleId)
                                );
                                Set(varBrvReceiptVisible,false);
                                Set(varBrvSaveAttempted,false);
                                Navigate(BoardRulesReview,ScreenTransition.None)
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =14
                              Text: =If(CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")>0,"Review " & Text(CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")) & " Board rule" & If(CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")=1,"","s"),"Board rules")
                              Visible: =!varCalProofBoardConfirmed
                              Width: =If(App.Width<760,Parent.Width,176)
                        - btnCalProofDraftGenerate:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =Self.Text
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              BasePaletteColor: =RGBA(37,99,235,1)
                              Color: =RGBA(255,255,255,1)
                              DisplayMode: =DisplayMode.Edit
                              FillPortions: =If(App.Width<760,0,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                    CountRows(colBoardRuleProof)>0 && CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")=0,
                                    ClearCollect(colCalProofPreservedOverrides,Filter(colCalProofEvents,IsManualOverride));
                                    Clear(colCalProofGeneratedEvents);
                                    Clear(colCalProofBlockedEvents);
                                    ForAll(
                                        SortByColumns(Filter(colBoardRuleProof,RuleStatus="Confirmed"),"SortOrder",SortOrder.Ascending) As boardRule,
                                        With(
                                            {
                                                startMonthNumber:Switch(boardRule.StartMonth,"January",1,"February",2,"March",3,"April",4,"May",5,"June",6,"July",7,"August",8,"September",9,"October",10,"November",11,"December",12,1),
                                                anchorMonthNumber:Switch(boardRule.AnchorMonth,"January",1,"February",2,"March",3,"April",4,"May",5,"June",6,"July",7,"August",8,"September",9,"October",10,"November",11,"December",12,1),
                                                preferredDayNumber:Switch(boardRule.PreferredDay,"Monday",1,"Tuesday",2,"Wednesday",3,"Thursday",4,"Friday",5,"Saturday",6,"Sunday",7,1),
                                                secondDayNumber:Switch(boardRule.SecondPreferredDay,"Monday",1,"Tuesday",2,"Wednesday",3,"Thursday",4,"Friday",5,"Saturday",6,"Sunday",7,1)
                                            },
                                            With(
                                                {anchorDate:Date(2027,anchorMonthNumber,boardRule.AnchorDay)},
                                                ForAll(
                                                    Filter(
                                                        AddColumns(Sequence(365),CandidateDate,DateAdd(Date(2027,1,1),Value-1,TimeUnit.Days)),
                                                        Switch(
                                                            boardRule.Cadence,
                                                            "One time",CandidateDate=anchorDate,
                                                            "Twice a week",Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber || Weekday(CandidateDate,StartOfWeek.Monday)=secondDayNumber,
                                                            "Weekly",Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber,
                                                            "Every two weeks",CandidateDate>=anchorDate && Mod(DateDiff(anchorDate,CandidateDate,TimeUnit.Days),14)=0,
                                                            "Twice a month",Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber &&
                                                                (Switch(boardRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false) ||
                                                                 Switch(boardRule.SecondWeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false)),
                                                            "Monthly",Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(boardRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                            "Every two months",Month(CandidateDate)>=startMonthNumber && Mod(Month(CandidateDate)-startMonthNumber,2)=0 && Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(boardRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                            "Quarterly",Month(CandidateDate)>=startMonthNumber && Mod(Month(CandidateDate)-startMonthNumber,3)=0 && Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(boardRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                            "Specific months",Text(CandidateDate,"mmmm") in boardRule.MonthsText && Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(boardRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                            "Annually",Month(CandidateDate)=startMonthNumber && Weekday(CandidateDate,StartOfWeek.Monday)=preferredDayNumber && Switch(boardRule.WeekOfMonth,"First",Day(CandidateDate)<=7,"Second",Day(CandidateDate)>=8&&Day(CandidateDate)<=14,"Third",Day(CandidateDate)>=15&&Day(CandidateDate)<=21,"Fourth",Day(CandidateDate)>=22&&Day(CandidateDate)<=28,"Last",Month(DateAdd(CandidateDate,7,TimeUnit.Days))<>Month(CandidateDate),false),
                                                            "As needed — no dates generated automatically",false,
                                                            false
                                                        )
                                                    ) As generatedDay,
                                                    With(
                                                        {
                                                            originalDate:generatedDay.CandidateDate,
                                                            proposedDate:GetNextCalProofBusinessDate(generatedDay.CandidateDate),
                                                            closureName:LookUp(colCalProofClosures,ClosureDate=generatedDay.CandidateDate,ClosureName),
                                                            hardStopName:LookUp(colCalProofHardStops,HardStopDate=generatedDay.CandidateDate,HardStopName)
                                                        },
                                                        With(
                                                            {
                                                                wasAdjusted:!IsBlank(proposedDate) && proposedDate<>originalDate,
                                                                adjustmentReason:If(!IsBlank(closureName),"Holiday/Closure","Hard scheduling block"),
                                                                adjustmentSource:Coalesce(closureName,hardStopName,If(Weekday(originalDate,StartOfWeek.Monday)>5,"Weekend","Protected date")),
                                                                sourceSummary:"Generated from rule "&boardRule.RuleId&" · "&boardRule.Cadence&" · "&Switch(boardRule.Cadence,"One time",boardRule.AnchorMonth&" "&Text(boardRule.AnchorDay)&", 2027","Twice a week",boardRule.PreferredDay&" and "&boardRule.SecondPreferredDay,"Weekly",boardRule.PreferredDay,"Every two weeks","every 14 days from "&boardRule.AnchorMonth&" "&Text(boardRule.AnchorDay),"Twice a month",boardRule.WeekOfMonth&" and "&boardRule.SecondWeekOfMonth&" "&boardRule.PreferredDay,"Monthly",boardRule.WeekOfMonth&" "&boardRule.PreferredDay,"Every two months","starting "&boardRule.StartMonth&" · "&boardRule.WeekOfMonth&" "&boardRule.PreferredDay,"Quarterly","starting "&boardRule.StartMonth&" · "&boardRule.WeekOfMonth&" "&boardRule.PreferredDay,"Specific months",boardRule.MonthsText&" · "&boardRule.WeekOfMonth&" "&boardRule.PreferredDay,"Annually",boardRule.StartMonth&" · "&boardRule.WeekOfMonth&" "&boardRule.PreferredDay,"As needed — no dates generated automatically","no automatic dates","")
                                                            },
                                                            If(
                                                                IsBlank(proposedDate),
                                                                Collect(
                                                                    colCalProofBlockedEvents,
                                                                    {
                                                                        EventId:boardRule.RuleId&"-"&Text(originalDate,"yyyymmdd"),
                                                                        EventName:boardRule.MeetingName,
                                                                        EventType:Switch(boardRule.RuleId,"BOARD-FULL","Full Board","BOARD-CHECKIN","Critical Issue Check-in","BOARD-RETREAT","Board Retreat",boardRule.MeetingName),
                                                                        EventDate:Blank(),
                                                                        GeneratedDate:originalDate,
                                                                        OriginalGeneratedDate:originalDate,
                                                                        CurrentDate:Blank(),
                                                                        AutoAdjusted:true,
                                                                        AdjustmentReason:adjustmentReason,
                                                                        AdjustmentSourceName:adjustmentSource,
                                                                        DecisionStatus:"Blocked",
                                                                        StartTime:TimeValue(boardRule.StartTimeText),
                                                                        EndTime:DateAdd(TimeValue(boardRule.StartTimeText),boardRule.DurationMinutes,TimeUnit.Minutes),
                                                                        ChipText:Switch(boardRule.RuleId,"BOARD-FULL","BOARD","BOARD-CHECKIN","CHECK","BOARD-RETREAT","RETREAT","BOARD"),
                                                                        SchedulingSource:sourceSummary,
                                                                        SourceRuleId:boardRule.RuleId,
                                                                        IsManualOverride:false
                                                                    }
                                                                ),
                                                                Collect(
                                                                    colCalProofGeneratedEvents,
                                                                    {
                                                                        EventId:boardRule.RuleId&"-"&Text(originalDate,"yyyymmdd"),
                                                                        EventName:boardRule.MeetingName,
                                                                        EventType:Switch(boardRule.RuleId,"BOARD-FULL","Full Board","BOARD-CHECKIN","Critical Issue Check-in","BOARD-RETREAT","Board Retreat",boardRule.MeetingName),
                                                                        EventDate:proposedDate,
                                                                        GeneratedDate:originalDate,
                                                                        OriginalGeneratedDate:originalDate,
                                                                        CurrentDate:proposedDate,
                                                                        AutoAdjusted:wasAdjusted,
                                                                        AdjustmentReason:If(wasAdjusted,adjustmentReason,""),
                                                                        AdjustmentSourceName:If(wasAdjusted,adjustmentSource,""),
                                                                        DecisionStatus:If(wasAdjusted,"NeedsReview","Ready"),
                                                                        StartTime:TimeValue(boardRule.StartTimeText),
                                                                        EndTime:DateAdd(TimeValue(boardRule.StartTimeText),boardRule.DurationMinutes,TimeUnit.Minutes),
                                                                        ChipText:Switch(boardRule.RuleId,"BOARD-FULL","BOARD","BOARD-CHECKIN","CHECK","BOARD-RETREAT","RETREAT","BOARD"),
                                                                        SchedulingSource:sourceSummary,
                                                                        SourceRuleId:boardRule.RuleId,
                                                                        IsManualOverride:false
                                                                    }
                                                                )
                                                            )
                                                        )
                                                    )
                                                )
                                            )
                                        )
                                    );
                                    ForAll(
                                      colCalProofPreservedOverrides As savedOverride,
                                      With(
                                        {freshEvent:LookUp(colCalProofGeneratedEvents,EventId=savedOverride.EventId)},
                                        If(
                                          !IsBlank(freshEvent.EventId),
                                          Patch(
                                            colCalProofGeneratedEvents,
                                            freshEvent,
                                            {
                                              EventDate:savedOverride.EventDate,
                                              CurrentDate:savedOverride.CurrentDate,
                                              StartTime:savedOverride.StartTime,
                                              EndTime:savedOverride.EndTime,
                                              DecisionStatus:"Approved",
                                              IsManualOverride:true
                                            }
                                          ),
                                          !IsBlank(LookUp(colBoardRuleProof,RuleId=savedOverride.SourceRuleId && RuleStatus="Confirmed")),
                                          Collect(
                                            colCalProofGeneratedEvents,
                                            {
                                              EventId:savedOverride.EventId,
                                              EventName:savedOverride.EventName,
                                              EventType:savedOverride.EventType,
                                              EventDate:savedOverride.EventDate,
                                              GeneratedDate:savedOverride.GeneratedDate,
                                              OriginalGeneratedDate:savedOverride.OriginalGeneratedDate,
                                              CurrentDate:savedOverride.CurrentDate,
                                              AutoAdjusted:savedOverride.AutoAdjusted,
                                              AdjustmentReason:"Rule changed after manual move",
                                              AdjustmentSourceName:"Manual override retained",
                                              DecisionStatus:"NeedsReview",
                                              StartTime:savedOverride.StartTime,
                                              EndTime:savedOverride.EndTime,
                                              ChipText:savedOverride.ChipText,
                                              SchedulingSource:savedOverride.SchedulingSource & " · Manual override retained after rule change",
                                              SourceRuleId:savedOverride.SourceRuleId,
                                              IsManualOverride:true
                                            }
                                          )
                                        )
                                      )
                                    );
                                    ClearCollect(colCalProofEvents,SortByColumns(colCalProofGeneratedEvents,"EventDate",SortOrder.Ascending,"EventId",SortOrder.Ascending));
                                    With(
                                      {firstReviewId:First(SortByColumns(Filter(colCalProofEvents,DecisionStatus="NeedsReview"),"OriginalGeneratedDate",SortOrder.Ascending)).EventId},
                                      Set(varCalProofSelectedEventId,Coalesce(firstReviewId,""));
                                      Set(varCalProofSelectedEvent,If(IsBlank(firstReviewId),Blank(),LookUp(colCalProofEvents,EventId=firstReviewId)))
                                    );
                                    Set(varCalProofChoosingAlternate,false);
                                    Set(varCalProofReviewCollapsed,false);
                                    Set(varCalProofMoreDetailsExpanded,false);
                                    Set(varCalProofUndoConfirmationPending,false);
                                    Set(varCalProofUndoIssue,"");
                                    Set(varCalProofReceiptVisible,false);
                                    Set(varCalProofReceiptAction,"");
                                    Clear(colCalProofMoveSnapshot);
                                    Set(varCalProofActionMessage,"");
                                    Set(varCalProofBoardConfirmed,false);
                                    Set(varCalProofDraftNeedsRegeneration,false);
                                    Clear(colCalProofBoardConfirmationReceipt);
                                    With(
                                        {generatedCount:CountRows(colCalProofEvents),batchTime:Now()},
                                        ClearCollect(
                                            colCalProofGenerationReceipt,
                                            {
                                                BatchId:"BOARD-DRAFT-"&Text(batchTime,"yyyymmddhhmmss"),
                                                GeneratedCount:generatedCount,
                                                RuleCount:CountRows(Filter(colBoardRuleProof,RuleStatus="Confirmed")),
                                                ManualOverrideCount:CountIf(colCalProofEvents,IsManualOverride),
                                                GeneratedAt:batchTime,
                                                FirstDate:If(generatedCount>0,First(colCalProofEvents).EventDate,Date(2027,1,1)),
                                                LastDate:If(generatedCount>0,Last(colCalProofEvents).EventDate,Date(2027,1,1)),
                                                RuleIds:Concat(SortByColumns(Filter(colBoardRuleProof,RuleStatus="Confirmed"),"SortOrder",SortOrder.Ascending),RuleId,", ")
                                            }
                                        )
                                    )
                                )
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =14
                              Text: =If(CountRows(colCalProofGenerationReceipt)=0,"Generate Board draft","Regenerate Board draft")
                              Tooltip: =If(varCalProofBoardConfirmed,"Board dates are locked.",If(Self.DisplayMode=DisplayMode.Disabled,"Confirm every Board rule before generating.",Self.Text))
                              Visible: =!varCalProofBoardConfirmed && CountRows(colBoardRuleProof)>0 && CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")=0 && (CountRows(colCalProofGenerationReceipt)=0 || varCalProofDraftNeedsRegeneration)
                              Width: =If(App.Width<760,Parent.Width,208)
                        - btnCalProofConfirmBoard:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: =If(varCalProofBoardConfirmed,"Board confirmed and dates locked","Confirm Board and lock dates")
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              BasePaletteColor: =If(varCalProofBoardConfirmed,RGBA(21,128,61,1),RGBA(15,43,91,1))
                              Color: =RGBA(255,255,255,1)
                              DisplayMode: =If(varCalProofBoardConfirmed,DisplayMode.Disabled,DisplayMode.Edit)
                              FillPortions: =If(App.Width<760,0,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                  CountRows(colCalProofBlockedEvents)>0,
                                  Set(varCalProofSelectedEventId,First(colCalProofBlockedEvents).EventId);
                                  Set(varCalProofSelectedEvent,First(colCalProofBlockedEvents));
                                  Set(varCalProofActionMessage,"Review the unplaced Board date before confirming."),
                                  CountIf(colCalProofEvents,DecisionStatus="NeedsReview")>0,
                                  Set(varCalProofSelectedEventId,First(SortByColumns(Filter(colCalProofEvents,DecisionStatus="NeedsReview"),"OriginalGeneratedDate",SortOrder.Ascending)).EventId);
                                  Set(varCalProofSelectedEvent,LookUp(colCalProofEvents,EventId=varCalProofSelectedEventId));
                                  Set(varCalProofReviewCollapsed,false);
                                  Set(varCalProofActionMessage,"Review the proposed date change before confirming."),
                                  !varCalProofBoardConfirmed &&
                                  !varCalProofDraftNeedsRegeneration &&
                                  CountRows(colBoardRuleProof)>0 &&
                                  CountIf(colBoardRuleProof,RuleStatus<>"Confirmed")=0 &&
                                  CountRows(colCalProofGenerationReceipt)>0 &&
                                  CountRows(colCalProofEvents)>0,
                                  With(
                                    {confirmedAt:Now(),confirmationId:"BOARD-CONFIRM-"&Text(Now(),"yyyymmddhhmmss")},
                                    ClearCollect(
                                      colCalProofBoardConfirmationReceipt,
                                      {
                                        ConfirmationId:confirmationId,
                                        BatchId:First(colCalProofGenerationReceipt).BatchId,
                                        ConfirmedAt:confirmedAt,
                                        EventCount:CountRows(colCalProofEvents),
                                        RuleCount:CountRows(Filter(colBoardRuleProof,RuleStatus="Confirmed")),
                                        ManualAdjustmentCount:CountIf(colCalProofEvents,IsManualOverride),
                                        AutoAdjustedCount:CountIf(colCalProofEvents,AutoAdjusted),
                                        Status:"Confirmed"
                                      }
                                    );
                                    Set(varCalProofBoardConfirmed,true);
                                    Set(varCalProofChoosingAlternate,false);
                                    Set(varCalProofUndoConfirmationPending,false);
                                    Set(varCalProofReceiptVisible,false);
                                    Set(varCalProofActionMessage,"Board confirmed and dates locked locally. No Outlook changes were made.")
                                  )
                                )
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =14
                              Text: =If(varCalProofBoardConfirmed,"Board confirmed",CountRows(colCalProofBlockedEvents)+CountIf(colCalProofEvents,DecisionStatus="NeedsReview")>0,"Fix " & Text(CountRows(colCalProofBlockedEvents)+CountIf(colCalProofEvents,DecisionStatus="NeedsReview")) & " issue" & If(CountRows(colCalProofBlockedEvents)+CountIf(colCalProofEvents,DecisionStatus="NeedsReview")=1,"","s"),"Confirm Board")
