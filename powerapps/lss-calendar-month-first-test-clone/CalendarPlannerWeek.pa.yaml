Screens:
  CalendarPlannerWeek:
    Properties:
      Fill: =RGBA(247,248,250,1)
      LoadingSpinnerColor: =RGBA(91,59,127,1)
      OnVisible: =Set(varPlannerView,"Week")
    Children:
      - conPlannerWeekRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(247,248,250,1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - btnPlannerWeekPersistSelected:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Save selected meeting and planning state"
                  Height: =0
                  OnSelect: |-
                    =Set(varPlannerPersistenceStatus,"Saving planning changes");
                    Clear(colPlannerPersistenceErrors);
                    With(
                      {plannerEvent:LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId && PlanYear=varPlannerYear),yearPrefix:"LSSPLN1|"&Text(varPlannerYear)&"|"},
                      If(
                        !IsBlank(plannerEvent.EventId),
                        With(
                          {eventKey:yearPrefix&"E|"&plannerEvent.EventId,eventPayload:JSON({EventId:plannerEvent.EventId,RuleSlotId:plannerEvent.RuleSlotId,RuleFingerprint:plannerEvent.RuleFingerprint,EventType:plannerEvent.EventType,GeneratedDate:Text(plannerEvent.GeneratedDate,"yyyy-mm-dd"),OriginalGeneratedDate:Text(plannerEvent.OriginalGeneratedDate,"yyyy-mm-dd"),AutoAdjusted:plannerEvent.AutoAdjusted,AdjustmentReason:plannerEvent.AdjustmentReason,AdjustmentSourceName:plannerEvent.AdjustmentSourceName,ChipText:plannerEvent.ChipText,SchedulingSource:plannerEvent.SchedulingSource,IsManualOverride:plannerEvent.IsManualOverride,PlanningLayer:plannerEvent.PlanningLayer,SourceType:plannerEvent.SourceType,Category:plannerEvent.Category,WarningAcknowledged:plannerEvent.WarningAcknowledged})},
                          With(
                            {savedEvent:LookUp(colPlannerStoredRows,Code=eventKey)},
                            IfError(
                              With(
                                {writtenEvent:Patch('LSS Test Planned Calendar 20260921',If(IsBlank(savedEvent.ID),Defaults('LSS Test Planned Calendar 20260921'),savedEvent),{Title:plannerEvent.EventName,Code:eventKey,EventDate:plannerEvent.EventDate,StartTime:Text(plannerEvent.StartTime,"h:mm AM/PM"),Duration:Text(plannerEvent.DurationMinutes),Category:"PLNR_EVENT",SourceRule:plannerEvent.SourceRuleId,Status:plannerEvent.DecisionStatus,ReadyforOutlook:false,PlanningNotes:eventPayload})},
                                If(IsBlank(savedEvent.ID),Collect(colPlannerStoredRows,writtenEvent),Patch(colPlannerStoredRows,savedEvent,writtenEvent))
                              ),
                              Collect(colPlannerPersistenceErrors,{Key:eventKey,Message:FirstError.Message});Blank()
                            )
                          )
                        )
                      );
                      ForAll(
                        colPlannerLayerState As plannerLayer,
                        With(
                          {layerKey:yearPrefix&"L|"&Text(plannerLayer.StepNumber),layerPayload:JSON({ConfirmedAt:Text(plannerLayer.ConfirmedAt,"yyyy-mm-dd hh:mm:ss"),LastGeneratedAt:Text(plannerLayer.LastGeneratedAt,"yyyy-mm-dd hh:mm:ss"),NeedsRegeneration:plannerLayer.NeedsRegeneration})},
                          With(
                            {savedLayer:LookUp(colPlannerStoredRows,Code=layerKey)},
                            If(
                              IsBlank(savedLayer.ID) || savedLayer.Status<>plannerLayer.Status || savedLayer.PlanningNotes<>layerPayload,
                              IfError(
                                With(
                                  {writtenLayer:Patch('LSS Test Planned Calendar 20260921',If(IsBlank(savedLayer.ID),Defaults('LSS Test Planned Calendar 20260921'),savedLayer),{Title:plannerLayer.PlanningLayer,Code:layerKey,EventDate:Date(varPlannerYear,1,1),Category:"PLNR_LAYER",SourceRule:Text(plannerLayer.StepNumber),Status:plannerLayer.Status,ReadyforOutlook:false,PlanningNotes:layerPayload})},
                                  If(IsBlank(savedLayer.ID),Collect(colPlannerStoredRows,writtenLayer),Patch(colPlannerStoredRows,savedLayer,writtenLayer))
                                ),
                                Collect(colPlannerPersistenceErrors,{Key:layerKey,Message:FirstError.Message});Blank()
                              )
                            )
                          )
                        )
                      )
                    );
                    Set(varPlannerPersistenceStatus,If(CountRows(colPlannerPersistenceErrors)=0,"Saved to shared planner","Save incomplete — "&Text(CountRows(colPlannerPersistenceErrors))&" record(s) failed"))
                  Text: =""
                  Visible: =false
                  Width: =0
            - conPlannerWeekHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<640,228,92)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =If(App.Width<640,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =14
                  PaddingLeft: =18
                  PaddingRight: =18
                  PaddingTop: =14
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                Children:
                  - txtPlannerWeekTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Calendar Planner week view for " & Text(varPlannerYear)
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(31,41,55,1)
                        FillPortions: =If(App.Width<640,0,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =25
                        Text: ="Calendar Planner " & Text(varPlannerYear)
                        Wrap: =false
                  - btnPlannerWeekToYear:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Show year view"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(91,59,127,1)
                        Height: =44
                        LayoutMinWidth: =90
                        OnSelect: =Set(varPlannerView,"Year");Navigate(CalendarPlanner,ScreenTransition.None)
                        Text: ="Year"
                        Width: =If(App.Width<640,Parent.Width-36,100)
                  - btnPlannerWeekToMonth:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Show month view"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(91,59,127,1)
                        Height: =44
                        LayoutMinWidth: =90
                        OnSelect: =Set(varPlannerView,"Month");Navigate(CalendarPlannerMonth,ScreenTransition.None)
                        Text: ="Month"
                        Width: =If(App.Width<640,Parent.Width-36,100)
                  - btnPlannerWeekCurrent:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Week view selected"
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =RGBA(91,59,127,1)
                        Height: =44
                        LayoutMinWidth: =90
                        Text: ="Week"
                        Width: =If(App.Width<640,Parent.Width-36,100)
            - conPlannerWeekActions:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(App.Width<520,144,44)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =If(App.Width<520,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - btnPlannerWeekAddAlwaysVisible:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Add a one-time meeting"
                        BasePaletteColor: =RGBA(91,59,127,1)
                        Height: =40
                        LayoutMinWidth: =112
                        OnSelect: =Select(btnPlannerWeekAdd)
                        Text: ="Add meeting"
                        Width: =If(App.Width<520,Parent.Width,128)
                  - btnPlannerWeekBlockAlwaysVisible:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Block a day"
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(154,91,0,1)
                        Height: =40
                        LayoutMinWidth: =100
                        OnSelect: =Select(btnPlannerWeekBlock)
                        Text: ="Block day"
                        Width: =If(App.Width<520,Parent.Width,112)
                  - btnPlannerWeekNeedsAttention:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Show unresolved calendar decisions"
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(154,91,0,1)
                        DisplayMode: =If(CountIf(colCalProofEvents,PlanYear=varPlannerYear && !IsDeleted && DecisionStatus="NeedsReview")=0,DisplayMode.Disabled,DisplayMode.Edit)
                        Height: =40
                        LayoutMinWidth: =150
                        OnSelect: |-
                          =With(
                            {firstIssue:First(SortByColumns(Filter(colCalProofEvents,PlanYear=varPlannerYear && !IsDeleted && DecisionStatus="NeedsReview"),"EventDate",SortOrder.Ascending))},
                            Set(varPlannerSelectedEventId,"");
                            Set(varPlannerSelectedClosureId,"");
                            If(!IsBlank(firstIssue.EventId),Set(varPlannerFocusedDate,firstIssue.EventDate));
                            Set(varPlannerContextMode,"Attention")
                          )
                        Text: ="Needs attention" & If(CountIf(colCalProofEvents,PlanYear=varPlannerYear && !IsDeleted && DecisionStatus="NeedsReview")>0," · " & Text(CountIf(colCalProofEvents,PlanYear=varPlannerYear && !IsDeleted && DecisionStatus="NeedsReview")),"")
                        Width: =If(App.Width<520,Parent.Width,156)
            - conPlannerWeekToolbar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<480,152,App.Width<600,104,56)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =6
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =true
                  PaddingBottom: =9
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =9
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - txtPlanWkShowLabel:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="Calendar visibility filters"
                        AlignInContainer: =AlignInContainer.Center
                        Color: =RGBA(102,112,133,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        LayoutMinWidth: =48
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: ="Show:"
                        Width: =48
                        Wrap: =false
                  - chkPlannerWeekOperations:
                      Control: ModernCheckbox
                      Properties:
                        AccessibleLabel: ="Toggle operations meetings"
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =RGBA(59,111,88,1)
                        Default: =varPlannerShowOperations
                        Height: =36
                        Label: ="Operations "&Text(CountIf(colCalProofEvents,PlanYear=varPlannerYear && PlanningLayer="Organization & Operations" && !IsDeleted))
                        LayoutMinWidth: =142
                        OnCheck: =Set(varPlannerShowOperations,true)
                        OnUncheck: =Set(varPlannerShowOperations,false)
                  - chkPlannerWeekSpecial:
                      Control: ModernCheckbox
                      Properties:
                        AccessibleLabel: ="Toggle one-time and special events"
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =RGBA(168,95,16,1)
                        Default: =varPlannerShowManual
                        Height: =36
                        Label: ="One-time "&Text(CountIf(colCalProofEvents,PlanYear=varPlannerYear && SourceType="Manual" && !IsDeleted))
                        LayoutMinWidth: =118
                        OnCheck: =Set(varPlannerShowManual,true)
                        OnUncheck: =Set(varPlannerShowManual,false)
                  - chkPlannerWeekBoard:
                      Control: ModernCheckbox
                      Properties:
                        AccessibleLabel: ="Toggle Board meetings"
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =RGBA(62,93,138,1)
                        Default: =varPlannerShowBoard
                        Height: =36
                        Label: ="Board "&Text(CountIf(colCalProofEvents,PlanYear=varPlannerYear && PlanningLayer="Board" && !IsDeleted))
                        LayoutMinWidth: =116
                        OnCheck: =Set(varPlannerShowBoard,true)
                        OnUncheck: =Set(varPlannerShowBoard,false)
                  - chkPlannerWeekExecutive:
                      Control: ModernCheckbox
                      Properties:
                        AccessibleLabel: ="Toggle executive meetings"
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =RGBA(91,59,127,1)
                        Default: =varPlannerShowExecutive
                        Height: =36
                        Label: ="Executive "&Text(CountIf(colCalProofEvents,PlanYear=varPlannerYear && PlanningLayer="Executive Leadership" && !IsDeleted))
                        LayoutMinWidth: =132
                        OnCheck: =Set(varPlannerShowExecutive,true)
                        OnUncheck: =Set(varPlannerShowExecutive,false)
                  - chkPlannerWeekCommittees:
                      Control: ModernCheckbox
                      Properties:
                        AccessibleLabel: ="Toggle committee meetings"
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =RGBA(31,122,130,1)
                        Default: =varPlannerShowCommittees
                        Height: =36
                        Label: ="Committees "&Text(CountIf(colCalProofEvents,PlanYear=varPlannerYear && PlanningLayer="Board Committees" && !IsDeleted))
                        LayoutMinWidth: =146
                        OnCheck: =Set(varPlannerShowCommittees,true)
                        OnUncheck: =Set(varPlannerShowCommittees,false)
                  - btnPlannerWeekAdd:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Add a meeting"
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =RGBA(91,59,127,1)
                        Height: =44
                        LayoutMinWidth: =112
                        OnSelect: |-
                          =Set(varPlannerContextMode,"Add");
                          Set(varPlannerSelectedEventId,"");
                          Set(varPlannerAddKind,"One-time meeting");
                          Set(varPlannerDraftRuleId,Blank());
                          Set(varPlannerDraftName,"");
                          Set(varPlannerDraftLayer,varPlannerActiveLayer);
                          Set(varPlannerDraftCategory,"Special event");
                          Set(varPlannerDraftDate,varPlannerFocusedDate);
                          Set(varPlannerDraftStart,Time(9,0,0));
                          Set(varPlannerDraftDuration,60);
                          Set(varPlannerWarningAcknowledged,false);
                          Set(varPlannerDraftDirty,true);
                          Set(varPlannerEditorFromView,"Week");
                          Navigate(CalendarPlanner,ScreenTransition.None)
                        Text: ="Add meeting"
                        Visible: =false
                        Width: =0
                  - btnPlannerWeekBlock:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Block a day"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =RGBA(154,91,0,1)
                        Height: =44
                        LayoutMinWidth: =100
                        OnSelect: =Set(varPlannerContextMode,"Block");Set(varPlannerDraftDate,varPlannerFocusedDate);Set(varPlannerOverrideReason,"");Set(varPlannerDraftDirty,true);Set(varPlannerEditorFromView,"Week");Navigate(CalendarPlanner,ScreenTransition.None)
                        Text: ="Block day"
                        Visible: =false
                        Width: =0
            - conPlannerWeekWorkspace:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(App.Width<1180,1640,820)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width<1180,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conPlannerWeekCalendar:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(203,213,225,1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255,255,255,1)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                      Children:
                        - conPlannerWeekNav:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - btnPlannerWeekPrevious:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Previous week"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =RGBA(91,59,127,1)
                                    Height: =40
                                    OnSelect: =Set(varPlannerFocusedDate,DateAdd(varPlannerFocusedDate,-7,TimeUnit.Days));Set(varPlannerYear,Year(varPlannerFocusedDate));If(varPlannerHydratedYear<>varPlannerYear,Set(varPlannerReturnAfterHydrate,"Week");Navigate(CalendarPlanner,ScreenTransition.None))
                                    Text: ="‹"
                                    Width: =44
                              - txtPlannerWeekRange:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(31,41,55,1)
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =40
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =20
                                    Text: =Text(DateAdd(varPlannerFocusedDate,1-Weekday(varPlannerFocusedDate,StartOfWeek.Monday),TimeUnit.Days),"mmm d") & " – " & Text(DateAdd(varPlannerFocusedDate,7-Weekday(varPlannerFocusedDate,StartOfWeek.Monday),TimeUnit.Days),"mmm d, yyyy")
                                    Wrap: =false
                              - btnPlannerWeekNext:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Next week"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =RGBA(91,59,127,1)
                                    Height: =40
                                    OnSelect: =Set(varPlannerFocusedDate,DateAdd(varPlannerFocusedDate,7,TimeUnit.Days));Set(varPlannerYear,Year(varPlannerFocusedDate));If(varPlannerHydratedYear<>varPlannerYear,Set(varPlannerReturnAfterHydrate,"Week");Navigate(CalendarPlanner,ScreenTransition.None))
                                    Text: ="›"
                                    Width: =44
                        - galPlannerWeekGrid:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="Seven day week calendar"
                              DelayItemLoading: =false
                              Items: =AddColumns(Sequence(7),CellDate,DateAdd(varPlannerFocusedDate,Value-Weekday(varPlannerFocusedDate,StartOfWeek.Monday),TimeUnit.Days))
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LoadingSpinner: =LoadingSpinner.None
                              Selectable: =false
                              ShowScrollbar: =false
                              TabIndex: =0
                              TemplatePadding: =3
                              TemplateSize: =Parent.Height-6
                              WrapCount: =7
                            Children:
                              - conPlannerWeekCell:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: |-
                                      =If(
                                        CountIf(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive)>0,RGBA(180,35,24,1),
                                        CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && !IsDeleted && AutoAdjusted && DecisionStatus="NeedsReview" && ((SourceType="Manual" && varPlannerShowManual)||(SourceType<>"Manual" && ((PlanningLayer="Board" && varPlannerShowBoard)||(PlanningLayer="Board Committees" && varPlannerShowCommittees)||(PlanningLayer="Executive Leadership" && varPlannerShowExecutive)||(PlanningLayer="Organization & Operations" && varPlannerShowOperations)||(PlanningLayer="General" && varPlannerShowGeneral)))))>0,RGBA(154,91,0,1),
                                        DateValue(ThisItem.CellDate)=DateValue(varPlannerFocusedDate),RGBA(91,59,127,1),
                                        RGBA(203,213,225,1)
                                      )
                                    BorderThickness: =If(CountIf(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive)>0 || CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && !IsDeleted && AutoAdjusted && DecisionStatus="NeedsReview" && ((SourceType="Manual" && varPlannerShowManual)||(SourceType<>"Manual" && ((PlanningLayer="Board" && varPlannerShowBoard)||(PlanningLayer="Board Committees" && varPlannerShowCommittees)||(PlanningLayer="Executive Leadership" && varPlannerShowExecutive)||(PlanningLayer="Organization & Operations" && varPlannerShowOperations)||(PlanningLayer="General" && varPlannerShowGeneral)))))>0 || DateValue(ThisItem.CellDate)=DateValue(varPlannerFocusedDate),2,1)
                                    DropShadow: =DropShadow.None
                                    Fill: |-
                                      =If(
                                        CountIf(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive)>0,RGBA(254,242,242,1),
                                        CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && !IsDeleted && AutoAdjusted && DecisionStatus="NeedsReview" && ((SourceType="Manual" && varPlannerShowManual)||(SourceType<>"Manual" && ((PlanningLayer="Board" && varPlannerShowBoard)||(PlanningLayer="Board Committees" && varPlannerShowCommittees)||(PlanningLayer="Executive Leadership" && varPlannerShowExecutive)||(PlanningLayer="Organization & Operations" && varPlannerShowOperations)||(PlanningLayer="General" && varPlannerShowGeneral)))))>0,RGBA(255,251,235,1),
                                        RGBA(255,255,255,1)
                                      )
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - btnPlanWkSelectDate:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: ="Select " & Text(ThisItem.CellDate,"dddd, mmmm d, yyyy")
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =ButtonAppearance.Subtle
                                          BasePaletteColor: =RGBA(91,59,127,1)
                                          Height: =48
                                          LayoutMinWidth: =0
                                          OnSelect: =Set(varPlannerFocusedDate,ThisItem.CellDate);Set(varPlannerSelectedEventId,Blank());Set(varPlannerSelectedClosureId,Blank());Set(varPlannerReceipt,"");Set(varPlannerContextMode,"Date")
                                          Text: =Text(ThisItem.CellDate,"ddd") & Char(10) & Text(ThisItem.CellDate,"mmm d")
                                    - btnPlannerWeekCellClosure:
                                        Control: ModernButton
                                        Properties:
                                          AccessibleLabel: =LookUp(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive,ClosureName)
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(180,35,24,1)
                                          Height: =34
                                          LayoutMinWidth: =0
                                          OnSelect: =Set(varPlannerSelectedClosureId,LookUp(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive,ClosureId));Set(varPlannerFocusedDate,ThisItem.CellDate);Set(varPlannerContextMode,"Closure");Set(varPlannerEditorFromView,"Week");Navigate(CalendarPlanner,ScreenTransition.None)
                                          Text: =LookUp(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive,ClosureLabel)
                                          Visible: =CountIf(colCalProofClosures,ClosureDate=ThisItem.CellDate && IsActive)>0
                                    - galPlannerWeekCellEvents:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AccessibleLabel: ="Meetings on " & Text(ThisItem.CellDate,"mmmm d")
                                          DelayItemLoading: =false
                                          Items: =SortByColumns(Filter(colCalProofEvents,PlanYear=varPlannerYear && EventDate=ThisItem.CellDate && !IsDeleted && PlannerEventIsVisible(EventId)),"StartTime",SortOrder.Ascending)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          LoadingSpinner: =LoadingSpinner.None
                                          ShowScrollbar: =false
                                          TabIndex: =0
                                          TemplatePadding: =2
                                          TemplateSize: =62
                                        Children:
                                          - btnPlannerWeekCellEvent:
                                              Control: ModernButton
