                                          CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventId<>varPlannerSelectedEventId && EventDate=varPlannerDraftDate && StartTime<Time(0,0,0)+Time(0,varPlannerDraftDuration,0)+candidateStart && EndTime>candidateStart)>0,
                                          "Warning: this overlaps another planned meeting.",
                                          LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,SourceType)="Generated" && (varPlannerDraftDate<>LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventDate) || candidateStart<>LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,StartTime) || varPlannerDraftDuration<>LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,DurationMinutes)),
                                          "This move differs from the generated cadence. Review before confirming.",
                                          "This time works."
                                        )
                                      )
                              - btnPlannerWeekSaveMove:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Confirm move"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BasePaletteColor: =RGBA(91,59,127,1)
                                    DisplayMode: |-
                                      =With(
                                        {candidateStart:If(IsBlank(drpPlannerWeekMoveTime.Selected.Value),varPlannerDraftStart,TimeValue(drpPlannerWeekMoveTime.Selected.Value))},
                                        If(
                                          LookUp(colPlannerLayerState,PlanningLayer=LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,PlanningLayer),Status)="Confirmed" ||
                                          IsPlannerHardStop(varPlannerDraftDate) ||
                                          (varPlannerDraftDate=LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventDate) && candidateStart=LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,StartTime) && varPlannerDraftDuration=LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,DurationMinutes)) ||
                                          CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventId<>varPlannerSelectedEventId && EventDate=varPlannerDraftDate && StartTime<Time(0,0,0)+Time(0,varPlannerDraftDuration,0)+candidateStart && EndTime>candidateStart)>0,
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                        )
                                      )
                                    Height: =44
                                    OnSelect: |-
                                      =With(
                                        {selectedEvent:LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId)},
                                        With(
                                          {previousDate:selectedEvent.EventDate,previousStart:selectedEvent.StartTime,previousEnd:selectedEvent.EndTime,previousStatus:selectedEvent.DecisionStatus,originalGeneratedDate:selectedEvent.OriginalGeneratedDate,eventName:selectedEvent.EventName,eventId:selectedEvent.EventId},
                                          ClearCollect(colPlannerUndo,{Action:"Move",SubjectId:eventId,EventName:eventName,PreviousDate:previousDate,PreviousStart:previousStart,PreviousEnd:previousEnd,PreviousStatus:previousStatus,PreviousActive:false,SnapshotEvent:selectedEvent,SnapshotClosure:First(colCalProofClosures)});
                                          With(
                                            {updatedEvent:Patch(colCalProofEvents,selectedEvent,{EventDate:varPlannerDraftDate,CurrentDate:varPlannerDraftDate,StartTime:varPlannerDraftStart,EndTime:DateAdd(varPlannerDraftStart,varPlannerDraftDuration,TimeUnit.Minutes),DurationMinutes:varPlannerDraftDuration,IsManualOverride:true,DecisionStatus:"Approved",WarningAcknowledged:true})},
                                            With(
                                              {changedState:LookUp(colPlannerLayerState,PlanningLayer=updatedEvent.PlanningLayer)},
                                              UpdateIf(colPlannerLayerState,StepNumber>changedState.StepNumber && Status<>"Not started",{Status:"Needs revalidation",NeedsRegeneration:true})
                                            );
                                            Set(varPlannerReceipt,updatedEvent.EventName & " moved from " & Text(previousDate,"mmm d") & " at " & Text(previousStart,"h:mm AM/PM") & " to " & Text(updatedEvent.EventDate,"mmm d") & " at " & Text(updatedEvent.StartTime,"h:mm AM/PM") & ". Original generated date remains " & Text(updatedEvent.OriginalGeneratedDate,"mmm d") & ".");
                                            ClearCollect(colPlannerMutationReceipt,{ReceiptType:"Move",SubjectId:updatedEvent.EventId,EventName:updatedEvent.EventName,SourceType:updatedEvent.SourceType,SourceRuleId:updatedEvent.SourceRuleId,PlanningLayer:updatedEvent.PlanningLayer,Category:updatedEvent.Category,EventDate:updatedEvent.EventDate,StartTime:updatedEvent.StartTime,DurationMinutes:updatedEvent.DurationMinutes,DecisionStatus:updatedEvent.DecisionStatus,Summary:varPlannerReceipt,OccurredAt:Now()});
                                            Collect(colPlannerHistory,{ChangeId:"CHG-" & Text(Now(),"yyyymmddhhmmss"),Action:"Move",SubjectId:updatedEvent.EventId,Summary:varPlannerReceipt,ChangedAt:Now()})
                                          )
                                        )
                                      );
                                      Set(varPlannerFocusedDate,varPlannerDraftDate);
                                      Set(varPlannerDraftDirty,false);
                                      Set(varPlannerContextMode,"Summary");
                                      Select(btnPlannerWeekPersistSelected)
                                    Text: ="Confirm move"
                                    Width: =Parent.Width
                              - btnPlannerWeekCancelMove:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Cancel move"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(102,112,133,1)
                                    Height: =42
                                    OnSelect: =Set(varPlannerDraftDirty,false);Set(varPlannerContextMode,"Summary")
                                    Text: ="Cancel"
                                    Width: =Parent.Width
                        - txtPlannerWeekReceipt:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(37,122,84,1)
                              Fill: =RGBA(240,253,244,1)
                              Font: =Font.'Segoe UI'
                              Height: =90
                              LayoutMinWidth: =0
                              PaddingBottom: =8
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =8
                              Size: =12
                              Text: ="✓ " & If(CountRows(colPlannerMutationReceipt)>0 && First(colPlannerMutationReceipt).SubjectId=varPlannerSelectedEventId,First(colPlannerMutationReceipt).Summary,varPlannerReceipt)
                              Visible: =varPlannerContextMode="Summary" && !IsBlank(varPlannerReceipt)
                        - conPlannerWeekDelete:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =244
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =varPlannerContextMode="Delete"
                            Children:
                              - txtPlannerWeekDeleteTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(31,41,55,1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =48
                                    LayoutMinWidth: =0
                                    Size: =23
                                    Text: ="Delete " & LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventName) & "?"
                              - txtPlannerWeekDeleteHelp:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(102,112,133,1)
                                    Height: =64
                                    LayoutMinWidth: =0
                                    Size: =13
                                    Text: =If(LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,SourceType)="Generated","This generated occurrence will be excluded so regeneration does not recreate it.","This manual meeting will be removed. You can undo immediately afterward.")
                              - btnPlannerWeekConfirmDelete:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Confirm delete meeting"
                                    BasePaletteColor: =RGBA(180,35,24,1)
                                    Height: =44
                                    OnSelect: |-
                                      =With(
                                        {selectedEvent:LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId)},
                                        ClearCollect(colPlannerUndo,{Action:"Delete",SubjectId:selectedEvent.EventId,EventName:selectedEvent.EventName,PreviousDate:selectedEvent.EventDate,PreviousStart:selectedEvent.StartTime,PreviousEnd:selectedEvent.EndTime,PreviousStatus:selectedEvent.DecisionStatus,PreviousActive:false,SnapshotEvent:selectedEvent,SnapshotClosure:First(colCalProofClosures)});
                                        If(selectedEvent.SourceType="Generated",Collect(colPlannerExclusions,{ExclusionId:"EXC-" & selectedEvent.EventId,EventId:selectedEvent.EventId,RuleSlotId:Coalesce(selectedEvent.RuleSlotId,selectedEvent.EventId),SourceRuleId:selectedEvent.SourceRuleId,EventName:selectedEvent.EventName,OriginalGeneratedDate:selectedEvent.OriginalGeneratedDate,MappingDecision:"",PlanYear:selectedEvent.PlanYear,Reason:"Deleted by user",CreatedAt:Now()}));
                                        RemoveIf(colCalProofEvents,EventId=selectedEvent.EventId);
                                        With({changedState:LookUp(colPlannerLayerState,PlanningLayer=selectedEvent.PlanningLayer)},UpdateIf(colPlannerLayerState,StepNumber>changedState.StepNumber && Status<>"Not started",{Status:"Needs revalidation",NeedsRegeneration:true}));
                                        Set(varPlannerReceipt,selectedEvent.EventName & " deleted. Undo is available.");
                                        ClearCollect(colPlannerMutationReceipt,{ReceiptType:"Delete",SubjectId:selectedEvent.EventId,EventName:selectedEvent.EventName,SourceType:selectedEvent.SourceType,SourceRuleId:selectedEvent.SourceRuleId,PlanningLayer:selectedEvent.PlanningLayer,Category:selectedEvent.Category,EventDate:selectedEvent.EventDate,StartTime:selectedEvent.StartTime,DurationMinutes:selectedEvent.DurationMinutes,DecisionStatus:"Deleted",Summary:varPlannerReceipt,OccurredAt:Now()});
                                        Collect(colPlannerHistory,{ChangeId:"CHG-" & Text(Now(),"yyyymmddhhmmss"),Action:"Delete",SubjectId:selectedEvent.EventId,Summary:varPlannerReceipt,ChangedAt:Now()})
                                      );
                                      Set(varPlannerSelectedEventId,"");
                                      Set(varPlannerContextMode,"Empty");
                                      Select(btnPlannerWeekPersistSelected)
                                    Text: ="Delete meeting"
                                    Width: =Parent.Width
                              - btnPlannerWeekCancelDelete:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Cancel delete"
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(102,112,133,1)
                                    Height: =42
                                    OnSelect: =Set(varPlannerContextMode,"Summary")
                                    Text: ="Cancel"
                                    Width: =Parent.Width
