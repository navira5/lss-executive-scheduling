Screens:
  BoardRulesReview:
    Properties:
      Fill: =RGBA(247,248,250,1)
      LoadingSpinnerColor: =RGBA(91,59,127,1)
      OnVisible: |-
        =If(

            IsBlank(LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId && PlanningLayer=varPlannerActiveLayer).RuleId),
            Set(varBrvSelectedRuleId,First(SortByColumns(Filter(colMeetingRulebook,PlanningLayer=varPlannerActiveLayer),"SortOrder",SortOrder.Ascending)).RuleId)
        );
        With(
            {monthsText:LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).MonthsText},
            ClearCollect(
                colBrvMonthSelection,
                {MonthNumber:1,MonthName:"January",IsSelected:"January" in monthsText},
                {MonthNumber:2,MonthName:"February",IsSelected:"February" in monthsText},
                {MonthNumber:3,MonthName:"March",IsSelected:"March" in monthsText},
                {MonthNumber:4,MonthName:"April",IsSelected:"April" in monthsText},
                {MonthNumber:5,MonthName:"May",IsSelected:"May" in monthsText},
                {MonthNumber:6,MonthName:"June",IsSelected:"June" in monthsText},
                {MonthNumber:7,MonthName:"July",IsSelected:"July" in monthsText},
                {MonthNumber:8,MonthName:"August",IsSelected:"August" in monthsText},
                {MonthNumber:9,MonthName:"September",IsSelected:"September" in monthsText},
                {MonthNumber:10,MonthName:"October",IsSelected:"October" in monthsText},
                {MonthNumber:11,MonthName:"November",IsSelected:"November" in monthsText},
                {MonthNumber:12,MonthName:"December",IsSelected:"December" in monthsText}
            )
        );
        Set(varBrvReceiptVisible,false);
        Set(varBrvSaveAttempted,false);
        Set(varBrvShowDetails,false)
    Children:
      - conBrvRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(247,248,250,1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =If(App.Width<760,16,24)
            PaddingLeft: =If(App.Width<760,16,24)
            PaddingRight: =If(App.Width<760,16,24)
            PaddingTop: =If(App.Width<760,16,24)
            Width: =Parent.Width
          Children:
            - btnBrvPersistLayerState:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Save layer regeneration status"
                  Height: =0
                  OnSelect: |-
                    =Clear(colPlannerPersistenceErrors);
                    ForAll(
                      colPlannerLayerState As plannerLayer,
                      With(
                        {layerKey:"LSSPLN1|"&Text(varPlannerYear)&"|L|"&Text(plannerLayer.StepNumber),layerPayload:JSON({ConfirmedAt:Text(plannerLayer.ConfirmedAt,"yyyy-mm-dd hh:mm:ss"),LastGeneratedAt:Text(plannerLayer.LastGeneratedAt,"yyyy-mm-dd hh:mm:ss"),NeedsRegeneration:plannerLayer.NeedsRegeneration})},
                        With(
                          {savedLayer:IfError(Patch('LSS Test Planned Calendar 20260921',With({existingLayer:LookUp(colPlannerStoredRows,Code=layerKey)},If(IsBlank(existingLayer.ID),Defaults('LSS Test Planned Calendar 20260921'),existingLayer)),{Title:plannerLayer.PlanningLayer,Code:layerKey,EventDate:Date(varPlannerYear,1,1),Category:"PLNR_LAYER",SourceRule:Text(plannerLayer.StepNumber),Status:plannerLayer.Status,ReadyforOutlook:false,PlanningNotes:layerPayload}),Blank())},
                          If(IsBlank(savedLayer.ID),Collect(colPlannerPersistenceErrors,{Key:layerKey,Message:"Layer state was not saved"}),RemoveIf(colPlannerStoredRows,Code=layerKey);Collect(colPlannerStoredRows,savedLayer))
                        )
                      )
                    );
                    If(CountRows(colPlannerPersistenceErrors)>0,Set(varPlannerPersistenceStatus,"Rule saved, but planning state failed to save"),Set(varPlannerPersistenceStatus,"Rule and planning state saved"))
                  Text: =""
                  Visible: =false
                  Width: =0
            - btnBrvRefreshMonthSelection:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Refresh selected months for the current rule"
                  Height: =0
                  OnSelect: |-
                    =With(
                      {monthsText:LookUp(colMeetingRulebook,RuleId=varBrvSelectedRuleId).MonthsText},
                      ClearCollect(
                        colBrvMonthSelection,
                        {MonthNumber:1,MonthName:"January",IsSelected:"January" in monthsText},
                        {MonthNumber:2,MonthName:"February",IsSelected:"February" in monthsText},
                        {MonthNumber:3,MonthName:"March",IsSelected:"March" in monthsText},
                        {MonthNumber:4,MonthName:"April",IsSelected:"April" in monthsText},
                        {MonthNumber:5,MonthName:"May",IsSelected:"May" in monthsText},
                        {MonthNumber:6,MonthName:"June",IsSelected:"June" in monthsText},
                        {MonthNumber:7,MonthName:"July",IsSelected:"July" in monthsText},
                        {MonthNumber:8,MonthName:"August",IsSelected:"August" in monthsText},
                        {MonthNumber:9,MonthName:"September",IsSelected:"September" in monthsText},
                        {MonthNumber:10,MonthName:"October",IsSelected:"October" in monthsText},
                        {MonthNumber:11,MonthName:"November",IsSelected:"November" in monthsText},
                        {MonthNumber:12,MonthName:"December",IsSelected:"December" in monthsText}
