App:
  Properties:
    Formulas: |-
      =IsCalProofHardStop(dateToCheck: Date): Boolean =
        Weekday(dateToCheck,StartOfWeek.Monday)>5 ||
        CountIf(colCalProofClosures,ClosureDate=dateToCheck && IsActive)>0 ||
        CountIf(colCalProofHardStops,HardStopDate=dateToCheck)>0;

      GetNextCalProofBusinessDate(candidateDate: Date): Date =
        If(
          candidateDate>Date(2027,12,31),
          Blank(),
          With(
            {
              validDates:Filter(
                AddColumns(
                  Sequence(DateDiff(candidateDate,Date(2027,12,31),TimeUnit.Days)+1),
                  CandidateBusinessDate,
                  DateAdd(candidateDate,Value-1,TimeUnit.Days)
                ),
                !IsCalProofHardStop(CandidateBusinessDate)
              )
            },
            If(CountRows(validDates)=0,Blank(),First(validDates).CandidateBusinessDate)
          )
        );

      IsPlannerHardStop(dateToCheck: Date): Boolean =
        Weekday(dateToCheck,StartOfWeek.Monday)>5 ||
        CountIf(colCalProofClosures,ClosureDate=dateToCheck && IsActive)>0;

      PlannerHasActualOverlap(eventId: Text): Boolean =
        With(
          {candidate:LookUp(colCalProofEvents,EventId=eventId && !IsDeleted)},
          !IsBlank(candidate.EventId) &&
          CountIf(
            colCalProofEvents As otherEvent,
            otherEvent.PlanYear=candidate.PlanYear &&
            !otherEvent.IsDeleted &&
            otherEvent.EventId<>candidate.EventId &&
            otherEvent.EventDate=candidate.EventDate &&
            otherEvent.StartTime<candidate.EndTime &&
            otherEvent.EndTime>candidate.StartTime
          )>0
        );

      PlannerHasZeroGap(eventId: Text): Boolean =
        With(
          {candidate:LookUp(colCalProofEvents,EventId=eventId && !IsDeleted)},
          !IsBlank(candidate.EventId) &&
          CountIf(
            colCalProofEvents As otherEvent,
            otherEvent.PlanYear=candidate.PlanYear &&
            !otherEvent.IsDeleted &&
            otherEvent.EventId<>candidate.EventId &&
            otherEvent.EventDate=candidate.EventDate &&
            (otherEvent.StartTime=candidate.EndTime || otherEvent.EndTime=candidate.StartTime)
          )>0
        );

      PlannerEventNeedsReview(eventId: Text): Boolean =
        With(
          {candidate:LookUp(colCalProofEvents,EventId=eventId && !IsDeleted)},
          !IsBlank(candidate.EventId) && candidate.DecisionStatus="NeedsReview"
        );

      PlannerHasAttentionOnDate(targetDate: Date): Boolean =
        CountIf(
          colCalProofEvents,
          PlanYear=varPlannerYear &&
          EventDate=targetDate &&
          !IsDeleted &&
          DecisionStatus="NeedsReview"
        )>0;

      PlannerLayerIssueCount(layerName: Text): Number =
        CountIf(
          colCalProofEvents As plannerEvent,
          plannerEvent.PlanYear=varPlannerYear &&
          plannerEvent.PlanningLayer=layerName &&
          !plannerEvent.IsDeleted &&
          PlannerEventNeedsReview(plannerEvent.EventId)
        );

      PlannerFirstLayerIssueId(layerName: Text): Text =
        Coalesce(
          LookUp(
            colCalProofEvents As plannerEvent,
            plannerEvent.PlanYear=varPlannerYear &&
            plannerEvent.PlanningLayer=layerName &&
            !plannerEvent.IsDeleted &&
            PlannerEventNeedsReview(plannerEvent.EventId),
            plannerEvent.EventId
          ),
          ""
        );

      PlannerEventIsVisible(eventId: Text): Boolean =
        With(
          {candidate:LookUp(colCalProofEvents,EventId=eventId && !IsDeleted)},
          (
            candidate.SourceType="Manual" && varPlannerShowManual ||
            candidate.SourceType<>"Manual" && (
              candidate.PlanningLayer="Board" && varPlannerShowBoard ||
              candidate.PlanningLayer="Board Committees" && varPlannerShowCommittees ||
              candidate.PlanningLayer="Executive Leadership" && varPlannerShowExecutive ||
              candidate.PlanningLayer="Organization & Operations" && varPlannerShowOperations ||
              candidate.PlanningLayer="General" && varPlannerShowGeneral
            )
          ) && (varPlannerContextMode<>"Attention" || candidate.DecisionStatus="NeedsReview")
        );

      GetNextPlannerBusinessDate(candidateDate: Date,planYear: Number): Date =
        If(
          candidateDate>Date(planYear,12,31),
          Blank(),
          With(
            {
              validDates:Filter(
                AddColumns(
                  Sequence(DateDiff(candidateDate,Date(planYear,12,31),TimeUnit.Days)+1),
                  CandidateBusinessDate,
                  DateAdd(candidateDate,Value-1,TimeUnit.Days)
                ),
                !IsPlannerHardStop(CandidateBusinessDate)
              )
            },
            If(CountRows(validDates)=0,Blank(),First(validDates).CandidateBusinessDate)
          )
        );

      PlannerOccurrenceId(ruleId: Text,cadence: Text,occurrenceDate: Date,firstWeek: Text,firstDay: Text,startMonthNumber: Number): Text =
        ruleId & "-" & Text(Year(occurrenceDate)) & "-" &
        Switch(
          cadence,
          "One time","ONCE",
          "Annually","ANNUAL",
          "Twice a week","W" & Text(WeekNum(occurrenceDate,StartOfWeek.Monday),"00") & If(Weekday(occurrenceDate,StartOfWeek.Monday)=Switch(firstDay,"Monday",1,"Tuesday",2,"Wednesday",3,"Thursday",4,"Friday",5,"Saturday",6,"Sunday",7,1),"A","B"),
          "Weekly","W" & Text(WeekNum(occurrenceDate,StartOfWeek.Monday),"00"),
          "Every two weeks","W" & Text(WeekNum(occurrenceDate,StartOfWeek.Monday),"00"),
          "Twice a month","M" & Text(Month(occurrenceDate),"00") & If(Switch(firstWeek,"First",Day(occurrenceDate)<=7,"Second",Day(occurrenceDate)>=8 && Day(occurrenceDate)<=14,"Third",Day(occurrenceDate)>=15 && Day(occurrenceDate)<=21,"Fourth",Day(occurrenceDate)>=22 && Day(occurrenceDate)<=28,"Last",Month(DateAdd(occurrenceDate,7,TimeUnit.Days))<>Month(occurrenceDate),false),"A","B"),
          "Monthly","M" & Text(Month(occurrenceDate),"00"),
          "Every two months","S" & Text(RoundDown((Month(occurrenceDate)-startMonthNumber)/2,0)+1,"00"),
          "Quarterly","S" & Text(RoundDown((Month(occurrenceDate)-startMonthNumber)/3,0)+1,"00"),
          "Specific months","M" & Text(Month(occurrenceDate),"00"),
          "D" & Text(occurrenceDate,"mmdd")
        );

      PlannerRuleSlotId(ruleId: Text,cadence: Text,occurrenceDate: Date,firstWeek: Text,firstDay: Text,startMonthNumber: Number): Text =
        ruleId & "|" & Text(Year(occurrenceDate)) & "|" & cadence & "|" & If(
          cadence="Quarterly" || cadence="Every two months",
          "M" & Text(Month(occurrenceDate),"00"),
          PlannerOccurrenceId(ruleId,cadence,occurrenceDate,firstWeek,firstDay,startMonthNumber)
        );

      PlannerRuleFingerprint(ruleId: Text): Text =
        With(
          {rule:LookUp(colMeetingRulebook,RuleId=ruleId)},
          rule.RuleId & "|" & rule.MeetingName & "|" & rule.Cadence & "|" & rule.MonthsText & "|" & rule.StartMonth & "|" & rule.WeekOfMonth & "|" & rule.PreferredDay & "|" & rule.AnchorMonth & "|" & Text(rule.AnchorDay) & "|" & rule.SecondPreferredDay & "|" & rule.SecondWeekOfMonth & "|" & rule.StartTimeText & "|" & Text(rule.DurationMinutes) & "|" & rule.Format & "|" & rule.Flexibility
        );
