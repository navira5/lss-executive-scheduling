Screens:
  CalendarPlanner:
    Properties:
      Fill: |
        =RGBA(247,248,250,1)
      LoadingSpinnerColor: =RGBA(91,59,127,1)
      OnVisible: =If(varPlannerAutoConfirmReset,Set(varPlannerAutoConfirmReset,false);Select(btnPlanYrStartCleanConfirm),If(varPlannerStartupReady && !varPlannerHydrating,If(varPlannerHydratedYear<>varPlannerYear,Select(btnPlannerHydrateYear),If(varPlannerPendingAddAll,Set(varPlannerPendingAddAll,false);Select(btnPlanYrAddAllRules)))))
    Children:
      - txtPlannerLoadState:
          Control: ModernText
          Properties:
            AccessibleLabel: =Self.Text
            Height: =100
            Text: =If(StartsWith(varPlannerPersistenceStatus,"Could not load"),varPlannerPersistenceStatus,"Loading your saved plan…")
            Visible: =!varPlannerStartupReady
            Width: =Parent.Width-64
            X: =32
            Y: =32
      - btnPlannerRetryLoad:
          Control: ModernButton
          Properties:
            AccessibleLabel: ="Retry loading saved plan"
            Height: =44
            OnSelect: =Select(btnPlannerHydrateYear)
            Text: ="Retry loading"
            Visible: =StartsWith(varPlannerPersistenceStatus,"Could not load") && !varPlannerHydrating
            Width: =180
            X: =32
            Y: =140
      - conPlannerRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(247,248,250,1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Visible: =varPlannerStartupReady
            Width: =Parent.Width
          Children:
            - btnPlannerPersistYear:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Save planning changes"
                  AlignInContainer: =AlignInContainer.Start
                  Appearance: =ButtonAppearance.Outline
                  BasePaletteColor: =RGBA(247,248,250,1)
                  Height: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Set(varPlannerPersistenceStatus,"Saving planning changes");
                    Clear(colPlannerPersistenceErrors);
                    With(
                      {yearPrefix:"LSSPLN1|"&Text(varPlannerYear)&"|"},
                      If(
                        IsBlank(LookUp(colPlannerStoredRows,Category="PLNR_PLAN").ID),
                        IfError(
                          Patch('LSS Test Planned Calendar 20260921',Defaults('LSS Test Planned Calendar 20260921'),{Title:"LSS Planner "&Text(varPlannerYear),Code:yearPrefix&"P",EventDate:Date(varPlannerYear,1,1),Category:"PLNR_PLAN",Status:"Active",ReadyforOutlook:false,PlanningNotes:"Canvas planner v1"}),
                          Collect(colPlannerPersistenceErrors,{Key:yearPrefix&"P",Message:FirstError.Message});Blank()
                        )
                      );
                      ForAll(
                        Filter(colCalProofEvents,PlanYear=varPlannerYear && !IsDeleted && !IsBlank(EventDate)) As plannerEvent,
                        With(
                          {
                            eventKey:yearPrefix&"E|"&plannerEvent.EventId,
                            eventPayload:JSON({EventId:plannerEvent.EventId,RuleSlotId:plannerEvent.RuleSlotId,RuleFingerprint:plannerEvent.RuleFingerprint,EventType:plannerEvent.EventType,GeneratedDate:Text(plannerEvent.GeneratedDate,"yyyy-mm-dd"),OriginalGeneratedDate:Text(plannerEvent.OriginalGeneratedDate,"yyyy-mm-dd"),AutoAdjusted:plannerEvent.AutoAdjusted,AdjustmentReason:plannerEvent.AdjustmentReason,AdjustmentSourceName:plannerEvent.AdjustmentSourceName,ChipText:plannerEvent.ChipText,SchedulingSource:plannerEvent.SchedulingSource,IsManualOverride:plannerEvent.IsManualOverride,PlanningLayer:plannerEvent.PlanningLayer,SourceType:plannerEvent.SourceType,Category:plannerEvent.Category,WarningAcknowledged:plannerEvent.WarningAcknowledged}),
                            savedEvent:LookUp(colPlannerStoredRows,Code=yearPrefix&"E|"&plannerEvent.EventId)
                          },
                          If(
                            IsBlank(savedEvent.ID) || savedEvent.PlanningNotes<>eventPayload || savedEvent.EventDate<>plannerEvent.EventDate || savedEvent.StartTime<>Text(plannerEvent.StartTime,"h:mm AM/PM") || savedEvent.Duration<>Text(plannerEvent.DurationMinutes) || savedEvent.Status<>plannerEvent.DecisionStatus,
                            IfError(
                              Patch('LSS Test Planned Calendar 20260921',If(IsBlank(savedEvent.ID),Defaults('LSS Test Planned Calendar 20260921'),savedEvent),{Title:plannerEvent.EventName,Code:eventKey,EventDate:plannerEvent.EventDate,StartTime:Text(plannerEvent.StartTime,"h:mm AM/PM"),Duration:Text(plannerEvent.DurationMinutes),Category:"PLNR_EVENT",SourceRule:plannerEvent.SourceRuleId,Status:plannerEvent.DecisionStatus,ReadyforOutlook:false,PlanningNotes:eventPayload}),
                              Collect(colPlannerPersistenceErrors,{Key:eventKey,Message:FirstError.Message});Blank()
                            )
                          )
                        )
                      );
                      ForAll(
                        Filter(colPlannerStoredRows,Category="PLNR_EVENT" && Status<>"Deleted" && Status<>"Cleared") As savedEvent,
                        With(
                          {savedEventId:Mid(savedEvent.Code,Len(yearPrefix&"E|")+1)},
                          If(
                            IsBlank(LookUp(colCalProofEvents,PlanYear=varPlannerYear && EventId=savedEventId)),
                            IfError(Patch('LSS Test Planned Calendar 20260921',savedEvent,{Status:"Deleted"}),Collect(colPlannerPersistenceErrors,{Key:savedEvent.Code,Message:FirstError.Message});Blank())
                          )
                        )
                      );
                      ForAll(
                        Filter(colCalProofClosures,PlanYear=varPlannerYear) As plannerClosure,
                        With(
                          {closureKey:yearPrefix&"C|"&plannerClosure.ClosureId,closurePayload:JSON({ClosureId:plannerClosure.ClosureId,ClosureLabel:plannerClosure.ClosureLabel,ClosureType:plannerClosure.ClosureType,Source:plannerClosure.Source,OverrideReason:plannerClosure.OverrideReason}),savedClosure:LookUp(colPlannerStoredRows,Code=yearPrefix&"C|"&plannerClosure.ClosureId)},
                          If(
                            IsBlank(savedClosure.ID) || savedClosure.PlanningNotes<>closurePayload || savedClosure.EventDate<>plannerClosure.ClosureDate || savedClosure.Status<>If(plannerClosure.IsActive,"Active","Inactive"),
                            IfError(Patch('LSS Test Planned Calendar 20260921',If(IsBlank(savedClosure.ID),Defaults('LSS Test Planned Calendar 20260921'),savedClosure),{Title:plannerClosure.ClosureName,Code:closureKey,EventDate:plannerClosure.ClosureDate,Category:"PLNR_CLOSURE",Status:If(plannerClosure.IsActive,"Active","Inactive"),ReadyforOutlook:false,PlanningNotes:closurePayload}),Collect(colPlannerPersistenceErrors,{Key:closureKey,Message:FirstError.Message});Blank())
                          )
                        )
                      );
                      ForAll(
                        Filter(colPlannerExclusions,PlanYear=varPlannerYear) As plannerExclusion,
                        With(
                          {exclusionKey:yearPrefix&"X|"&plannerExclusion.EventId,exclusionPayload:JSON({RuleSlotId:plannerExclusion.RuleSlotId,SourceRuleId:plannerExclusion.SourceRuleId,EventName:plannerExclusion.EventName,OriginalGeneratedDate:Text(plannerExclusion.OriginalGeneratedDate,"yyyy-mm-dd"),MappingDecision:plannerExclusion.MappingDecision}),savedExclusion:LookUp(colPlannerStoredRows,Code=yearPrefix&"X|"&plannerExclusion.EventId)},
                          If(
                            IsBlank(savedExclusion.ID) || savedExclusion.Status<>"Active" || savedExclusion.Title<>plannerExclusion.Reason || savedExclusion.PlanningNotes<>exclusionPayload,
                            IfError(Patch('LSS Test Planned Calendar 20260921',If(IsBlank(savedExclusion.ID),Defaults('LSS Test Planned Calendar 20260921'),savedExclusion),{Title:plannerExclusion.Reason,Code:exclusionKey,EventDate:Date(varPlannerYear,1,1),Category:"PLNR_EXCLUSION",SourceRule:plannerExclusion.EventId,Status:"Active",ReadyforOutlook:false,PlanningNotes:exclusionPayload}),Collect(colPlannerPersistenceErrors,{Key:exclusionKey,Message:FirstError.Message});Blank())
                          )
                        )
                      );
                      ForAll(
                        Filter(colPlannerStoredRows,Category="PLNR_EXCLUSION" && Status="Active") As savedExclusion,
                        If(
                          IsBlank(LookUp(colPlannerExclusions,PlanYear=varPlannerYear && EventId=savedExclusion.SourceRule)),
                          IfError(Patch('LSS Test Planned Calendar 20260921',savedExclusion,{Status:"Deleted"}),Collect(colPlannerPersistenceErrors,{Key:savedExclusion.Code,Message:FirstError.Message});Blank())
                        )
                      );
                      ForAll(
                        colPlannerLayerState As plannerLayer,
                        With(
                          {layerKey:yearPrefix&"L|"&Text(plannerLayer.StepNumber),layerPayload:JSON({ConfirmedAt:Text(plannerLayer.ConfirmedAt,"yyyy-mm-dd hh:mm:ss"),LastGeneratedAt:Text(plannerLayer.LastGeneratedAt,"yyyy-mm-dd hh:mm:ss"),NeedsRegeneration:plannerLayer.NeedsRegeneration}),savedLayer:LookUp(colPlannerStoredRows,Code=yearPrefix&"L|"&Text(plannerLayer.StepNumber))},
                          If(
                            IsBlank(savedLayer.ID) || savedLayer.Status<>plannerLayer.Status || savedLayer.PlanningNotes<>layerPayload,
                            IfError(Patch('LSS Test Planned Calendar 20260921',If(IsBlank(savedLayer.ID),Defaults('LSS Test Planned Calendar 20260921'),savedLayer),{Title:plannerLayer.PlanningLayer,Code:layerKey,EventDate:Date(varPlannerYear,1,1),Category:"PLNR_LAYER",SourceRule:Text(plannerLayer.StepNumber),Status:plannerLayer.Status,ReadyforOutlook:false,PlanningNotes:layerPayload}),Collect(colPlannerPersistenceErrors,{Key:layerKey,Message:FirstError.Message});Blank())
                          )
                        )
                      )
                    );
                    Refresh('LSS Test Planned Calendar 20260921');
                    ClearCollect(colPlannerStoredRows,Filter('LSS Test Planned Calendar 20260921',Category="PLNR_EVENT" && EventDate>=Date(varPlannerYear,1,1) && EventDate<Date(varPlannerYear+1,1,1)));
                    Collect(colPlannerStoredRows,Filter('LSS Test Planned Calendar 20260921',Category="PLNR_CLOSURE" && EventDate>=Date(varPlannerYear,1,1) && EventDate<Date(varPlannerYear+1,1,1)));
                    Collect(colPlannerStoredRows,Filter('LSS Test Planned Calendar 20260921',Category="PLNR_EXCLUSION" && EventDate>=Date(varPlannerYear,1,1) && EventDate<Date(varPlannerYear+1,1,1)));
                    Collect(colPlannerStoredRows,Filter('LSS Test Planned Calendar 20260921',Category="PLNR_LAYER" && EventDate>=Date(varPlannerYear,1,1) && EventDate<Date(varPlannerYear+1,1,1)));
                    Collect(colPlannerStoredRows,Filter('LSS Test Planned Calendar 20260921',Category="PLNR_PLAN" && EventDate>=Date(varPlannerYear,1,1) && EventDate<Date(varPlannerYear+1,1,1)));
                    If(
                      CountRows(colPlannerPersistenceErrors)=0,
                      Set(varPlannerPersistenceStatus,"Saved to shared planner"),
                      Set(varPlannerPersistenceStatus,"Save incomplete — "&Text(CountRows(colPlannerPersistenceErrors))&" record(s) failed")
                    )
                  Text: =""
                  Visible: =false
                  Width: =0
            - btnPlannerRecomputeImpact:
                Control: ModernButton
                Properties:
                  AccessibleLabel: ="Recalculate rule-change impact"
                  AlignInContainer: =AlignInContainer.Start
                  Appearance: =ButtonAppearance.Outline
                  BasePaletteColor: =RGBA(247,248,250,1)
                  Height: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Clear(colPlannerLayerImpact);
                    ForAll(
                      colPlannerLayerPreview As proposedEvent,
                      With(
                        {priorEvent:LookUp(colCalProofEvents,PlanYear=varPlannerYear && EventId=proposedEvent.EventId)},
                        If(
                          IsBlank(priorEvent.EventId),
                          Collect(colPlannerLayerImpact,{ChangeType:"Add",EventName:proposedEvent.EventName,BeforeValue:"—",AfterValue:Text(proposedEvent.EventDate,"mmm d")&" "&Text(proposedEvent.StartTime,"h:mm AM/PM")}),
                          priorEvent.EventName<>proposedEvent.EventName || priorEvent.EventDate<>proposedEvent.EventDate || priorEvent.StartTime<>proposedEvent.StartTime || priorEvent.DurationMinutes<>proposedEvent.DurationMinutes || priorEvent.DecisionStatus<>proposedEvent.DecisionStatus,
                          Collect(colPlannerLayerImpact,{ChangeType:"Change",EventName:proposedEvent.EventName,BeforeValue:Text(priorEvent.EventDate,"mmm d")&" "&Text(priorEvent.StartTime,"h:mm AM/PM")&" · "&priorEvent.DecisionStatus,AfterValue:Text(proposedEvent.EventDate,"mmm d")&" "&Text(proposedEvent.StartTime,"h:mm AM/PM")&" · "&proposedEvent.DecisionStatus})
                        )
                      )
                    );
                    ForAll(
                      Filter(colCalProofEvents,PlanYear=varPlannerYear && PlanningLayer=varPlannerActiveLayer && SourceType="Generated") As priorEvent,
                      If(
                        IsBlank(LookUp(colPlannerLayerPreview,EventId=priorEvent.EventId)),
                        Collect(colPlannerLayerImpact,{ChangeType:"Remove",EventName:priorEvent.EventName,BeforeValue:Text(priorEvent.EventDate,"mmm d")&" "&Text(priorEvent.StartTime,"h:mm AM/PM"),AfterValue:"—"})
                      )
                    )
                  Text: =""
                  Visible: =false
                  Width: =0
            - conPlannerHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semilight
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: =If(App.Width<900,188,92)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width<900,LayoutDirection.Vertical,LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =14
                  PaddingLeft: =18
                  PaddingRight: =18
                  PaddingTop: =14
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                Children:
                  - conPlannerTitle:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtPlannerTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="Calendar Planner for " & Text(varPlannerYear)
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(31,41,55,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =26
                              Text: ="Calendar Planner " & Text(varPlannerYear)
                              Wrap: =false
                        - txtPlannerSubtitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(102,112,133,1)
                              Font: =Font.'Segoe UI'
                              Height: =20
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: ="Shared planner · " & Coalesce(varPlannerPersistenceStatus,"Loading saved plan") & " · Outlook connection coming next"
                              Wrap: =false
                  - conPlannerYearAndViews:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =52
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =IsBlank(varPlannerEditorFromView)
                        Width: =If(App.Width<900,Parent.Width,820)
                      Children:
                        - drpPlannerYear:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: ="Plan year"
                              Default: ={Value:varPlannerYear-2025,PlanYear:varPlannerYear}
                              Height: =44
                              ItemDisplayText: =ThisItem.PlanYear
                              Items: =AddColumns(Sequence(11),PlanYear,Value+2025)
                              LayoutMinWidth: =110
                              OnChange: |-
                                =Set(varPlannerYear,Self.Selected.PlanYear);
                                Set(varPlannerFocusedDate,Date(varPlannerYear,1,1));
                                Set(varPlannerSelectedEventId,"");
                                Set(varPlannerSelectedClosureId,"");
                                If(!varPlannerDraftDirty,Set(varPlannerContextMode,"Empty"));
                                Set(varPlannerHydratedYear,0);
                                Select(btnPlannerHydrateYear)
                              Width: =120
                        - btnPlannerYearView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show year view"
                              Appearance: =If(varPlannerView="Year",ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(91,59,127,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =90
                              OnSelect: =Set(varPlannerView,"Year")
                              Text: ="Year"
                        - btnPlannerMonthView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show month view"
                              Appearance: =If(varPlannerView="Month",ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(91,59,127,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =90
                              OnSelect: |
                                =Set(varPlannerView,"Month");Set(varPlannerFocusedDate,Date(varPlannerYear,Month(varPlannerFocusedDate),1));Set(varPlannerSelectedEventId,"");Set(varPlannerSelectedClosureId,"");Set(varPlannerReceipt,"");Set(varPlannerContextMode,"Empty");Navigate(CalendarPlannerMonth,ScreenTransition.None)
                              Text: ="Month"
                        - btnPlannerWeekView:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Show week view"
                              Appearance: =If(varPlannerView="Week",ButtonAppearance.Primary,ButtonAppearance.Outline)
                              BasePaletteColor: =RGBA(91,59,127,1)
                              FillPortions: =1
                              Height: =44
                              LayoutMinWidth: =90
                              OnSelect: =Set(varPlannerView,"Week");Set(varPlannerReceipt,"");Navigate(CalendarPlannerWeek,ScreenTransition.None)
                              Text: ="Week"
                        - btnPlannerOutlookReadOnly:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Sync with Outlook is coming next and is not available in this planning-only build"
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(102,112,133,1)
                              DisplayMode: =DisplayMode.Disabled
                              Height: =44
                              LayoutMinWidth: =190
                              Text: ="Sync with Outlook"
                        - btnPlannerRuleBook:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="Open the Rule Book"
                              Appearance: =ButtonAppearance.Outline
                              BasePaletteColor: =RGBA(91,59,127,1)
                              Height: =44
                              LayoutMinWidth: =104
                              OnSelect: =Set(varBrvSelectedRuleId,Coalesce(First(SortByColumns(colMeetingRulebook,"SortOrder",SortOrder.Ascending)).RuleId,varBrvSelectedRuleId));Navigate(BoardRulesReview,ScreenTransition.None)
                              Text: ="Rule Book"
            - conPlannerBoardWorkflow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =RGBA(203,213,225,1)
                  BorderThickness: =If(Self.Height=0,0,1)
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255,255,255,1)
                  FillPortions: =0
                  Height: |-
                    =If(varPlannerShowLayerPreview && varPlannerLayerPreviewReady,
                      If(CountRows(colPlannerUnmappedExclusions)+CountRows(colPlannerUnmappedOverrides)>0,304,0)+If(App.Width<1100,158,102)+If(!IsBlank(varPlannerLayerReceipt),48,0)+24,
                      If(!IsBlank(varPlannerLayerReceipt),62,0))
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =If(Self.Height=0,0,12)
                  PaddingLeft: =14
                  PaddingRight: =14
                  PaddingTop: =If(Self.Height=0,0,12)
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                Children:
                  - conPlannerRecurrenceMapping:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(154,91,0,1)
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255,251,235,1)
                        FillPortions: =0
                        Height: =If(Self.Visible,294,0)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =10
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =10
                        Visible: =varPlannerShowLayerPreview && varPlannerLayerPreviewReady && CountRows(colPlannerUnmappedExclusions)+CountRows(colPlannerUnmappedOverrides)>0
                      Children:
                        - txtPlannerMappingHeading:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Color: =RGBA(154,91,0,1)
                              Font: =Font.'Segoe UI'
                              Height: =28
                              Text: |-
                                ="Rule changed: decide how to carry forward " & Text(CountRows(colPlannerUnmappedExclusions)+CountRows(colPlannerUnmappedOverrides)) & " unmatched occurrence(s)"
                        - txtPlannerMappingOld:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Color: =RGBA(30,41,59,1)
                              Font: =Font.'Segoe UI'
                              Height: =48
                              Size: =12
                              Text: |-
                                =With({old:If(CountRows(colPlannerUnmappedExclusions)>0,First(colPlannerUnmappedExclusions),First(colPlannerUnmappedOverrides))},"Old occurrence: "&old.EventName&" · "&Text(old.OriginalGeneratedDate,"mmm d, yyyy")&" · "&If(CountRows(colPlannerUnmappedExclusions)>0,"Deleted by user",First(colPlannerUnmappedOverrides).IsProtected,"Manual move or approved exception","Generated occurrence")&Char(10)&"Stable meeting ID: "&old.EventId&" · Prior status: "&If(CountRows(colPlannerUnmappedExclusions)>0,"Deleted",First(colPlannerUnmappedOverrides).PreviousStatus))
                        - txtPlannerMappingProposed:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Color: =RGBA(102,112,133,1)
                              Font: =Font.'Segoe UI'
                              Height: =44
                              Size: =11
                              Text: |-
                                =With({old:If(CountRows(colPlannerUnmappedExclusions)>0,First(colPlannerUnmappedExclusions),First(colPlannerUnmappedOverrides))},With({proposed:SortByColumns(Filter(colPlannerLayerPreview,SourceRuleId=old.RuleId),"OriginalGeneratedDate",SortOrder.Ascending)},"New proposed occurrences for the same rule ("&Text(CountRows(proposed))&"): "&If(CountRows(proposed)=0,"none",Concat(FirstN(proposed,6),Text(EventDate,"mmm d")&" "&Text(StartTime,"h:mm AM/PM")," · ")&If(CountRows(proposed)>6," · +"&Text(CountRows(proposed)-6)&" more in the selector",""))))
                        - drpPlannerMappingCandidate:
                            Control: ModernDropdown
                            Properties:
                              AccessibleLabel: ="Choose which proposed occurrence inherits the old meeting decision"
                              Height: =44
                              ItemDisplayText: =ThisItem.EventName&" · "&Text(ThisItem.EventDate,"mmm d, yyyy")&" "&Text(ThisItem.StartTime,"h:mm AM/PM")
                              Items: =With({old:If(CountRows(colPlannerUnmappedExclusions)>0,First(colPlannerUnmappedExclusions),First(colPlannerUnmappedOverrides))},Filter(colPlannerLayerPreview As proposal,proposal.SourceRuleId=old.RuleId && IsBlank(LookUp(colCalProofEvents,EventId=proposal.EventId && PlanYear=varPlannerYear)) && IsBlank(LookUp(colPlannerPendingExclusionMappings,RuleSlotId=proposal.RuleSlotId))))
                              OnChange: =Set(varPlannerMappingSelectedSlot,Self.Selected.RuleSlotId)
                        - conPlannerMappingActions:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =48
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - btnPlannerMapOldOccurrence:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Carry the old occurrence decision onto the selected proposed occurrence"
                                    BasePaletteColor: =RGBA(91,59,127,1)
                                    DisplayMode: =If(IsBlank(varPlannerMappingSelectedSlot) || IsBlank(LookUp(colPlannerLayerPreview,RuleSlotId=varPlannerMappingSelectedSlot)),DisplayMode.Disabled,DisplayMode.Edit)
                                    FillPortions: =1
                                    Height: =44
                                    LayoutMinWidth: =160
                                    OnSelect: |-
                                      =With(
                                        {candidate:LookUp(colPlannerLayerPreview,RuleSlotId=varPlannerMappingSelectedSlot)},
                                        If(
                                          !IsBlank(candidate.EventId) && CountRows(colPlannerUnmappedExclusions)>0,
                                          With(
                                            {old:First(colPlannerUnmappedExclusions)},
                                            Collect(colPlannerPendingExclusionMappings,{EventId:old.EventId,RuleSlotId:candidate.RuleSlotId,MappingDecision:"Mapped"});
                                            RemoveIf(colPlannerLayerPreview,RuleSlotId=candidate.RuleSlotId);
                                            Remove(colPlannerUnmappedExclusions,old)
                                          ),
                                          !IsBlank(candidate.EventId) && CountRows(colPlannerUnmappedOverrides)>0,
                                          With(
                                            {old:First(colPlannerUnmappedOverrides),prior:LookUp(colCalProofEvents,EventId=First(colPlannerUnmappedOverrides).EventId && PlanYear=varPlannerYear)},
