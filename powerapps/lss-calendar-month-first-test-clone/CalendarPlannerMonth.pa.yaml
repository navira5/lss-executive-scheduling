                                      =If(IsPlannerHardStop(varPlannerDraftDate),If(Weekday(varPlannerDraftDate,StartOfWeek.Monday)>5,"Hard stop: meetings cannot be scheduled on weekends.","Hard stop: " & LookUp(colCalProofClosures,ClosureDate=varPlannerDraftDate && IsActive,ClosureName) & ". Choose another date."),If(CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventId<>varPlannerSelectedEventId && EventDate=varPlannerDraftDate && StartTime<Time(0,0,0)+Time(0,varPlannerDraftDuration,0)+varPlannerDraftStart && EndTime>varPlannerDraftStart)>0,"Warning: this overlaps another planned meeting.","This move differs from the generated cadence. Acknowledge before confirming."))
                              - btnPlannerMonthAcknowledge:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Acknowledge move warning"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =If(varPlannerWarningAcknowledged,ButtonAppearance.Primary,ButtonAppearance.Outline)
                                    BasePaletteColor: =RGBA(154,91,0,1)
                                    Height: =40
                                    OnSelect: =Set(varPlannerWarningAcknowledged,!varPlannerWarningAcknowledged)
                                    Text: =If(varPlannerWarningAcknowledged,"✓ Warning acknowledged","Acknowledge warning")
                                    Visible: =!IsPlannerHardStop(varPlannerDraftDate) && (CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventId<>varPlannerSelectedEventId && EventDate=varPlannerDraftDate && StartTime<Time(0,0,0)+Time(0,varPlannerDraftDuration,0)+varPlannerDraftStart && EndTime>varPlannerDraftStart)>0 || (LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,SourceType)="Generated" && (varPlannerDraftDate<>LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventDate) || varPlannerDraftStart<>LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,StartTime))))
                                    Width: =Parent.Width
                              - btnPlannerMonthSaveMove:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Confirm move"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BasePaletteColor: =RGBA(91,59,127,1)
                                    DisplayMode: |-
                                      =If(
                                        LookUp(colPlannerLayerState,PlanningLayer=LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,PlanningLayer),Status)="Confirmed" ||
                                        IsPlannerHardStop(varPlannerDraftDate) ||
                                        (varPlannerDraftDate=LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventDate) && varPlannerDraftStart=LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,StartTime) && varPlannerDraftDuration=LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,DurationMinutes)) ||
                                        ((CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventId<>varPlannerSelectedEventId && EventDate=varPlannerDraftDate && StartTime<Time(0,0,0)+Time(0,varPlannerDraftDuration,0)+varPlannerDraftStart && EndTime>varPlannerDraftStart)>0 || (LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,SourceType)="Generated" && (varPlannerDraftDate<>LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,EventDate) || varPlannerDraftStart<>LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId,StartTime)))) && !varPlannerWarningAcknowledged),
                                        DisplayMode.Disabled,
                                        DisplayMode.Edit
                                      )
                                    Height: =44
                                    OnSelect: |-
                                      =With(
                                        {selectedEvent:LookUp(colCalProofEvents,EventId=varPlannerSelectedEventId)},
                                        With(
                                          {previousDate:selectedEvent.EventDate,previousStart:selectedEvent.StartTime,previousEnd:selectedEvent.EndTime,previousStatus:selectedEvent.DecisionStatus,originalGeneratedDate:selectedEvent.OriginalGeneratedDate,eventName:selectedEvent.EventName,eventId:selectedEvent.EventId},
                                          ClearCollect(colPlannerUndo,{Action:"Move",SubjectId:eventId,EventName:eventName,PreviousDate:previousDate,PreviousStart:previousStart,PreviousEnd:previousEnd,PreviousStatus:previousStatus,PreviousActive:false,SnapshotEvent:selectedEvent,SnapshotClosure:First(colCalProofClosures)});
                                          Patch(colCalProofEvents,selectedEvent,{EventDate:varPlannerDraftDate,CurrentDate:varPlannerDraftDate,StartTime:varPlannerDraftStart,EndTime:DateAdd(varPlannerDraftStart,varPlannerDraftDuration,TimeUnit.Minutes),DurationMinutes:varPlannerDraftDuration,IsManualOverride:true,DecisionStatus:If(varPlannerWarningAcknowledged,"NeedsReview","Ready"),WarningAcknowledged:varPlannerWarningAcknowledged});
                                          With(
                                            {changedState:LookUp(colPlannerLayerState,PlanningLayer=selectedEvent.PlanningLayer)},
                                            UpdateIf(colPlannerLayerState,StepNumber>changedState.StepNumber && Status<>"Not started",{Status:"Needs revalidation",NeedsRegeneration:true})
                                          );
                                          Set(varPlannerReceipt,eventName & " moved from " & Text(previousDate,"mmm d") & " at " & Text(previousStart,"h:mm AM/PM") & " to " & Text(varPlannerDraftDate,"mmm d") & " at " & Text(varPlannerDraftStart,"h:mm AM/PM") & ". Original generated date remains " & Text(originalGeneratedDate,"mmm d") & ".");
                                          ClearCollect(colPlannerMutationReceipt,{ReceiptType:"Move",SubjectId:eventId,EventName:eventName,SourceType:selectedEvent.SourceType,SourceRuleId:selectedEvent.SourceRuleId,PlanningLayer:selectedEvent.PlanningLayer,Category:selectedEvent.Category,EventDate:varPlannerDraftDate,StartTime:varPlannerDraftStart,DurationMinutes:varPlannerDraftDuration,DecisionStatus:If(varPlannerWarningAcknowledged,"NeedsReview","Ready"),Summary:varPlannerReceipt,OccurredAt:Now()});
                                          Collect(colPlannerHistory,{ChangeId:"CHG-" & Text(Now(),"yyyymmddhhmmss"),Action:"Move",SubjectId:eventId,Summary:varPlannerReceipt,ChangedAt:Now()})
                                        )
                                      );
                                      Set(varPlannerFocusedDate,varPlannerDraftDate);
                                      Set(varPlannerDraftDirty,false);
                                      Set(varPlannerContextMode,"Summary");
                                      Select(btnPlannerMonthPersistSelected)
                                    Text: ="Confirm move"
                                    Width: =Parent.Width
                              - btnPlannerMonthCancelMove:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Cancel move"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(102,112,133,1)
                                    Height: =42
                                    OnSelect: =Set(varPlannerDraftDirty,false);Set(varPlannerContextMode,"Summary")
                                    Text: ="Cancel"
                                    Width: =Parent.Width
                        - txtPlannerMonthReceipt:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(37,122,84,1)
                              Fill: =RGBA(240,253,244,1)
                              Font: =Font.'Segoe UI'
                              Height: =190
                              LayoutMinWidth: =0
                              PaddingBottom: =8
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =8
                              Size: =12
                              Text: |-
                                =With(
                                  {receipt:First(colPlannerMutationReceipt)},
                                  "✓ " & receipt.ReceiptType & Char(10) &
                                  "Meeting: " & receipt.EventName & Char(10) &
                                  "Event ID: " & receipt.SubjectId & Char(10) &
                                  "Change: " & receipt.Summary & Char(10) &
                                  "Original generated: " & Text(LookUp(colCalProofEvents,EventId=receipt.SubjectId,OriginalGeneratedDate),"mmm d, yyyy") & Char(10) &
                                  "Current placement: " & Text(receipt.EventDate,"mmm d, yyyy") & " · " & Text(receipt.StartTime,"h:mm AM/PM") & " · " & Text(receipt.DurationMinutes) & " min" & Char(10) &
                                  "Decision: " & receipt.DecisionStatus & " · Manual override: " & If(LookUp(colCalProofEvents,EventId=receipt.SubjectId,IsManualOverride),"Yes","No") & " · Warning acknowledged: " & If(LookUp(colCalProofEvents,EventId=receipt.SubjectId,WarningAcknowledged),"Yes","No")
                                )
                              VerticalAlign: =VerticalAlign.Top
                              Visible: =CountRows(colPlannerMutationReceipt)>0
