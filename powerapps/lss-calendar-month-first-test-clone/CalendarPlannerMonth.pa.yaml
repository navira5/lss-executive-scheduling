                              - txtPlannerMonthBlockImpact:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Color: =RGBA(154,91,0,1)
                                    Fill: =RGBA(255,251,235,1)
                                    Font: =Font.'Segoe UI'
                                    Height: =74
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =10
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: |-
                                      =With(
                                        {lockedCount:CountRows(Filter(colCalProofEvents As blockEvent,blockEvent.PlanYear=varPlannerYear && blockEvent.EventDate=varPlannerDraftDate && LookUp(colPlannerLayerState,PlanningLayer=blockEvent.PlanningLayer,Status)="Confirmed"))},
                                        If(lockedCount>0,"A confirmed planning layer has a meeting on this date. Reopen that layer before blocking the date.",CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=varPlannerDraftDate)>0 && IsBlank(GetNextPlannerBusinessDate(DateAdd(varPlannerDraftDate,1,TimeUnit.Days),varPlannerYear)),"Move the affected meetings first; no business day remains in this planning year.",Text(CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=varPlannerDraftDate)) & " meeting" & If(CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=varPlannerDraftDate)=1,"","s") & " will be affected. Each will be proposed on the next valid business date and marked Needs approval.")
                                      )
                              - btnPlannerMonthSaveBlock:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="Create blocked date"
                                    BasePaletteColor: =RGBA(154,91,0,1)
                                    DisplayMode: =If(IsBlank(Trim(varPlannerOverrideReason)) || CountIf(colCalProofClosures,ClosureDate=varPlannerDraftDate && IsActive)>0 || CountRows(Filter(colCalProofEvents As blockEvent,blockEvent.PlanYear=varPlannerYear && blockEvent.EventDate=varPlannerDraftDate && LookUp(colPlannerLayerState,PlanningLayer=blockEvent.PlanningLayer,Status)="Confirmed"))>0 || (CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=varPlannerDraftDate)>0 && IsBlank(GetNextPlannerBusinessDate(DateAdd(varPlannerDraftDate,1,TimeUnit.Days),varPlannerYear))),DisplayMode.Disabled,DisplayMode.Edit)
                                    Height: =44
                                    OnSelect: |-
                                      =With(
                                        {newBlockId:"BLOCK-" & Text(GUID()),impactCount:CountIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=varPlannerDraftDate)},
                                        Collect(colCalProofClosures,{ClosureId:newBlockId,ClosureName:varPlannerOverrideReason,ClosureLabel:"Blocked",ClosureDate:varPlannerDraftDate,PlanYear:varPlannerYear,ClosureType:"User block",IsActive:true,Source:"User",OverrideReason:varPlannerOverrideReason,ChangedAt:Now()});
                                        ClearCollect(colPlannerUndo,{Action:"Block",SubjectId:newBlockId,EventName:varPlannerOverrideReason,PreviousDate:varPlannerDraftDate,PreviousStart:Time(0,0,0),PreviousEnd:Time(0,0,0),PreviousStatus:"",PreviousActive:false,SnapshotEvent:First(colCalProofEvents),SnapshotClosure:LookUp(colCalProofClosures,ClosureId=newBlockId)});
                                        With(
                                          {nextBusinessDate:GetNextPlannerBusinessDate(DateAdd(varPlannerDraftDate,1,TimeUnit.Days),varPlannerYear)},
                                          UpdateIf(colCalProofEvents,PlanYear=varPlannerYear && EventDate=varPlannerDraftDate,{EventDate:nextBusinessDate,CurrentDate:nextBusinessDate,AutoAdjusted:true,AdjustmentReason:"Proposed next business day after blocked date",AdjustmentSourceName:varPlannerOverrideReason,DecisionStatus:"NeedsReview",WarningAcknowledged:false})
                                        );
                                        Set(varPlannerReceipt,"Blocked " & Text(varPlannerDraftDate,"mmm d, yyyy") & ". " & Text(impactCount) & " affected meeting" & If(impactCount=1," was","s were") & " proposed on the next valid business date for human review.");
                                        Collect(colPlannerHistory,{ChangeId:"CHG-" & Text(Now(),"yyyymmddhhmmss"),Action:"Block",SubjectId:newBlockId,Summary:varPlannerReceipt,ChangedAt:Now()})
                                      );
                                      Set(varPlannerDraftDirty,false);
                                      Set(varPlannerContextMode,"Empty");
                                      Set(varPlannerEditorFromView,"");
                                      Select(btnPlannerMonthPersistSelected)
                                    Text: ="Block date"
                                    Width: =Parent.Width
                              - btnPlannerMonthCancelBlock:
